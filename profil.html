<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Mon Profil - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; padding-top: 62px; }
        
        .profile-layout { padding: 20px; display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
        .avatar-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 14px; }
        .avatar-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; background: #222; }
        .avatar-upload-btn { position: absolute; bottom: 4px; right: 4px; width: 30px; height: 30px; background: var(--primary); border: 2px solid var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8em; }
        #avatar-file-input { display: none; }
        .profile-username { font-size: 1.3em; font-weight: 800; color: white; margin-bottom: 4px; }
        .profile-google-name { font-size: 0.75em; color: #555; margin-bottom: 12px; }
        .edit-pseudo-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .edit-pseudo-row input { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 7px 10px; border-radius: 6px; font-size: 0.85em; }
        .edit-pseudo-row button { background: var(--primary); color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .profile-meta { font-size: 0.78em; color: #666; line-height: 1.8; }
        .btn-playlist-public { background: #5865F2; color: white; border: none; padding: 6px 12px; border-radius: 20px; margin-top: 10px; font-size: 0.75em; cursor: pointer; text-decoration: none; display: inline-block; }
        .stats-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .stats-card h3 { font-size: 0.75em; text-transform: uppercase; color: var(--primary); margin: 0 0 14px; }
        .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #222; font-size: 0.85em; }
        .stat-row .label { color: #888; }
        .stat-row .value { font-weight: bold; color: white; }
        .status-bars { margin-top: 14px; }
        .status-bar-item { margin-bottom: 10px; }
        .status-bar-item .bar-label { display: flex; justify-content: space-between; font-size: 0.78em; color: #888; margin-bottom: 4px; }
        .bar-track { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; }
        .bar-watching { background: var(--accent-green); }
        .bar-completed { background: var(--accent-blue); }
        .bar-waiting { background: var(--accent-yellow); }
        .score-avg-display { text-align: center; padding: 12px 0 4px; }
        .score-avg-number { font-size: 2.8em; font-weight: 900; color: var(--accent-yellow); line-height: 1; }
        .score-stars { font-size: 1.1em; color: var(--accent-yellow); margin-top: 6px; letter-spacing: 2px; }
        .main-content .section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .section h2 { font-size: 0.85em; text-transform: uppercase; color: var(--primary); margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
        .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1f1f1f; }
        .activity-img { width: 36px; height: 50px; border-radius: 4px; object-fit: cover; background: #222; flex-shrink: 0; }
        .activity-body { flex: 1; min-width: 0; }
        .activity-title { font-size: 0.88em; font-weight: bold; color: white; text-decoration: none; }
        .activity-title:hover { color: var(--primary); }
        .activity-detail { font-size: 0.75em; color: #888; margin-top: 2px; }
        .activity-detail .tag { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-right: 5px; }
        .tag-added { background: rgba(46,134,222,0.2); color: #2e86de; }
        .tag-ep { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .tag-rated { background: rgba(241,196,15,0.2); color: #f1c40f; }
        .tag-finished { background: rgba(255,71,87,0.2); color: #ff4757; }
        .activity-time { font-size: 0.7em; color: #555; flex-shrink: 0; }
        .comment-item { padding: 10px 0; border-bottom: 1px solid #1f1f1f; }
        .comment-anime-link { font-size: 0.8em; font-weight: bold; color: white; text-decoration: none; }
        .comment-anime-link:hover { color: var(--primary); }
        .comment-text { font-size: 0.85em; color: #ccc; margin: 4px 0 0; }
        .comment-time { font-size: 0.7em; color: #555; margin-top: 3px; }
        .recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
        .recent-card { text-decoration: none; color: inherit; }
        .recent-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; border: 1px solid #333; }
        .recent-card:hover img { border-color: var(--primary); }
        .recent-card .rc-title { font-size: 0.7em; color: #aaa; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .score-dist { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin-top: 8px; }
        .score-dist-bar { flex: 1; background: rgba(241,196,15,0.15); border-radius: 3px 3px 0 0; position: relative; cursor: default; }
        .score-dist-bar .bar-val { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 0.65em; color: #666; }
        .score-dist-bar .bar-count { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 0.65em; color: #888; }
        .not-logged { text-align: center; padding: 80px 20px; color: #666; }
        .not-logged h2 { color: var(--primary); margin-bottom: 10px; }
        .btn-login { display: inline-block; margin-top: 20px; background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; }
        
        .profile-panel { width: calc(100% - 2 * clamp(12px, 4vw, 40px)); max-width: 1100px; margin: 20px auto 0; background: rgba(14,14,16,0.82); border: 1px solid #2c2c31; border-radius: 2px; }
        .page-tabs { display: flex; gap: 0; padding: 0 4px; background: rgba(255,255,255,0.035); border-bottom: 1px solid #2c2c31; }
        .page-tab { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; border-radius: 0; color: #b9b9bd; padding: 13px 16px; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.15s, background 0.15s; }
        .page-tab.active { color: #fff; border-bottom-color: var(--primary); background: rgba(255,71,87,0.09); }
        .page-tab:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.04); }
        .tab-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
        .tab-icon svg { width: 13px; height: 13px; stroke: currentColor; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 4px 0; }
        @media (max-width: 600px) { .community-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; } }
        .member-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 12px; text-align: center; text-decoration: none; color: inherit; transition: border-color 0.2s; display: block; }
        .member-card:hover { border-color: var(--primary); }
        .member-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--border); object-fit: cover; margin: 0 auto 10px; display: block; }
        .member-card:hover .member-avatar { border-color: var(--primary); }
        .member-name { font-weight: 700; font-size: 0.9em; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-sub { font-size: 0.7em; color: #555; margin-top: 3px; }
        .upload-spinner { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); border-radius: 50%; align-items: center; justify-content: center; font-size: 1.2em; }
        .upload-spinner.active { display: flex; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(60px); background: #222; color: white; padding: 10px 22px; border-radius: 8px; font-size: 0.88em; border: 1px solid #444; transition: transform 0.3s, opacity 0.3s; opacity: 0; z-index: 9999; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (max-width: 800px) { .profile-layout { grid-template-columns: 1fr; padding: 16px 14px 24px; } .avatar-img { width: 85px; height: 85px; } .recent-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); } }
    </style>
</head>
<body>
    <div id="bg-layer"></div>

    <header class="site-header">

    <div id="root">
        <div class="not-logged" id="not-logged-block">
            <h2>Connexion requise</h2>
            <p>Connecte-toi pour accéder à ton profil.</p>
            <button class="btn-login" id="btn-login-page">Se connecter avec Google</button>
        </div>

    <div class="profile-panel">
        <div id="tabs-bar" class="page-tabs" style="display:none;">
            <button class="page-tab active" id="tab-btn-profil" onclick="switchTab('profil')">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></span>
                Mon Profil
            </button>
            <button class="page-tab" id="tab-btn-community" onclick="switchTab('community')">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
                Communauté Malicieuse
            </button>
        </div>
        <div id="tab-profil" class="tab-content active"></div>
        <div id="tab-community" class="tab-content">
            <div style="padding:20px;">
                <div class="main-content">
                    <div class="section" style="background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:20px;">
                        <h2 style="font-size:0.85em; text-transform:uppercase; color:var(--primary); margin:0 0 16px;">Membres de la communauté</h2>
                        <div id="community-grid" class="community-grid"><div style="color:#555;">Chargement…</div></div>
                    </div>
                    <div id="public-profile-container" style="display:none; margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <input type="file" id="avatar-file-input" accept="image/*">

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, handleImgError, IMG_LOGO,
        auth, db, onAuthStateChanged, signInWithPopup, provider,
        doc, getDoc, setDoc, collection, query, where, getDocs,
        getCurrentUser
    } from './common.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    initCommon();
    const storage = getStorage();

    let allAnimesForSearch = [];
    let csvDataMap = {};

    async function loadAnimesForSearch() {
        try {
            const animes = await loadAnimes();
            animes.forEach(a => {
                allAnimesForSearch.push({ nom: a.nom, ordreAjout: a.ordreAjout });
                csvDataMap[a.nom] = a;
            });
        } catch(e) {}
    }
    loadAnimesForSearch();

    const searchInput = document.getElementById('search');
    const searchSuggestions = document.getElementById('search-suggestions');
    searchInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (val.length < 2) { searchSuggestions.classList.remove('active'); return; }
        const results = allAnimesForSearch.filter(a => a.nom.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
        if (results.length === 0) {
            searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
        } else {
            searchSuggestions.innerHTML = results.map(a => 
                `<div class="suggestion-item" data-name="${a.nom.replace(/"/g,'&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${a.nom}</span></div>`
            ).join('');
        }
        searchSuggestions.classList.add('active');
    });
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const val = this.value.trim();
            if (val) window.location.href = 'index.html?search=' + encodeURIComponent(val);
            searchSuggestions.classList.remove('active');
            this.blur();
        }
    });
    searchSuggestions.addEventListener('click', function(e) {
        const item = e.target.closest('.suggestion-item');
        if (item && item.dataset.name) window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrapper')) searchSuggestions.classList.remove('active');
    });

    function toast(msg, duration = 2500) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function timeAgo(ts) {
        if (!ts) return '';
        const diff = Date.now() - (ts.seconds ? ts.seconds * 1000 : ts);
        const m = Math.floor(diff / 60000);
        if (m < 1) return "à l'instant";
        if (m < 60) return `il y a ${m} min`;
        const h = Math.floor(m / 60);
        if (h < 24) return `il y a ${h}h`;
        const d = Math.floor(h / 24);
        if (d < 30) return `il y a ${d}j`;
        return `il y a ${Math.floor(d/30)} mois`;
    }

    function starsHtml(score) {
        const full = Math.floor(score / 2);
        const half = (score % 2) >= 1 ? 1 : 0;
        const empty = 5 - full - half;
        return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    }

    function formatDate(isoOrTs) {
        if (!isoOrTs) return '—';
        const d = typeof isoOrTs === 'string' ? new Date(isoOrTs) : new Date(isoOrTs.seconds * 1000);
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function formatAddedAt(ts) {
        if (!ts) return '';
        const moisFR = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
        const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
        return `${d.getDate()} ${moisFR[d.getMonth()]} ${d.getFullYear()} à ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
    }

    document.getElementById('btn-login-page').onclick = () => signInWithPopup(auth, provider);

    const urlParams = new URLSearchParams(window.location.search);
    const publicUid = urlParams.get('uid');

    window.switchTab = function(tab) {
        document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-btn-' + tab).classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    };

    if (publicUid) {
        document.getElementById('not-logged-block').style.display = 'none';
    }

    onAuthStateChanged(auth, async (user) => {
        if (publicUid) {
            await buildPublicProfile(publicUid, user);
        } else if (user) {
            await buildProfile(user);
        }
    });

    async function getOwnAnimes(uid) {
        const [playlistSnap, sharedCustomSnap] = await Promise.all([
            getDocs(query(collection(db, "playlists"), where("uid", "==", uid))),
            getDocs(query(collection(db, "playlists_custom"), where("uid", "==", uid), where("shared", "==", true)))
        ]);
        const sharedNames = new Set();
        sharedCustomSnap.forEach(d => sharedNames.add(d.data().name));
        const animes = [];
        playlistSnap.forEach(d => {
            const a = { id: d.id, ...d.data() };
            if (!sharedNames.has(a.playlistTarget)) animes.push(a);
        });
        return animes;
    }

    async function buildPublicProfile(uid, currentUser) {
        document.getElementById('tabs-bar').style.display = 'flex';
        switchTab('community');

        const container = document.getElementById('public-profile-container');
        container.style.display = 'block';
        document.getElementById('community-grid').style.display = 'none';
        container.innerHTML = `<div style="color:#555; font-size:0.85em; padding:20px;">Chargement…</div>`;

        const userSnap = await getDoc(doc(db, "users", uid));
        if (!userSnap.exists()) {
            container.innerHTML = `<div class="not-logged"><h2>Profil introuvable</h2><p>Cet utilisateur n'existe pas.</p></div>`;
            return;
        }
        const userData = userSnap.data();
        const pseudo = userData.pseudo || userData.displayName || 'Utilisateur';
        const avatarUrl = userData.photoURL || IMG_LOGO;
        const createdAt = userData.createdAt || null;
        document.title = `${pseudo} - Le Malicieux`;

        container.innerHTML = `
            <div style="margin-bottom:12px;">
                <button onclick="document.getElementById('public-profile-container').style.display='none'; document.getElementById('community-grid').style.display='grid'; history.pushState({},'','profil.html');" style="background:#222; border:1px solid #444; color:#ccc; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:0.8em;">Retour à la communauté</button>
            </div>
            <div id="public-shell"></div>`;

        renderProfileShellInto('public-shell', null, pseudo, avatarUrl, createdAt, null, false, uid);

        const animes = await getOwnAnimes(uid);
        const ctx = document.getElementById('public-shell');
        renderStats(animes, ctx);
        renderActivity(animes, ctx);
        renderRecentAnimes(animes, ctx);
        renderScoreDist(animes, ctx);
        renderComments(uid, ctx);
        await loadCommunity(currentUser);
    }

    async function buildProfile(user) {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        let userData = userSnap.exists() ? userSnap.data() : {};

        if (!userSnap.exists()) {
            userData = {
                uid: user.uid, email: user.email, displayName: user.displayName || '',
                pseudo: '', photoURL: user.photoURL || '', createdAt: new Date().toISOString(), lastSeen: new Date().toISOString(),
            };
            await setDoc(userRef, userData);
        }

        const pseudo = userData.pseudo || userData.displayName || user.displayName || 'Utilisateur';
        const avatarUrl = userData.photoURL || user.photoURL || IMG_LOGO;
        const createdAt = userData.createdAt || user.metadata?.creationTime || null;

        renderProfileShellInto('tab-profil', user, pseudo, avatarUrl, createdAt, userData.displayName || user.displayName, true, null);
        document.getElementById('tabs-bar').style.display = 'flex';
        document.getElementById('not-logged-block').style.display = 'none';

        const snap = await getDocs(query(collection(db, "playlists"), where("uid", "==", user.uid)));
        const sharedCustomSnap = await getDocs(query(collection(db, "playlists_custom"), where("uid", "==", user.uid), where("shared", "==", true)));
        const sharedNames = new Set();
        sharedCustomSnap.forEach(d => sharedNames.add(d.data().name));
        const animes = [];
        snap.forEach(d => {
            const a = { id: d.id, ...d.data() };
            if (!sharedNames.has(a.playlistTarget)) animes.push(a);
        });
        
        const ctx = document.getElementById('tab-profil');
        renderStats(animes, ctx);
        renderActivity(animes, ctx);
        renderRecentAnimes(animes, ctx);
        renderScoreDist(animes, ctx);
        renderComments(user.uid, ctx);

        document.getElementById('avatar-upload-btn').onclick = () => document.getElementById('avatar-file-input').click();
        document.getElementById('avatar-file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const spinner = document.getElementById('avatar-spinner');
            spinner.classList.add('active');
            try {
                const storageRef = ref(storage, `avatars/${user.uid}`);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                await setDoc(userRef, { photoURL: url }, { merge: true });
                document.getElementById('profile-avatar').src = url;
                sessionStorage.setItem('userAvatar', url);
                toast('Photo de profil mise à jour !');
            } catch(err) { toast('Erreur lors de l\'upload.'); }
            finally { spinner.classList.remove('active'); }
        };
        document.getElementById('btn-save-pseudo').onclick = async () => {
            const val = document.getElementById('input-pseudo').value.trim();
            if (!val) { toast('Le pseudo ne peut pas être vide.'); return; }
            if (val.length > 30) { toast('30 caractères max.'); return; }
            await setDoc(userRef, { pseudo: val }, { merge: true });
            document.getElementById('display-pseudo').textContent = val;
            sessionStorage.setItem('userPseudo', val);
            toast('Pseudo mis à jour !');
        };

        await loadCommunity(user);
    }

    async function loadCommunity(currentUser) {
        const snap = await getDocs(collection(db, "users"));
        const members = [];
        snap.forEach(d => members.push({ uid: d.id, ...d.data() }));
        members.sort((a, b) => {
            const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
            const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
            return tb - ta;
        });
        document.getElementById('community-grid').innerHTML = members.map(m => {
            const pseudo = m.pseudo || m.displayName || 'Utilisateur';
            const avatar = m.photoURL || IMG_LOGO;
            const isMe = currentUser && m.uid === currentUser.uid;
            return `<div class="member-card" onclick="openMemberProfile('${m.uid}')" style="cursor:pointer;">
                <img src="${avatar}" class="member-avatar" onerror="this.src='${IMG_LOGO}'">
                <div class="member-name">${pseudo}${isMe ? ' <span style="color:var(--primary);font-size:0.75em;">(moi)</span>' : ''}</div>
                <div class="member-sub">Membre depuis ${formatDate(m.createdAt)}</div>
            </div>`;
        }).join('');
    }

    window.openMemberProfile = async function(uid) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({}, '', `profil.html?uid=${uid}`);
        await buildPublicProfile(uid, null);
    };

    function renderProfileShellInto(containerId, user, pseudo, avatarUrl, createdAt, googleName, editable, viewUid) {
        const avatarSection = editable ? `
            <div class="avatar-wrapper">
                <img id="profile-avatar" class="avatar-img" src="${avatarUrl}" onerror="this.src='${IMG_LOGO}'">
                <div id="avatar-upload-btn" class="avatar-upload-btn" title="Changer la photo"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div id="avatar-spinner" class="upload-spinner">⏳</div>
            </div>` : `
            <div class="avatar-wrapper">
                <img id="profile-avatar" class="avatar-img" src="${avatarUrl}" onerror="this.src='${IMG_LOGO}'">
            </div>`;
        const editSection = editable ? `
            <div class="profile-google-name">Compte Google : ${googleName}</div>
            <div class="edit-pseudo-row"><input id="input-pseudo" type="text" placeholder="Changer le pseudo…" maxlength="30"><button id="btn-save-pseudo">OK</button></div>` : '';
        
        const playlistButton = (viewUid && !editable) ? `<div><a href="playlist.html?uid=${viewUid}" class="btn-playlist-public">Voir sa playlist</a></div>` : '';
        
        document.getElementById(containerId).innerHTML = `
            <div class="profile-layout">
                <div class="sidebar">
                    <div class="avatar-card">
                        ${avatarSection}
                        <div class="profile-username" id="display-pseudo">${pseudo}</div>
                        ${editSection}
                        ${playlistButton}
                        <div class="profile-meta">Membre depuis<br><span>${formatDate(createdAt)}</span></div>
                    </div>
                    <div class="stats-card"><h3>Statistiques</h3><div data-id="stat-rows"><div class="stat-row"><span class="label">Chargement…</span></div></div><div class="status-bars" data-id="status-bars"></div></div>
                    <div class="stats-card"><h3>Score moyen</h3><div class="score-avg-display"><div class="score-avg-number" data-id="avg-score">—</div><div class="score-stars" data-id="avg-stars"></div><div class="score-avg-label" data-id="avg-label">Aucune note pour l'instant</div></div></div>
                </div>
                <div class="main-content">
                    <div class="section"><h2>Activité récente</h2><div data-id="activity-feed"><div style="color:#555; font-size:0.85em;">Chargement…</div></div></div>
                    <div class="section"><h2>Derniers animes ajoutés</h2><div data-id="recent-grid" class="recent-grid"></div></div>
                    <div class="section"><h2>Commentaires</h2><div data-id="comments-feed"><div style="color:#555; font-size:0.85em;">Chargement…</div></div></div>
                    <div class="section"><h2>Distribution des scores</h2><div class="score-dist" data-id="score-dist"></div><div style="display:flex; gap:4px; margin-top:24px;">${Array.from({length:10},(_,i)=>`<div style="flex:1; text-align:center; font-size:0.65em; color:#555;">${i+1}</div>`).join('')}</div></div>
                </div>
            </div>`;
    }

    async function renderComments(uid, ctx) {
        const el = ctx.querySelector('[data-id="comments-feed"]');
        if (!el) return;
        try {
            const snap = await getDocs(query(collection(db, "commentaires"), where("uid", "==", uid)));
            if (snap.empty) { el.innerHTML = `<div style="color:#555; font-size:0.85em;">Aucun commentaire.</div>`; return; }
            const docs = snap.docs.map(d => d.data()).sort((a,b) => (b.date?.seconds||0) - (a.date?.seconds||0));
            el.innerHTML = docs.map(c => `<div class="comment-item">
                    <a href="fiche.html?name=${encodeURIComponent(c.anime)}" class="comment-anime-link">${c.anime}</a>
                    <div class="comment-text">${c.text}</div>
                    <div class="comment-time">${timeAgo(c.date)}</div>
                </div>`).join('');
        } catch(e) { el.innerHTML = `<div style="color:#555; font-size:0.85em;">Aucun commentaire.</div>`; }
    }

    function renderStats(animes, ctx) {
        const watching = animes.filter(a => a.status === 'watching').length;
        const completed = animes.filter(a => a.status === 'completed').length;
        const waiting = animes.filter(a => a.status === 'waiting').length;
        const total = animes.length;
        const totalEp = animes.reduce((s, a) => s + (parseInt(a.epSeen) || 0), 0);
        const rated = animes.filter(a => a.rating && a.rating > 0);
        const avgScore = rated.length > 0 ? (rated.reduce((s, a) => s + a.rating, 0) / rated.length).toFixed(1) : null;

        ctx.querySelector('[data-id="stat-rows"]').innerHTML = `
            <div class="stat-row"><span class="label">Total animes</span><span class="value">${total}</span></div>
            <div class="stat-row"><span class="label" style="color:#2ecc71;">En cours</span><span class="value">${watching}</span></div>
            <div class="stat-row"><span class="label" style="color:#2e86de;">Terminés</span><span class="value">${completed}</span></div>
            <div class="stat-row"><span class="label" style="color:#f1c40f;">En attente</span><span class="value">${waiting}</span></div>
            <div class="stat-row"><span class="label">Épisodes vus</span><span class="value">${totalEp.toLocaleString('fr-FR')}</span></div>
            <div class="stat-row"><span class="label">Notés</span><span class="value">${rated.length}</span></div>`;

        const pct = (n) => total > 0 ? Math.round((n / total) * 100) : 0;
        ctx.querySelector('[data-id="status-bars"]').innerHTML = `
            <div class="status-bar-item"><div class="bar-label"><span style="color:#2ecc71;">En cours</span><span>${watching}</span></div><div class="bar-track"><div class="bar-fill bar-watching" style="width:${pct(watching)}%"></div></div></div>
            <div class="status-bar-item"><div class="bar-label"><span style="color:#2e86de;">Terminés</span><span>${completed}</span></div><div class="bar-track"><div class="bar-fill bar-completed" style="width:${pct(completed)}%"></div></div></div>
            <div class="status-bar-item"><div class="bar-label"><span style="color:#f1c40f;">En attente</span><span>${waiting}</span></div><div class="bar-track"><div class="bar-fill bar-waiting" style="width:${pct(waiting)}%"></div></div></div>`;

        if (avgScore) {
            ctx.querySelector('[data-id="avg-score"]').textContent = avgScore + '/10';
            ctx.querySelector('[data-id="avg-stars"]').textContent = starsHtml(parseFloat(avgScore));
            ctx.querySelector('[data-id="avg-label"]').textContent = `Basé sur ${rated.length} note${rated.length > 1 ? 's' : ''}`;
        }
    }

    function renderActivity(animes, ctx) {
        const events = [];
        animes.forEach(a => {
            if (a.addedAt) events.push({ type: 'added', anime: a, ts: a.addedAt });
            if (a.status === 'completed' && a.completedAt) events.push({ type: 'finished', anime: a, ts: a.completedAt });
            if (a.ratedAt && a.rating) events.push({ type: 'rated', anime: a, ts: a.ratedAt });
            if (a.epUpdatedAt && a.epSeen > 0) events.push({ type: 'ep', anime: a, ts: a.epUpdatedAt });
        });
        events.sort((a, b) => {
            const ta = a.ts?.seconds ? a.ts.seconds : (a.ts ? new Date(a.ts).getTime() / 1000 : 0);
            const tb = b.ts?.seconds ? b.ts.seconds : (b.ts ? new Date(b.ts).getTime() / 1000 : 0);
            return tb - ta;
        });
        const recent = events.slice(0, 15);
        const feed = ctx.querySelector('[data-id="activity-feed"]');
        if (recent.length === 0) { feed.innerHTML = `<div style="color:#555; text-align:center; padding:20px;">Aucune activité récente.</div>`; return; }
        const tagMap = { added: { cls: 'tag-added', label: 'Ajouté' }, finished: { cls: 'tag-finished', label: 'Terminé' }, rated: { cls: 'tag-rated', label: 'Noté' }, ep: { cls: 'tag-ep', label: 'Épisode vu' } };
        feed.innerHTML = recent.map(ev => {
            const a = ev.anime; const tag = tagMap[ev.type];
            let detail = '';
            if (ev.type === 'rated') detail = `Note : ${a.rating}/10`;
            if (ev.type === 'ep') detail = `Épisode ${a.epSeen} / ${a.ep || '?'}`;
            if (ev.type === 'added') detail = `Statut : ${a.status === 'watching' ? 'En cours' : a.status === 'completed' ? 'Terminé' : 'En attente'}`;
            if (ev.type === 'finished') detail = `Terminé avec ${a.epSeen} épisode${a.epSeen > 1 ? 's' : ''}`;
            const cover = csvDataMap[a.anime] ? getCoverPath(csvDataMap[a.anime].ordreAjout, 1) : IMG_LOGO;
            return `<div class="activity-item"><img class="activity-img" src="${cover}" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><div class="activity-body"><a href="fiche.html?name=${encodeURIComponent(a.anime)}" class="activity-title">${a.anime}</a><div class="activity-detail"><span class="tag ${tag.cls}">${tag.label}</span>${detail}</div></div><div class="activity-time">${timeAgo(ev.ts)}</div></div>`;
        }).join('');
    }

    function renderRecentAnimes(animes, ctx) {
        const sorted = [...animes].filter(a => a.addedAt).sort((a, b) => (b.addedAt?.seconds || 0) - (a.addedAt?.seconds || 0)).slice(0, 12);
        const grid = ctx.querySelector('[data-id="recent-grid"]');
        if (sorted.length === 0) { grid.innerHTML = `<div style="color:#555;">Aucun anime ajouté.</div>`; return; }
        grid.innerHTML = sorted.map(a => {
            const cover = csvDataMap[a.anime] ? getCoverPath(csvDataMap[a.anime].ordreAjout, 1) : IMG_LOGO;
            return `<a href="fiche.html?name=${encodeURIComponent(a.anime)}" class="recent-card">
                <img src="${cover}" onerror="this.onerror=null;this.src='${IMG_LOGO}'">
                <div class="rc-title" style="margin-bottom:4px;">${a.anime}</div>
                <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:2px; justify-content:center;">
                    <span class="meta-badge" style="font-size:0.6em; padding:1px 4px;">${a.status === 'watching' ? 'En cours' : a.status === 'completed' ? 'Terminé' : 'En attente'}</span>
                </div>
            </a>`;
        }).join('');
    }

    function renderScoreDist(animes, ctx) {
        const counts = Array(10).fill(0);
        animes.forEach(a => { if (a.rating >= 1 && a.rating <= 10) counts[a.rating - 1]++; });
        const maxCount = Math.max(...counts, 1);
        ctx.querySelector('[data-id="score-dist"]').innerHTML = counts.map((c, i) => `<div class="score-dist-bar" style="height:${Math.round((c / maxCount) * 100)}%" title="${c} anime${c > 1 ? 's' : ''} noté${c > 1 ? 's' : ''} ${i+1}/10">${c > 0 ? `<div class="bar-count">${c}</div>` : ''}<div class="bar-val">${i+1}</div></div>`).join('');
    }
</script>
</body>
