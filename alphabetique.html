<script>
    /* ═══════════ VERROUILLAGE DU FOND ═══════════
       Sur mobile, la barre d'URL qui se rétracte au défilement modifie la hauteur du
       viewport. Comme #bg-layer était en position fixe avec inset:0 et background-size:
       cover, l'image était remise à l'échelle à chaque variation, d'où l'effet de
       grossissement. On fige donc ses dimensions en pixels, et on ne les recalcule que
       si la LARGEUR change (rotation, redimensionnement réel), jamais sur la hauteur.
       Le calcul divise par le zoom CSS de <html>, sans quoi les px seraient réduits. */
    (function () {
        var lastW = null;

        function zoomFactor() {
            var z = parseFloat(getComputedStyle(document.documentElement).zoom);
            return (!z || isNaN(z)) ? 1 : z;
        }

        function lockBackground(force) {
            var layers = [document.getElementById('bg-layer'), document.getElementById('bg-overlay')];
            if (!layers[0]) return;
            var w = document.documentElement.clientWidth;
            if (!force && lastW !== null && Math.abs(w - lastW) < 2) return; // hauteur seule : on ignore
            lastW = w;

            var z = zoomFactor();
            // Hauteur de référence = la plus grande que le viewport puisse prendre
            var h = Math.max(
                window.innerHeight || 0,
                document.documentElement.clientHeight || 0,
                (window.screen && window.screen.height) || 0
            );
            layers.forEach(function (el) {
                if (!el) return;
                el.style.width = (w / z) + 'px';
                el.style.height = (h / z) + 'px';
            });
        }

        window.addEventListener('resize', function () { lockBackground(false); });
        window.addEventListener('orientationchange', function () { setTimeout(function () { lockBackground(true); }, 250); });

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { lockBackground(true); });
        else lockBackground(true);
    })();
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCD70a-QR2nJnHBnA-FUoIGHZ7Z3VByPMk", authDomain: "le-malicieux-v2.firebaseapp.com", projectId: "le-malicieux-v2", storageBucket: "le-malicieux-v2.firebasestorage.app", messagingSenderId: "938147445933", appId: "1:938147445933:web:86f9c65ee0737e66a9da24" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        document.addEventListener('click', (e) => {
            if (e.target.closest('.js-login-btn')) signInWithPopup(auth, provider);
            if (e.target.closest('.js-logout-btn')) signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            const slots = document.querySelectorAll('.auth-ui-slot');
            if (user) {
                currentUser = user;
                await setDoc(doc(db, "users", user.uid), { uid: user.uid, email: user.email, displayName: user.displayName || '', photoURL: user.photoURL || '', lastSeen: new Date().toISOString() }, { merge: true });
                const cachedPseudo = sessionStorage.getItem('userPseudo');
                let displayName = cachedPseudo || user.displayName;
                if (!cachedPseudo) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists() && uSnap.data().pseudo) { displayName = uSnap.data().pseudo; sessionStorage.setItem('userPseudo', displayName); }
                    if (uSnap.exists() && uSnap.data().photoURL) { sessionStorage.setItem('userAvatar', uSnap.data().photoURL); }
                }
                const avatarUrl = sessionStorage.getItem('userAvatar') || user.photoURL || 'img/logo.jpg';
                const html = `<a href="profil.html" class="auth-account"><img src="${avatarUrl}" class="auth-avatar" onerror="this.src=\'img/logo.jpg\'"><span class="auth-name">${displayName}</span></a><button class="js-logout-btn auth-logout-btn">Quitter</button>`;
                slots.forEach(el => el.innerHTML = html);
            } else {
                currentUser = null;
                const html = `<button class="js-login-btn auth-login-btn">Connexion</button>`;
                slots.forEach(el => el.innerHTML = html);
            }
        });
    </script>

    <script type="module">
        // Le script original intégral, avec la fonction setBackground() et sans applyParallax().
        // On garde le script intact, seule la partie setBackground est modifiée pour ne plus faire de parallax.
        // Nous avons aussi retiré l'appel à applyParallax() dans init().

        let allAnimes = [];
        let currentFiltered = [];
        let currentDisplayMode = localStorage.getItem('alphaDisplayMode') || 'grid';

        document.getElementById('display-mode').value = currentDisplayMode;

        window.handleImgError = function(img, fileNameFromCSV) {
            if (!img.dataset.attempt) img.dataset.attempt = "1";
            const lastDotIndex = fileNameFromCSV.lastIndexOf('.');
            const base = lastDotIndex !== -1 ? fileNameFromCSV.substring(0, lastDotIndex) : fileNameFromCSV;
            if (img.dataset.attempt === "1") { img.dataset.attempt = "2"; img.src = `img/${base}.webp`; }
            else if (img.dataset.attempt === "2") { img.dataset.attempt = "3"; img.src = `img/${base}.png`; }
            else if (img.dataset.attempt === "3") { img.dataset.attempt = "4"; img.src = `img/${base}.jpg`; }
            else { img.onerror = null; img.src = 'img/logo.jpg'; }
        };

        function getGroupKey(name) {
            const first = name.trim()[0] || '';
            if (/[0-9]/.test(first)) return '#';
            const letter = first.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
            if (/[A-Z]/.test(letter)) return letter;
            return '★';
        }

        function buildAlphaNav(groups) {
            const nav = document.getElementById('alpha-nav');
            const allKeys = ['★', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
            nav.innerHTML = allKeys.map(k => {
                const hasContent = groups[k] && groups[k].length > 0;
                return `<a href="${hasContent ? '#group-' + k : '#'}" class="${hasContent ? '' : 'disabled'}">${k}</a>`;
            }).join('');
        }

        function normalize(str) {
            return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[-_.:;,!?()'"&~#|\[\]\/]/g, ' ').replace(/\s+/g, ' ').trim();
        }
        // Version sans espaces : "shingeki no kyojin" == "shingekinokyojin"
        function squash(str) { return normalize(str).replace(/ /g, ''); }

        // Distance de Levenshtein bornée (tolérance aux fautes de frappe)
        function editDistance(a, b, max) {
            if (Math.abs(a.length - b.length) > max) return max + 1;
            let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
            for (let i = 1; i <= a.length; i++) {
                const cur = [i];
                let best = i;
                for (let j = 1; j <= b.length; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
                    if (cur[j] < best) best = cur[j];
                }
                if (best > max) return max + 1;
                prev = cur;
            }
            return prev[b.length];
        }

        // Tous les caractères de la requête apparaissent dans l'ordre ? ("snk" -> "ShiNgeki no Kyojin")
        function isSubsequence(q, t) {
            let i = 0;
            for (let j = 0; j < t.length && i < q.length; j++) if (t[j] === q[i]) i++;
            return i === q.length;
        }

        // Score de pertinence : plus haut = meilleur. null = pas de correspondance.
        function matchScore(title, query) {
            const t = normalize(title), q = normalize(query);
            if (!q) return null;
            const ts = squash(t), qs = squash(q);
            if (t === q) return 1000;
            if (t.startsWith(q)) return 900 - t.length * 0.1;
            if (ts.startsWith(qs)) return 850 - ts.length * 0.1;

            const words = t.split(' ');
            if (words.some(w => w.startsWith(q))) return 800 - t.length * 0.1;
            if (t.includes(q)) return 700 - t.indexOf(q) - t.length * 0.05;
            if (ts.includes(qs)) return 650 - ts.length * 0.05;

            // Tous les mots de la requête présents, ordre libre : "titan attaque" -> "L'Attaque des Titans"
            const qWords = q.split(' ').filter(Boolean);
            if (qWords.length > 1 && qWords.every(qw => words.some(w => w.includes(qw)))) return 600;

            // Initiales / acronyme : "snk", "fmab"
            const initials = words.map(w => w[0]).join('');
            if (qs.length >= 2 && initials.startsWith(qs)) return 560;

            // Tolérance aux fautes de frappe, mot par mot
            if (qs.length >= 4) {
                const tol = qs.length <= 6 ? 1 : 2;
                for (const w of words) {
                    if (Math.abs(w.length - q.length) <= tol && editDistance(w, q, tol) <= tol) return 500;
                }
                if (Math.abs(ts.length - qs.length) <= tol && editDistance(ts, qs, tol) <= tol) return 480;
            }

            // Sous-séquence (lettres dans l'ordre) en dernier recours
            if (qs.length >= 3 && isSubsequence(qs, ts)) return 300 - ts.length * 0.05;
            return null;
        }

        function searchAnimes(query, limit) {
            const scored = [];
            for (const a of allAnimes) {
                let s = matchScore(a.nom, query);
                // On cherche aussi dans les titres alternatifs / studio si présents
                if (s === null && a.alt) { const alt = matchScore(a.alt, query); if (alt !== null) s = alt - 60; }
                if (s !== null) scored.push({ a, s });
            }
            scored.sort((x, y) => y.s - x.s || x.a.nom.localeCompare(y.a.nom, 'fr'));
            const out = scored.map(x => x.a);
            return limit ? out.slice(0, limit) : out;
        }

        function highlightTitle(title, query) {
            if (!query) return title;
            const normTitle = normalize(title);
            const normQuery = normalize(query);
            const index = normTitle.indexOf(normQuery);
            if (index === -1) return title;
            let charCount = 0, origIndex = -1;
            for (let i = 0; i < title.length; i++) {
                if (normalize(title[i]).length > 0) charCount++;
                if (charCount > index && origIndex === -1) origIndex = i;
            }
            if (origIndex === -1) return title;
            const endIndex = origIndex + query.length;
            return title.substring(0, origIndex) + '<span class="highlight">' + title.substring(origIndex, Math.min(endIndex, title.length)) + '</span>' + title.substring(Math.min(endIndex, title.length));
        }

        function normalizeSearch(str) {
            return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[-_.:;,!?()'"&~#|]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        
        // Convertit une date (française, américaine ou année seule) en timestamp pour tri précis
        function dateToTs(s){
            if(!s) return 0;
            s = s.trim();
            const mois={'janv.':1,'févr.':2,'mars':3,'avr.':4,'mai':5,'juin':6,'juil.':7,'août':8,'sept.':9,'oct.':10,'nov.':11,'déc.':12,
                        'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12};
            const parts = s.split(' au ');
            const last = parts[parts.length-1].trim();
            const m1 = last.match(/(\d{1,2})\s+([a-zéûôA-Z.]+)\s+(\d{4})/);
            if(m1){ const mo=mois[m1[2]]||1; return new Date(+m1[3], mo-1, +m1[1]).getTime(); }
            const m2 = last.match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})/);
            if(m2){ const mo=mois[m2[1]]||1; return new Date(+m2[3], mo-1, +m2[2]).getTime(); }
            const m3 = (last.match(/\d{4}/g)||[]);
            if(m3.length){ return new Date(+m3[m3.length-1], 0, 1).getTime(); }
            return 0;
        }

        function sortAnimes(list, sortMode) {
            if (!sortMode) return [...list];
            const sorted = [...list];
            if (sortMode === 'score') {
                sorted.sort((a,b) => parseFloat((b.score||'0').replace(',','.')) - parseFloat((a.score||'0').replace(',','.')));
            } else if (sortMode === 'popularite') {
                sorted.sort((a,b) => (parseInt((a.pop||'').replace('#',''))||99999) - (parseInt((b.pop||'').replace('#',''))||99999));
            } else if (sortMode === 'sortie') {
                sorted.sort((a,b) => {
                    return dateToTs(b.sortie) - dateToTs(a.sortie);
                });
            } else if (sortMode === 'episodes') {
                sorted.sort((a,b) => {
                    const ea = parseInt((a.ep||'').match(/\d+/g)?.pop()||'0');
                    const eb = parseInt((b.ep||'').match(/\d+/g)?.pop()||'0');
                    return eb - ea;
                });
            } else if (sortMode === 'nom') {
                sorted.sort((a,b) => a.nom.localeCompare(b.nom, 'fr'));
            } else if (sortMode === 'censure') {
                sorted.sort((a,b) => (a.censure||'').localeCompare(b.censure||''));
            } else if (sortMode === 'etat') {
                sorted.sort((a,b) => (a.etat||'').localeCompare(b.etat||''));
            } else if (sortMode === 'editeur') {
                sorted.sort((a,b) => (a.editeur||'').localeCompare(b.editeur||''));
            }
            return sorted;
        }

        function switchDisplayMode() {
            currentDisplayMode = document.getElementById('display-mode').value;
            localStorage.setItem('alphaDisplayMode', currentDisplayMode);
            render(document.getElementById('search').value, '');
        }
        window.switchDisplayMode = switchDisplayMode;

        function render(searchVal = '', sortMode = '') {
            const container = document.getElementById('groups-container');
            const noResult = document.getElementById('no-result');
            const tableWrap = document.getElementById('list-table-wrap');
            const query = normalizeSearch(searchVal);

            let filtered = allAnimes;
            if (query) {
                filtered = allAnimes.filter(a => normalizeSearch(a.nom).includes(query));
            }

            filtered = sortAnimes(filtered, sortMode);
            currentFiltered = filtered;

            const groups = {};
            for (const a of filtered) {
                const key = getGroupKey(a.nom);
                if (!groups[key]) groups[key] = [];
                groups[key].push(a);
            }

            for (const key in groups) {
                groups[key].sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }));
            }

            const orderedKeys = ['★', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')].filter(k => groups[k]);
            const hl = (field) => sortMode === field ? 'class="highlight"' : '';

            if (orderedKeys.length === 0) {
                container.innerHTML = '';
                tableWrap.classList.remove('active');
                noResult.style.display = 'block';
                return;
            }
            noResult.style.display = 'none';

            const isGrid = currentDisplayMode === 'grid';

            if (isGrid) {
                tableWrap.classList.remove('active');
                container.style.display = '';

                container.innerHTML = orderedKeys.map(key => {
                    const label = key === '★' ? '★ Spéciaux' : key === '#' ? '# Chiffres' : key;
                    const cards = groups[key].map(a => `
                        <a href="video.html?name=${encodeURIComponent(a.nom)}" class="card">
                            <div class="img-container">
                                <img src="img/${a.img}" loading="lazy" onerror="handleImgError(this, '${a.img}')">
                            </div>
                            <div class="card-info">
                                <div class="card-title">${a.nom}</div>
                                <div class="card-meta-row">
                                    <span ${hl('sortie')}>📅${sortMode==='sortie'?(a.sortie||''):((a.sortie||'').match(/\d{4}/g)?.pop()||a.sortie)}</span>
                                    <span ${hl('score')}>⭐${a.score}</span>
                                    <span ${hl('popularite')}>📈${a.pop}</span>
                                </div>
                                <div class="card-meta-row">
                                    <span ${hl('episodes')}>🎞️${a.ep}</span>
                                    <span ${hl('censure')}>🔞${a.censure}</span>
                                    <span ${hl('etat')}>🛠️${a.etat}</span>
                                </div>
                                ${a.editeur ? `<div class="card-meta-row"><span ${hl('editeur')} style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🏢${a.editeur}</span></div>` : ''}
                            </div>
                        </a>`).join('');

                    return `
                        <div id="group-${key}" class="letter-anchor">
                            <div class="letter-badge">${label}</div>
                            <div class="letter-line"></div>
                        </div>
                        <div class="anime-list">${cards}</div>`;
                }).join('');
            } else {
                container.innerHTML = '';
                tableWrap.classList.add('active');

                const compactContainer = document.getElementById('compact-list-container');
                compactContainer.innerHTML = orderedKeys.map(key => {
                    const label = key === '★' ? '★ Spéciaux' : key === '#' ? '# Chiffres' : key;
                    const rows = groups[key].map(a => `
                        <a href="video.html?name=${encodeURIComponent(a.nom)}" class="mal-row">
                            <img class="ml-img" src="img/${a.img}" loading="lazy" onerror="handleImgError(this, '${a.img}')">
                            <span class="ml-title">${a.nom}</span>
                        </a>`).join('');
                    return `
                        <div id="group-${key}" class="letter-anchor">
                            <div class="letter-badge">${label}</div>
                            <div class="letter-line"></div>
                        </div>
                        <div class="mal-list">${rows}</div>`;
                }).join('');
            }

            const navGroups = {};
            for (const a of filtered) {
                const k = getGroupKey(a.nom);
                if (!navGroups[k]) navGroups[k] = [];
                navGroups[k].push(a);
            }
            buildAlphaNav(navGroups);
            relayoutAnimeGrids();
        }

        /* ═══════════ COLONNES DE LA GRILLE PILOTÉES PAR JS ═══════════
           grid-template-columns: repeat(auto-fill, minmax(...)) se recalcule bien au
           redimensionnement de fenêtre, mais PAS avec le zoom natif du navigateur
           (Ctrl +/-) : contrairement à un simple resize, le zoom change l'échelle de
           rendu sans que Chrome ne relance systématiquement l'algorithme auto-fill de la
           même façon. ResizeObserver, lui, mesure la taille RÉELLEMENT rendue du
           conteneur et se déclenche de façon fiable dans les deux cas — on calcule donc
           le nombre de colonnes nous-mêmes plutôt que de laisser le CSS seul s'en charger. */
        const GRID_GAP = 14, GRID_TARGET = 170, GRID_MIN = 130, GRID_MAX = 230;

        function computeGridCols(availWidth) {
            let n = Math.max(1, Math.round((availWidth + GRID_GAP) / (GRID_TARGET + GRID_GAP)));
            while (n > 1 && (availWidth - (n - 1) * GRID_GAP) / n < GRID_MIN) n--;
            while ((availWidth - (n - 1) * GRID_GAP) / n > GRID_MAX) n++;
            return n;
        }

        function relayoutAnimeGrids() {
            const container = document.getElementById('groups-container');
            const lists = document.querySelectorAll('.anime-list');
            if (!container || !lists.length) return;
            const cs = getComputedStyle(container);
            // clientWidth (largeur « logique », en pixels CSS) est la bonne mesure ici :
            // dézoomer ne change pas la taille physique de l'écran (donc la largeur VISUELLE
            // reste ~constante), mais fait tenir davantage de pixels CSS dans cet espace —
            // c'est justement cet espace logique libéré qu'on veut exploiter avec plus de
            // colonnes. Mesurer la largeur visuelle (getBoundingClientRect) donnerait un
            // nombre de colonnes constant quel que soit le zoom, ce qui est l'inverse du but.
            const avail = container.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
            if (avail <= 0) return;
            const n = computeGridCols(avail);
            lists.forEach(list => { list.style.gridTemplateColumns = `repeat(${n}, 1fr)`; });
        }

        if (window.ResizeObserver) {
            const gridRO = new ResizeObserver(() => {
                clearTimeout(window.__gridRT);
                window.__gridRT = setTimeout(relayoutAnimeGrids, 60);
            });
            document.addEventListener('DOMContentLoaded', () => {
                const c = document.getElementById('groups-container');
                if (c) gridRO.observe(c);
            });
            if (document.readyState !== 'loading') {
                const c = document.getElementById('groups-container');
                if (c) gridRO.observe(c);
            }
        } else {
            window.addEventListener('resize', () => {
                clearTimeout(window.__gridRT);
                window.__gridRT = setTimeout(relayoutAnimeGrids, 150);
            });
        }

        async function setBackground() {
            const isMobile = window.innerWidth <= 1000;
            try {
                const res = await fetch('backgrounds.json');
                const data = await res.json();
                const list = isMobile ? data.mobile : data.desktop;
                if (!list || !list.length) return;
                const file = list[Math.floor(Math.random() * list.length)];
                document.getElementById('bg-layer').style.backgroundImage = `url('img/${file}')`;
            } catch(e) {}
        }

        // Pas de parallax

        async function init() {
            setBackground();

            try {
                const response = await fetch('animes.csv');
                const rawData = await response.text();
                allAnimes = rawData.split(/\r?\n/).slice(1).map(line => {
                    const c = line.split(';');
                    if (!c[0] || c.length < 9) return null;
                    const clean = (s) => s ? s.trim().replace(/^"|"$/g, '') : "";
                    return {
                        nom: clean(c[0]), pop: clean(c[1]), score: clean(c[2]),
                        sortie: clean(c[3]), ep: clean(c[4]), censure: clean(c[5]),
                        etat: clean(c[6]), img: clean(c[8]),
                        tags: clean(c[12]), editeur: clean(c[14])
                    };
                }).filter(a => a !== null);

                const allGroups = {};
                for (const a of allAnimes) {
                    const k = getGroupKey(a.nom);
                    if (!allGroups[k]) allGroups[k] = [];
                    allGroups[k].push(a);
                }
                buildAlphaNav(allGroups);
                var _as = sessionStorage.getItem('alpha_search') || '';
                if (_as) { var _ai = document.getElementById('search'); if (_ai) _ai.value = _as; }
                render(_as, '');
            } catch (err) { console.error("Erreur CSV:", err); }
        }

        const searchInputEl = document.getElementById('search');
        const searchSuggestions = document.getElementById('search-suggestions');
        let hlIndex = -1;

        function renderSuggestions(val) {
            if (val.length < 1) { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
            const results = searchAnimes(val, 8);
            hlIndex = -1;
            if (results.length === 0) {
                searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat pour « ' + val + ' »</div>';
            } else {
                searchSuggestions.innerHTML = results.map(a => {
                    const year = (a.sortie || '').match(/\d{4}/g)?.pop() || '';
                    const meta = [year, a.ep ? a.ep + ' ép.' : ''].filter(Boolean).join(' · ');
                    return '<div class="suggestion-item" data-name="' + a.nom.replace(/"/g, '&quot;') + '">'
                        + '<img src="img/' + a.img + '" class="sugg-img" loading="lazy" onerror="this.src=\'img/logo.jpg\'">'
                        + '<span><span class="sugg-title">' + highlightTitle(a.nom, val) + '</span>'
                        + (meta ? '<span class="sugg-meta">' + meta + '</span>' : '') + '</span></div>';
                }).join('');
            }
            searchSuggestions.classList.add('active');
        }

        let suggTimer;
        document.getElementById('search').oninput = (e) => {
            sessionStorage.setItem('alpha_search', e.target.value);
            render(e.target.value, '');
            clearTimeout(suggTimer);
            suggTimer = setTimeout(() => renderSuggestions(e.target.value.trim()), 90);
        };
        searchInputEl.addEventListener('focus', function() {
            const val = this.value.trim();
            if (val) renderSuggestions(val);
        });

        function moveHighlight(delta) {
            const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
            if (!items.length) return;
            if (hlIndex >= 0) items[hlIndex].classList.remove('hl');
            hlIndex = (hlIndex + delta + items.length) % items.length;
            items[hlIndex].classList.add('hl');
            items[hlIndex].scrollIntoView({ block: 'nearest' });
        }

        searchInputEl.addEventListener('keydown', function(e) {
            const open = searchSuggestions.classList.contains('active');
            if (e.key === 'ArrowDown' && open) { e.preventDefault(); moveHighlight(1); return; }
            if (e.key === 'ArrowUp' && open) { e.preventDefault(); moveHighlight(-1); return; }
            if (e.key === 'Escape') { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
            if (e.key === 'Enter') {
                e.preventDefault();
                const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
                if (open && hlIndex >= 0 && items[hlIndex]) {
                    window.location.href = 'video.html?name=' + encodeURIComponent(items[hlIndex].dataset.name);
                    return;
                }
                searchSuggestions.classList.remove('active');
                this.blur();
            }
        });
        searchSuggestions.addEventListener('click', function(e) {
            const item = e.target.closest('.suggestion-item');
            if (item && item.dataset.name) window.location.href = 'video.html?name=' + encodeURIComponent(item.dataset.name);
        });
        document.addEventListener('click', function(e) { if (!e.target.closest('.search-wrapper')) { searchSuggestions.classList.remove('active'); hlIndex = -1; } });
        (function() {
            var s = sessionStorage.getItem('alpha_search');
            if (s) { var inp = document.getElementById('search'); if (inp) inp.value = s; }
        })();

        function toggleM() {
            const menu = document.getElementById('menu');
            const overlay = document.getElementById('overlay');
            const isOpen = menu.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }
        window.toggleM = toggleM;

        window.randomAnime = () => {
            if (allAnimes.length > 0) {
                const a = allAnimes[Math.floor(Math.random() * allAnimes.length)];
                window.location.href = `video.html?name=${encodeURIComponent(a.nom)}`;
            }
        };

        (function markActiveTab() {
            const current = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-tab').forEach(tab => {
                if (tab.dataset.page === current) tab.classList.add('active');
            });
        })();

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            document.getElementById('bg-overlay').style.opacity = Math.min(scrollY / 600, 0.65);
        });

        init();
    </script>
