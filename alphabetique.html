    <meta charset="UTF-8">

    <title>Le Malicieux - Index Alphabétique</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0;
            min-height: 100vh; padding-top: 98px; overflow-x: hidden;
        }
        .content-area { position: relative; z-index: 1; padding: 20px clamp(16px, 3vw, 64px) 40px; min-height: 100vh; margin: 0 auto; }
        .letter-anchor { display: flex; align-items: center; gap: 12px; margin: 30px 0 12px 0; }
        .letter-badge { font-size: 1.1em; font-weight: 900; color: var(--primary); min-width: 50px; height: 50px; padding: 0 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,71,87,0.1); border: 2px solid var(--primary); border-radius: 10px; flex-shrink: 0; white-space: nowrap; }
        .letter-line { flex: 1; height: 1px; background: linear-gradient(to right, rgba(255,71,87,0.4), transparent); }
        .anime-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 10px; }
        .card { background: var(--card-bg); border-radius: 3px; overflow: hidden; transition: 0.2s; border: 1px solid #333; text-decoration: none; color: inherit; font-size: 0.85em; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .card .img-container { width: 100%; aspect-ratio: 2/3; background: #111; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 8px 9px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 4px; height: 2.4em; overflow: hidden; font-size: 1.0em; line-height: 1.2; }
        .card-meta-row { display: flex; flex-wrap: wrap; gap: 5px; color: #ddd; margin-top: 4px; }
        .highlight { background: var(--primary); color: white; padding: 0 2px; border-radius: 3px; font-weight: bold; }
        .alpha-nav { position: fixed; top: 62px; left: 0; right: 0; z-index: 998; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding: 4px 16px; background: rgba(15,15,15,0.97); backdrop-filter: blur(10px); border-bottom: 1px solid #1a1a1a; height: 36px; align-items: center; scrollbar-width: none; box-sizing: border-box; }
        @media (max-width: 900px) {
            .alpha-nav { top: 58px !important; }
            body { padding-top: 94px !important; }
        }
        .alpha-nav::-webkit-scrollbar { display: none; }
        .alpha-nav a { color: #aaa; text-decoration: none; font-weight: bold; font-size: 0.8em; padding: 2px 6px; border-radius: 4px; transition: 0.2s; border: 1px solid #2a2a2a; flex-shrink: 0; }
        .alpha-nav a:hover { color: white; border-color: var(--primary); background: rgba(255,71,87,0.1); }
        .alpha-nav a.disabled { color: #333; border-color: #1a1a1a; pointer-events: none; }
        #no-result { text-align: center; color: #ccc; padding: 40px; font-size: 1.1em; display: none; }
        .display-mode-bar { display: flex; align-items: center; gap: 8px; padding: 0 15px; margin: 0 auto 15px; flex-wrap: wrap; }
        .display-mode-bar select { background: #1e1e1e; border: 1px solid #3a3a3a; color: white; padding: 4px 8px; border-radius: 5px; font-size: 0.8em; height: 30px; cursor: pointer; }
        .display-mode-bar label { font-size: 0.75em; color: #888; }
        .list-table-wrap { display: none; margin: 0 auto; padding: 0 clamp(16px, 3vw, 64px); }
        .list-table-wrap.active { display: block; }
        .anime-list.table-hidden { display: none; }
        .mal-list { display: flex; flex-direction: column; gap: 2px; }
        .mal-row { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;
            background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 6px;
            padding: 6px 10px; transition: 0.15s; }
        .mal-row:hover { border-color: var(--primary); background: rgba(255,71,87,0.05); }
        .mal-row .ml-img { width: 36px; height: 52px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #111; }
        .mal-row .ml-title { font-size: 0.85em; font-weight: bold; color: var(--primary); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        @media (max-width: 700px) {
            .anime-list { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
        }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M65SBS3C"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

        <div class="navbar">
            <div class="nav-left">
                <button class="burger" onclick="toggleM()" aria-label="Ouvrir le menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <a class="nav-brand" href="index.html">
                    <img src="img/bannieres_icones/logo.jpg" class="nav-logo-small" alt="Logo Le Malicieux">
                    <span class="nav-title">LE MALICIEUX</span>

            <div class="nav-right">
                <div class="search-wrapper" id="search-wrapper">
                    <input type="text" id="search" placeholder="Rechercher un anime..." autocomplete="off">
                    <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
                <button class="nav-action" onclick="doRandom()">Au hasard</button>

            </div>
        </div>

    <div class="alpha-nav" id="alpha-nav"></div>

    <div class="content-area">
        <div class="display-mode-bar">
            <label>Affichage :</label>
            <select id="display-mode" onchange="switchDisplayMode()">
                <option value="grid">Icônes</option>
                <option value="list">Liste</option>
            </select>
        </div>
        <div id="groups-container"></div>
        <div class="list-table-wrap" id="list-table-wrap">
            <div id="compact-list-container"></div>
        </div>
        <div id="no-result">Aucun anime trouvé pour cette recherche.</div>
    </div>

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, renderMetaBadges,
        handleImgError, IMG_LOGO, searchAnimes, highlightTitle
    } from './common.js';

    initCommon();

    let allAnimes = [];
    let currentDisplayMode = localStorage.getItem('alphaDisplayMode') || 'grid';
    let currentSearchVal = '';
    let currentSortMode = '';

    document.getElementById('display-mode').value = currentDisplayMode;

    function getGroupKey(name) {
        const first = name.trim()[0] || '';
        if (/[0-9]/.test(first)) return '#';
        const letter = first.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        if (/[A-Z]/.test(letter)) return letter;
        return '★';
    }

    function buildAlphaNav(groups) {
        const nav = document.getElementById('alpha-nav');
        const allKeys = ['★', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
        nav.innerHTML = allKeys.map(k => {
            const has = groups[k] && groups[k].length > 0;
            return `<a href="${has ? '#group-' + k : '#'}" class="${has ? '' : 'disabled'}">${k}</a>`;
        }).join('');
    }

    function dateToTs(s) {
        if (!s) return 0;
        s = s.trim();
        const mois = {'janv.':1,'févr.':2,'mars':3,'avr.':4,'mai':5,'juin':6,'juil.':7,'août':8,'sept.':9,'oct.':10,'nov.':11,'déc.':12,
                      'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12};
        const parts = s.split(' au ');
        const last = parts[parts.length - 1].trim();
        const m1 = last.match(/(\d{1,2})\s+([a-zéûôA-Z.]+)\s+(\d{4})/);
        if (m1) { const mo = mois[m1[2]] || 1; return new Date(+m1[3], mo - 1, +m1[1]).getTime(); }
        const m2 = last.match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})/);
        if (m2) { const mo = mois[m2[1]] || 1; return new Date(+m2[3], mo - 1, +m2[2]).getTime(); }
        const m3 = last.match(/\d{4}/g);
        if (m3) return new Date(+m3[m3.length - 1], 0, 1).getTime();
        return 0;
    }

    function sortAnimes(list, sortMode) {
        if (!sortMode) return [...list];
        const sorted = [...list];
        if (sortMode === 'score') sorted.sort((a, b) => parseFloat((b.score || '0').replace(',', '.')) - parseFloat((a.score || '0').replace(',', '.')));
        else if (sortMode === 'popularite') sorted.sort((a, b) => (parseInt((a.pop || '').replace('#', '')) || 99999) - (parseInt((b.pop || '').replace('#', '')) || 99999));
        else if (sortMode === 'sortie') sorted.sort((a, b) => dateToTs(b.sortie) - dateToTs(a.sortie));
        else if (sortMode === 'episodes') sorted.sort((a, b) => { const ea = parseInt((a.ep || '').match(/\d+/g)?.pop() || '0'); const eb = parseInt((b.ep || '').match(/\d+/g)?.pop() || '0'); return eb - ea; });
        else if (sortMode === 'nom') sorted.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
        else if (sortMode === 'censure') sorted.sort((a, b) => (a.censure || '').localeCompare(b.censure || ''));
        else if (sortMode === 'etat') sorted.sort((a, b) => (a.etat || '').localeCompare(b.etat || ''));
        else if (sortMode === 'editeur') sorted.sort((a, b) => (a.editeur || '').localeCompare(b.editeur || ''));
        return sorted;
    }

    function switchDisplayMode() {
        currentDisplayMode = document.getElementById('display-mode').value;
        localStorage.setItem('alphaDisplayMode', currentDisplayMode);
        render(currentSearchVal, currentSortMode);
    }
    window.switchDisplayMode = switchDisplayMode;

    function render(searchVal = '', sortMode = '') {
        currentSearchVal = searchVal;
        currentSortMode = sortMode;
        const container = document.getElementById('groups-container');
        const noResult = document.getElementById('no-result');
        const tableWrap = document.getElementById('list-table-wrap');

        let filtered = allAnimes;
        if (searchVal) filtered = searchAnimes(searchVal, allAnimes);
        filtered = sortAnimes(filtered, sortMode);

        const groups = {};
        for (const a of filtered) {
            const key = getGroupKey(a.nom);
            if (!groups[key]) groups[key] = [];
            groups[key].push(a);
        }
        for (const key in groups) groups[key].sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }));

        const orderedKeys = ['★', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')].filter(k => groups[k]);
        const hl = (f) => sortMode === f ? 'class="highlight"' : '';

        if (orderedKeys.length === 0) {
            container.innerHTML = '';
            tableWrap.classList.remove('active');
            noResult.style.display = 'block';
            buildAlphaNav({});
            return;
        }
        noResult.style.display = 'none';

        if (currentDisplayMode === 'grid') {
            tableWrap.classList.remove('active');
            container.style.display = '';
            container.innerHTML = orderedKeys.map(key => {
                const label = key === '★' ? '★ Spéciaux' : key === '#' ? '# Chiffres' : key;
                const cards = groups[key].map(a => {
                    const cover = getCoverPath(a.ordreAjout, 1);
                    const coverFile = `${a.ordreAjout}-1.webp`;
                    const year = (a.sortie || '').match(/\d{4}/g)?.pop() || a.sortie;

                    return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="card">
                        <div class="img-container"><img src="${cover}" loading="lazy" onerror="handleImgError(this, '${coverFile}')"></div>
                        <div class="card-info">
                            <div class="card-title">${a.nom}</div>
                            <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;">
                                <span class="meta-badge" ${hl('sortie')}>${sortMode === 'sortie' ? a.sortie : year}</span>
                                <span class="meta-badge mal-score" ${hl('score')}>★${a.score}</span>
                                <span class="meta-badge" ${hl('popularite')}>${a.pop}</span>
                                <span class="meta-badge" ${hl('episodes')}>${a.ep} ép.</span>
                            </div>
                            <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;">
                                <span class="meta-badge"><strong>Censure :</strong> ${a.censure}</span>
                                <span class="meta-badge"><strong>Statut :</strong> ${a.etat}</span>
                            </div>
                            ${a.editeur ? `<div class="card-meta-row" style="margin-top:6px;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#888; font-size:0.78em;">${a.editeur}</span></div>` : ''}
                        </div>
                    </a>`;
                }).join('');
                return `<div id="group-${key}" class="letter-anchor"><div class="letter-badge">${label}</div><div class="letter-line"></div></div><div class="anime-list">${cards}</div>`;
            }).join('');
        } else {
            container.innerHTML = '';
            tableWrap.classList.add('active');
            const compactContainer = document.getElementById('compact-list-container');
            compactContainer.innerHTML = orderedKeys.map(key => {
                const label = key === '★' ? '★ Spéciaux' : key === '#' ? '# Chiffres' : key;
                const rows = groups[key].map(a => {
                    const cover = getCoverPath(a.ordreAjout, 1);
                    const coverFile = `${a.ordreAjout}-1.webp`;
                    return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="mal-row">
                        <img class="ml-img" src="${cover}" loading="lazy" onerror="handleImgError(this, '${coverFile}')">
                        <span class="ml-title">${a.nom}</span>
                    </a>`;
                }).join('');
                return `<div id="group-${key}" class="letter-anchor"><div class="letter-badge">${label}</div><div class="letter-line"></div></div><div class="mal-list">${rows}</div>`;
            }).join('');
        }

        const navGroups = {};
        for (const a of filtered) { const k = getGroupKey(a.nom); if (!navGroups[k]) navGroups[k] = []; navGroups[k].push(a); }
        buildAlphaNav(navGroups);
        relayoutGrids();
    }

    const GRID_GAP = 12, GRID_TARGET = 190, GRID_MIN = 135, GRID_MAX = 240;
    function computeGridCols(avail) {
        let n = Math.max(1, Math.round((avail + GRID_GAP) / (GRID_TARGET + GRID_GAP)));
        while (n > 1 && (avail - (n - 1) * GRID_GAP) / n < GRID_MIN) n--;
        while ((avail - (n - 1) * GRID_GAP) / n > GRID_MAX) n++;
        return n;
    }
    function relayoutGrids() {
        const container = document.getElementById('groups-container');
        const lists = document.querySelectorAll('.anime-list');
        if (!container || !lists.length) return;
        const cs = getComputedStyle(container);
        const avail = container.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
        if (avail <= 0) return;
        const n = computeGridCols(avail);
        lists.forEach(list => { list.style.gridTemplateColumns = `repeat(${n}, 1fr)`; });
    }
    if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => { clearTimeout(window.__gridRT); window.__gridRT = setTimeout(relayoutGrids, 60); });
        ro.observe(document.getElementById('groups-container'));
    }

    function doRandom() {
        if (!allAnimes.length) return;
        const a = allAnimes[Math.floor(Math.random() * allAnimes.length)];
        window.location.href = 'fiche.html?name=' + encodeURIComponent(a.nom);
    }
    window.doRandom = doRandom;

    // ─── Recherche ───
    const searchInput = document.getElementById('search');
    const searchSuggestions = document.getElementById('search-suggestions');
    let suggTimer;
    searchInput.addEventListener('input', function () {
        const val = this.value.trim();
        render(val, currentSortMode);
        sessionStorage.setItem('alpha_search', val);
        clearTimeout(suggTimer);
        suggTimer = setTimeout(() => {
            if (!val) { searchSuggestions.classList.remove('active'); return; }
            const results = searchAnimes(val, allAnimes, 8);
            if (!results.length) searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
            else searchSuggestions.innerHTML = results.map(a => `<div class="suggestion-item" data-name="${a.nom.replace(/"/g, '&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${highlightTitle(a.nom, val)}</span></div>`).join('');
            searchSuggestions.classList.add('active');
        }, 90);
    });
    searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchSuggestions.classList.remove('active');
            this.blur();
        }
    });
    searchSuggestions.addEventListener('click', function (e) {
        const item = e.target.closest('.suggestion-item');
        if (item && item.dataset.name) window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-wrapper')) searchSuggestions.classList.remove('active');
    });

    (async function () {
        try {
            allAnimes = await loadAnimes();
            const savedSearch = sessionStorage.getItem('alpha_search') || '';
            if (savedSearch) document.getElementById('search').value = savedSearch;
            const urlSort = new URLSearchParams(window.location.search).get('sort') || '';
            render(savedSearch, urlSort);

            const allGroups = {};
            for (const a of allAnimes) { const k = getGroupKey(a.nom); if (!allGroups[k]) allGroups[k] = []; allGroups[k].push(a); }
            buildAlphaNav(allGroups);
        } catch (e) { console.error(e); }
    })();
</script>
