    <meta charset="UTF-8">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; overflow-x: hidden; padding-top: 62px; }
        .hero-section { height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .main-logo { width: 110px; height: 110px; border-radius: 20px; border: 3px solid var(--primary); margin-bottom: 15px; object-fit: cover; }
        .main-title { font-size: 2.5em; margin: 0; color: white; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); font-weight: 800; }
        .main-slogan { font-size: 1.2em; font-weight: bold; margin-top: 10px; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
        .content-area { padding: 20px clamp(20px, 5vw, 100px); min-height: 500px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border-radius: 3px; overflow: hidden; transition: 0.2s; border: 1px solid #333; text-decoration: none; color: inherit; font-size: 0.85em; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .card .img-container { width: 100%; aspect-ratio: 2/3; background: #111; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 8px 9px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 4px; height: 2.4em; overflow: hidden; font-size: 1.0em; line-height: 1.2; }
        .card-meta-row { display: flex; flex-wrap: wrap; gap: 5px; color: #ddd; margin-top: 4px; }
        .highlight { background: var(--primary); color: white; padding: 0 2px; border-radius: 3px; font-weight: bold; }
        .mal-updated { color: #5dade2; }
        
        .sort-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .sort-select { background: #1e1e1e; border: 1px solid #3a3a3a; color: white; padding: 6px 10px; border-radius: 5px; font-size: 0.85em; cursor: pointer; }
        
        @media (max-width: 480px) { .card-title { font-size: 0.85em; } }
        @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; } }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M65SBS3C" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div id="bg-overlay"></div>
    
    <header class="site-header">
        <div class="navbar">

                <button class="nav-action" onclick="doRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
            </nav>
            <div class="nav-right">
                <div class="search-wrapper" id="search-wrapper">
                    <input type="text" id="search" placeholder="Rechercher un anime..." autocomplete="off">
                    <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
                <button class="nav-action" onclick="doRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>

            </div>

    <div class="hero-section">
        <img src="img/bannieres_icones/logo.jpg" class="main-logo">
        <h1 class="main-title">le-malicieux.github.io</h1>
        <p class="main-slogan">Catalogue d'animes malicieux (ancien index)</p>
    </div>

    <div class="content-area">
        <div class="sort-controls">
            <select id="sort" class="sort-select">
                <option value="">Aléatoire</option>
                <option value="ordre_ajout">Ajout récent</option>
                <option value="popularite">Popularité</option>
                <option value="score">Score</option>
                <option value="nom">Nom (A-Z)</option>
                <option value="sortie">Année</option>
                <option value="episodes">Épisodes</option>
                <option value="etat">État</option>
                <option value="censure">Censure</option>
                <option value="editeur">Éditeur</option>
            </select>
        </div>
        <div id="anime-container" class="grid"></div>
    </div>

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, renderMetaBadges,
        handleImgError, IMG_LOGO, searchAnimes, highlightTitle
    } from './common.js';

    initCommon();

    let allAnimes = [];
    let shuffledAnimes = [];
    let currentSearch = '';

    function dateToTs(s){
        if(!s) return 0;
        s = s.trim();
        const mois={'janv.':1,'févr.':2,'mars':3,'avr.':4,'mai':5,'juin':6,'juil.':7,'août':8,'sept.':9,'oct.':10,'nov.':11,'déc.':12,
                    'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12};
        const parts = s.split(' au ');
        const last = parts[parts.length-1].trim();
        const m1 = last.match(/(\d{1,2})\s+([a-zéûôA-Z.]+)\s+(\d{4})/);
        if(m1){ const mo=mois[m1[2]]||1; return new Date(+m1[3], mo-1, +m1[1]).getTime(); }
        const m2 = last.match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})/);
        if(m2){ const mo=mois[m2[1]]||1; return new Date(+m2[3], mo-1, +m2[2]).getTime(); }
        const m3 = (last.match(/\d{4}/g)||[]);
        if(m3.length){ return new Date(+m3[m3.length-1], 0, 1).getTime(); }
        return 0;
    }

    function runFilterAndSort() {
        const searchVal = currentSearch;
        const sortMode = document.getElementById('sort').value;
        
        let base = (searchVal === "" && sortMode === "") ? shuffledAnimes : allAnimes;
        
        let filtered = base.filter(a => {
            const matchSearch = searchVal ? a.nom.toLowerCase().includes(searchVal.toLowerCase()) : true;
            return matchSearch;
        });

        if (sortMode) {
            filtered.sort((a, b) => {
                if (sortMode === "ordre_ajout") return (b.ordreAjout || 0) - (a.ordreAjout || 0);
                if (sortMode === "score") return parseFloat((b.score||'0').replace(',', '.')) - parseFloat((a.score||'0').replace(',', '.'));
                if (sortMode === "episodes") {
                    const numA = parseInt((a.ep||'').match(/\d+/g)?.pop() || '0');
                    const numB = parseInt((b.ep||'').match(/\d+/g)?.pop() || '0');
                    return numB - numA;
                }
                if (sortMode === "popularite") return (parseInt((a.pop||'').replace('#','')) || 99999) - (parseInt((b.pop||'').replace('#','')) || 99999);
                if (sortMode === "sortie") return dateToTs(b.sortie) - dateToTs(a.sortie);
                if (sortMode === "editeur") return (a.editeur || '').localeCompare(b.editeur || '');
                if (sortMode === "nom") return a.nom.localeCompare(b.nom);
                if (sortMode === "censure") return (a.censure || '').localeCompare(b.censure || '');
                if (sortMode === "etat") return (a.etat || '').localeCompare(b.etat || '');
                return 0;
            });
        }
        displayAnimes(filtered, sortMode);
    }

    function displayAnimes(list, sortMode) {
        const container = document.getElementById('anime-container');
        const hl = (m) => (sortMode === m) ? 'class="highlight"' : '';
        
        container.innerHTML = list.map(a => {
            const titleHtml = highlightTitle(a.nom, currentSearch);
            const cover = getCoverPath(a.ordreAjout, 1);
            const coverFile = `${a.ordreAjout}-1.webp`;
            const year = (a.sortie||'').match(/\d{4}/g)?.pop() || a.sortie;

            return `
            <a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="card">
                <div class="img-container">
                    <img src="${cover}" loading="lazy" onerror="handleImgError(this, '${coverFile}')">
                </div>
                <div class="card-info">
                    <div class="card-title">${titleHtml}</div>
                    <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;">
                        <span class="meta-badge" ${hl('sortie')}>${sortMode==='sortie'?(a.sortie||''):year}</span>
                        <span class="meta-badge mal-score" ${hl('score')}>★ ${a.score}</span>
                        <span class="meta-badge" ${hl('popularite')}>${a.pop}</span>
                        <span class="meta-badge" ${hl('episodes')}>${a.ep} ép.</span>
                    </div>
                    <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;">
                        <span class="meta-badge"><strong>Censure :</strong> ${a.censure}</span>
                        <span class="meta-badge"><strong>Statut :</strong> ${a.etat}</span>
                    </div>
                    ${a.editeur ? `<div class="card-meta-row" style="margin-top:6px;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#888; font-size:0.78em;">${a.editeur}</span></div>` : ''}
                </div>
            </a>`;
        }).join('');
        relayoutGrid();
    }

    const GRID_GAP = 12, GRID_TARGET = 190, GRID_MIN = 135, GRID_MAX = 240;
    function computeGridCols(avail) {
        let n = Math.max(1, Math.round((avail + GRID_GAP) / (GRID_TARGET + GRID_GAP)));
        while (n > 1 && (avail - (n - 1) * GRID_GAP) / n < GRID_MIN) n--;
        while ((avail - (n - 1) * GRID_GAP) / n > GRID_MAX) n++;
        return n;
    }
    function relayoutGrid() {
        const g = document.getElementById('anime-container');
        if (!g) return;
        const avail = g.clientWidth;
        if (avail <= 0) return;
        g.style.gridTemplateColumns = `repeat(${computeGridCols(avail)}, 1fr)`;
    }
    if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => { clearTimeout(window.__gridRT); window.__gridRT = setTimeout(relayoutGrid, 60); });
        ro.observe(document.getElementById('anime-container'));
    } else {
        window.addEventListener('resize', relayoutGrid);
    }

    function doRandom() {
        if(allAnimes.length > 0) {
            const a = allAnimes[Math.floor(Math.random()*allAnimes.length)];
            window.location.href = `fiche.html?name=${encodeURIComponent(a.nom)}`;
        }
    }
    window.doRandom = doRandom;

    // Recherche
    const searchInput = document.getElementById('search');
    const searchSuggestions = document.getElementById('search-suggestions');
    let suggTimer;
    
    searchInput.addEventListener('input', function() {
        currentSearch = this.value.trim();
        runFilterAndSort();
        clearTimeout(suggTimer);
        suggTimer = setTimeout(() => {
            if (currentSearch.length >= 2) {
                const results = searchAnimes(currentSearch, allAnimes, 8);
                if (results.length === 0) {
                    searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
                } else {
                    searchSuggestions.innerHTML = results.map(a => 
                        `<div class="suggestion-item" data-name="${a.nom.replace(/"/g,'&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${highlightTitle(a.nom, currentSearch)}</span></div>`
                    ).join('');
                }
                searchSuggestions.classList.add('active');
            } else {
                searchSuggestions.classList.remove('active');
            }
        }, 90);
    });
    
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchSuggestions.classList.remove('active');
            this.blur();
        }
    });
    
    searchSuggestions.addEventListener('click', function(e) {
        const item = e.target.closest('.suggestion-item');
        if (item && item.dataset.name) {
            window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
        }
    });
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrapper')) {
            searchSuggestions.classList.remove('active');
        }
    });

    document.getElementById('sort').onchange = runFilterAndSort;

    (async function init() {
        try {
            allAnimes = await loadAnimes();
            shuffledAnimes = [...allAnimes];
            for (let i = shuffledAnimes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledAnimes[i], shuffledAnimes[j]] = [shuffledAnimes[j], shuffledAnimes[i]];
            }

            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search');
            if (searchParam) {
                document.getElementById('search').value = searchParam;
                currentSearch = searchParam;
            }
            const sortParam = urlParams.get('sort');
            if (sortParam !== null) {
                document.getElementById('sort').value = sortParam;
            }

            runFilterAndSort();
        } catch (e) {
            console.error(e);
        }
    })();
</script>
</body>
