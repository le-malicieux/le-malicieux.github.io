<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Recherche Avancée - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-top: 62px; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* ── BARRE DE FILTRES EN HAUT ── */
        .filters-top { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: start; }
        
        .filter-block { display: flex; flex-direction: column; gap: 6px; }
        .filter-block label { font-size: 0.75em; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        .filter-control { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 10px; border-radius: 6px; font-size: 0.85em; outline: none; width: 100%; box-sizing: border-box; cursor: pointer; }
        .filter-control:focus { border-color: var(--primary); }
        input[type="number"].filter-control { cursor: text; }
        
        /* Bloc Min/Max */
        .range-inputs { display: flex; align-items: center; gap: 5px; }
        .range-inputs input { text-align: center; }
        .range-inputs span { color: #666; font-weight: bold; }

        /* Bouton Reset */
        .btn-reset-top { background: rgba(255,71,87,0.1); border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: 0.2s; white-space: nowrap; height: 36px; margin-top: 20px; }
        .btn-reset-top:hover { background: var(--primary); color: white; }

        /* ── SECTIONS REPLIABLES (Tags / PLS) ── */
        details { background: #1a1a1a; border: 1px solid #444; border-radius: 6px; position: relative; }
        summary { padding: 8px 10px; font-size: 0.85em; color: white; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.7em; color: #aaa; }
        details[open] summary { border-bottom: 1px solid #444; border-radius: 6px 6px 0 0; }
        details[open] summary::after { content: '▲'; }
        
        .dropdown-content { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid #444; border-top: none; border-radius: 0 0 6px 6px; z-index: 100; padding: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); min-width: 250px; max-width: 350px; }
        .dropdown-search { width: 100%; padding: 6px 8px; background: #111; border: 1px solid #333; color: white; border-radius: 4px; margin-bottom: 8px; font-size: 0.8em; }
        .checkbox-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; }
        .checkbox-list::-webkit-scrollbar { width: 6px; }
        .checkbox-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .checkbox-list label { font-size: 0.85em; color: #ccc; display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; letter-spacing: 0; }
        .checkbox-list input { accent-color: var(--primary); width: 15px; height: 15px; }

        /* ── ZONE DE RÉSULTATS ── */
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .results-count { font-weight: bold; color: white; font-size: 1.1em; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; transition: 0.2s; border: 1px solid #333; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .card .img-wrap { width: 100%; aspect-ratio: 2/3; background: #111; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 8px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: bold; color: var(--primary); font-size: 0.9em; height: 2.4em; overflow: hidden; line-height: 1.2; margin-bottom: 5px; }
        .score-badge { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.7); color: #f1c40f; font-size: 0.7em; padding: 2px 5px; border-radius: 4px; }
        
        @media (max-width: 800px) {
            .filters-grid { grid-template-columns: 1fr 1fr; }
            .btn-reset-top { grid-column: 1 / -1; margin-top: 0; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .dropdown-content { position: fixed; top: auto; bottom: 0; left: 0; right: 0; max-width: 100%; border-radius: 12px 12px 0 0; border: 1px solid #444; padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <!-- La navbar s'injecte via common.js -->

    <div class="container">
        <!-- BARRE DE FILTRES EN HAUT -->
        <div class="filters-top">
            <div class="filters-grid">
                <!-- Recherche -->
                <div class="filter-block" style="grid-column: span 2;">
                    <label>Recherche par titre</label>
                    <input type="text" id="f-search" class="filter-control" placeholder="Ex: Overflow, Bible Black...">
                </div>

                <!-- Catégorie / Censure -->
                <div class="filter-block">
                    <label>Catégorie</label>
                    <select id="f-categorie" class="filter-control">
                        <option value="all">Tout</option>
                        <option value="non-censured">Non-Censuré</option>
                        <option value="censured">Censuré</option>
                        <option value="erotica">Erotica</option>
                    </select>
                </div>

                <!-- Statut -->
                <div class="filter-block">
                    <label>Statut</label>
                    <select id="f-statut" class="filter-control">
                        <option value="all">Peu importe</option>
                        <option value="fini">Fini</option>
                        <option value="encours">En cours</option>
                    </select>
                </div>

                <!-- Année -->
                <div class="filter-block">
                    <label>Année de sortie</label>
                    <div class="range-inputs">
                        <input type="number" id="f-year-min" class="filter-control" placeholder="Min" min="1970" max="2030">
                        <span>-</span>
                        <input type="number" id="f-year-max" class="filter-control" placeholder="Max" min="1970" max="2030">
                    </div>
                </div>

                <!-- Score -->
                <div class="filter-block">
                    <label>Score (sur 10)</label>
                    <div class="range-inputs">
                        <input type="number" id="f-score-min" class="filter-control" placeholder="Min" step="0.1" min="0" max="10">
                        <span>-</span>
                        <input type="number" id="f-score-max" class="filter-control" placeholder="Max" step="0.1" min="0" max="10">
                    </div>
                </div>

                <!-- Tags -->
                <div class="filter-block">
                    <label>Tags</label>
                    <details>
                        <summary>Sélectionner des tags</summary>
                        <div class="dropdown-content">
                            <input type="text" id="f-tag-search" class="dropdown-search" placeholder="Chercher un tag...">
                            <div class="checkbox-list" id="tags-list"></div>
                        </div>
                    </details>
                </div>

                <!-- PLS -->
                <div class="filter-block">
                    <label>Producteurs / Labels / Studios</label>
                    <details>
                        <summary>Sélectionner des PLS</summary>
                        <div class="dropdown-content">
                            <input type="text" id="f-pls-search" class="dropdown-search" placeholder="Chercher un PLS...">
                            <div class="checkbox-list" id="pls-list"></div>
                        </div>
                    </details>
                </div>

                <!-- Bouton Reset -->
                <button class="btn-reset-top" onclick="resetFilters()">Effacer les filtres</button>
            </div>
        </div>

        <!-- RÉSULTATS -->
        <div class="results-header">
            <span class="results-count" id="results-count">Chargement...</span>
            <select id="sort-order" class="filter-control" style="width:auto;">
                <option value="recent">Tri : Ajout récent</option>
                <option value="score">Tri : Meilleur score</option>
                <option value="year-desc">Tri : Année (Desc)</option>
                <option value="year-asc">Tri : Année (Asc)</option>
                <option value="name">Tri : A à Z</option>
            </select>
        </div>

        <div class="grid" id="results-grid"></div>
    </div>

<script type="module">
    import { initCommon, loadAnimes, getCoverPath, handleImgError, searchAnimes } from './common.js';

    initCommon();

    let allAnimes = [];
    let eroticaSet = new Set();
    
    let filters = {
        search: '',
        categorie: 'all',
        statut: 'all',
        yearMin: '',
        yearMax: '',
        scoreMin: '',
        scoreMax: '',
        tags: new Set(),
        pls: new Set(),
        sort: 'recent'
    };

    function getYear(str) {
        const m = (str || '').match(/\d{4}/g);
        return m ? parseInt(m[m.length - 1]) : 0;
    }

    async function init() {
        try {
            allAnimes = await loadAnimes();
            
            const resp = await fetch('plsero_liste.csv');
            if (resp.ok) {
                const text = await resp.text();
                text.split(/\r?\n/).forEach(l => { 
                    const n = l.trim(); 
                    if (n && n !== 'Studios Erotica') eroticaSet.add(n); 
                });
            }

            buildFilterLists();
            setupEvents();
            applyFilters();
            
            // Fermer les dropdowns si on clique ailleurs
            document.addEventListener('click', (e) => {
                document.querySelectorAll('details').forEach(d => {
                    if (!d.contains(e.target)) d.removeAttribute('open');
                });
            });
        } catch (e) {
            console.error(e);
        }
    }

    function buildFilterLists() {
        const uniqueTags = new Set();
        const uniquePls = new Set();

        allAnimes.forEach(a => {
            if (a.tags) a.tags.split(',').map(t => t.trim()).filter(Boolean).forEach(t => uniqueTags.add(t));
            if (a.producteur) a.producteur.split(',').map(s=>s.trim()).filter(Boolean).forEach(p => uniquePls.add(p));
            if (a.label) a.label.split(',').map(s=>s.trim()).filter(Boolean).forEach(l => uniquePls.add(l));
            if (a.studio) a.studio.split(',').map(s=>s.trim()).filter(Boolean).forEach(s => uniquePls.add(s));
        });

        const sortedTags = Array.from(uniqueTags).sort((a,b) => a.localeCompare(b));
        const sortedPls = Array.from(uniquePls).sort((a,b) => a.localeCompare(b));

        document.getElementById('tags-list').innerHTML = sortedTags.map(t => 
            `<label><input type="checkbox" value="${t.replace(/"/g, '&quot;')}" class="tag-cb"> ${t}</label>`
        ).join('');

        document.getElementById('pls-list').innerHTML = sortedPls.map(p => 
            `<label><input type="checkbox" value="${p.replace(/"/g, '&quot;')}" class="pls-cb"> ${p}</label>`
        ).join('');
    }

    function setupEvents() {
        let searchTimer;
        document.getElementById('f-search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                filters.search = e.target.value.trim();
                applyFilters();
            }, 300);
        });

        // Selects
        document.getElementById('f-categorie').addEventListener('change', (e) => { filters.categorie = e.target.value; applyFilters(); });
        document.getElementById('f-statut').addEventListener('change', (e) => { filters.statut = e.target.value; applyFilters(); });
        document.getElementById('sort-order').addEventListener('change', (e) => { filters.sort = e.target.value; applyFilters(); });

        // Inputs Min/Max
        const rangeInputs = ['f-year-min', 'f-year-max', 'f-score-min', 'f-score-max'];
        rangeInputs.forEach(id => {
            let timer;
            document.getElementById(id).addEventListener('input', (e) => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    if (id === 'f-year-min') filters.yearMin = e.target.value;
                    if (id === 'f-year-max') filters.yearMax = e.target.value;
                    if (id === 'f-score-min') filters.scoreMin = e.target.value;
                    if (id === 'f-score-max') filters.scoreMax = e.target.value;
                    applyFilters();
                }, 400);
            });
        });

        // Recherches locales
        document.getElementById('f-tag-search').addEventListener('input', (e) => {
            e.stopPropagation(); // Empêche la fermeture du details
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#tags-list label').forEach(lbl => {
                lbl.style.display = lbl.textContent.toLowerCase().includes(val) ? 'flex' : 'none';
            });
        });

        document.getElementById('f-pls-search').addEventListener('input', (e) => {
            e.stopPropagation();
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#pls-list label').forEach(lbl => {
                lbl.style.display = lbl.textContent.toLowerCase().includes(val) ? 'flex' : 'none';
            });
        });

        // Checkboxes
        document.querySelectorAll('.tag-cb').forEach(cb => {
            cb.addEventListener('change', (e) => {
                if (e.target.checked) filters.tags.add(e.target.value);
                else filters.tags.delete(e.target.value);
                applyFilters();
            });
        });

        document.querySelectorAll('.pls-cb').forEach(cb => {
            cb.addEventListener('change', (e) => {
                if (e.target.checked) filters.pls.add(e.target.value);
                else filters.pls.delete(e.target.value);
                applyFilters();
            });
        });
    }

    window.resetFilters = function() {
        document.getElementById('f-categorie').value = 'all';
        document.getElementById('f-statut').value = 'all';
        
        ['f-year-min', 'f-year-max', 'f-score-min', 'f-score-max', 'f-search', 'f-tag-search', 'f-pls-search'].forEach(id => {
            document.getElementById(id).value = '';
        });
        
        document.querySelectorAll('.tag-cb, .pls-cb').forEach(cb => cb.checked = false);
        document.querySelectorAll('#tags-list label, #pls-list label').forEach(lbl => lbl.style.display = 'flex');

        filters = { 
            search: '', categorie: 'all', statut: 'all', 
            yearMin: '', yearMax: '', scoreMin: '', scoreMax: '', 
            tags: new Set(), pls: new Set(), sort: 'recent' 
        };
        applyFilters();
    };

    function applyFilters() {
        let filtered = allAnimes.filter(a => {
            let isAnimeEro = false;
            [a.producteur, a.label, a.studio].forEach(str => {
                if (str && str.split(',').some(s => eroticaSet.has(s.trim()))) isAnimeEro = true;
            });

            // Catégorie
            if (filters.categorie === 'erotica' && !isAnimeEro) return false;
            if (filters.categorie === 'non-censured') {
                if (isAnimeEro) return false;
                if ((a.censure || '').toLowerCase().includes('oui')) return false;
            }
            if (filters.categorie === 'censured') {
                if (isAnimeEro) return false;
                if (!(a.censure || '').toLowerCase().includes('oui')) return false;
            }

            // Statut
            if (filters.statut !== 'all') {
                const isFini = (a.etat || '').toLowerCase().includes('fini') || (a.etat || '').toLowerCase().includes('termin');
                const isEnCours = (a.etat || '').toLowerCase().includes('cours') || (a.etat || '').toLowerCase().includes('airing');
                if (filters.statut === 'fini' && !isFini) return false;
                if (filters.statut === 'encours' && !isEnCours) return false;
            }

            // Année
            const aYear = getYear(a.sortie);
            if (aYear > 0) {
                if (filters.yearMin && aYear < parseInt(filters.yearMin)) return false;
                if (filters.yearMax && aYear > parseInt(filters.yearMax)) return false;
            } else if (filters.yearMin || filters.yearMax) {
                return false; 
            }

            // Score
            const aScore = parseFloat((a.score || '0').replace(',', '.'));
            if (filters.scoreMin && aScore < parseFloat(filters.scoreMin)) return false;
            if (filters.scoreMax && aScore > parseFloat(filters.scoreMax)) return false;

            // Tags
            if (filters.tags.size > 0) {
                if (!a.tags) return false;
                const aTags = a.tags.split(',').map(t => t.trim());
                for (const t of filters.tags) if (!aTags.includes(t)) return false;
            }

            // PLS
            if (filters.pls.size > 0) {
                const aPls = [];
                if (a.producteur) aPls.push(...a.producteur.split(',').map(s=>s.trim()));
                if (a.label) aPls.push(...a.label.split(',').map(s=>s.trim()));
                if (a.studio) aPls.push(...a.studio.split(',').map(s=>s.trim()));
                
                let hasOne = false;
                for (const p of filters.pls) if (aPls.includes(p)) { hasOne = true; break; }
                if (!hasOne) return false;
            }

            return true;
        });

        if (filters.search) filtered = searchAnimes(filters.search, filtered);

        filtered.sort((a, b) => {
            if (filters.sort === 'recent') return b.ordreAjout - a.ordreAjout;
            if (filters.sort === 'score') return (parseFloat(b.score.replace(',','.'))||0) - (parseFloat(a.score.replace(',','.'))||0);
            if (filters.sort === 'year-desc') return getYear(b.sortie) - getYear(a.sortie);
            if (filters.sort === 'year-asc') return getYear(a.sortie) - getYear(b.sortie);
            if (filters.sort === 'name') return a.nom.localeCompare(b.nom);
            return 0;
        });

        document.getElementById('results-count').textContent = `${filtered.length} résultat${filtered.length > 1 ? 's' : ''}`;
        
        const grid = document.getElementById('results-grid');
        if (filtered.length === 0) {
            grid.innerHTML = '<div style="text-align:center; padding:40px; color:#888; grid-column:1/-1;">Aucun anime ne correspond à ces critères.</div>';
            return;
        }

        grid.innerHTML = filtered.map(a => {
            const cover = getCoverPath(a.ordreAjout, 1);
            const year = getYear(a.sortie) || '—';
            return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="card">
                <div class="img-wrap">
                    <img src="${cover}" loading="lazy" onerror="handleImgError(this,'${a.ordreAjout}-1.webp')">
                    ${a.score ? `<div class="score-badge">★ ${a.score}</div>` : ''}
                </div>
                <div class="card-info">
                    <div class="card-title">${a.nom}</div>
                    <div style="font-size:0.7em; color:#aaa;">${year} • ${a.ep} ép.</div>
                </div>
            </a>`;
        }).join('');
    }

    init();
</script>
</body>
</html>
