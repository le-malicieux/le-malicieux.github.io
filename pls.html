<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Industrie - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; overflow-x: hidden; padding-top: 62px; }
        .page-wrap { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 100px) 60px; }
        
        /* En-tête avec Tri */
        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .page-title { font-size: 1.6em; font-weight: 900; color: var(--primary); margin: 0; }
        .sort-select { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.85em; cursor: pointer; outline: none; }

        /* Onglets Hentai / Erotica */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 24px; border-radius: 8px 8px 0 0; font-size: 1em; font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: none; margin-bottom: -11px; }
        .tab-btn:hover { color: white; background: #222; }
        .tab-btn.active { background: var(--card-bg); color: var(--primary); border-color: var(--primary); border-bottom: 2px solid var(--card-bg); }
        
        /* Séparateurs de section */
        .section-sep { display: flex; align-items: center; gap: 12px; margin: 30px 0 15px 0; }
        .section-sep-line { flex: 1; height: 1px; background: rgba(255,71,87,0.25); }
        .section-sep-label { font-size: 0.85em; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
        
        /* Grille de cartes PLS */
        .pls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 10px; }
        .pls-card { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: row; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
        .pls-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,71,87,0.1); }
        .pls-logo-wrap { width: 62px; height: 62px; flex-shrink: 0; background: #111; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .pls-logo { width: 100%; height: 100%; object-fit: contain; object-position: center; }
        .pls-logo-fallback { width: 100%; height: 100%; background: linear-gradient(135deg, #1a0008, #2d0014); display: flex; align-items: center; justify-content: center; font-size: 1.3em; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
        .pls-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .pls-name { font-weight: 800; font-size: 0.9em; color: white; line-height: 1.3; }
        .pls-count { font-size: 0.72em; color: #888; }
        .pls-count span { color: var(--primary); font-weight: bold; }

        /* En-tête de la vue Grille (Logo + Nom + Infos + Stats) */
        .grid-header { display: flex; align-items: flex-start; gap: 20px; background: var(--card-bg); border: 1px solid #2a2a2a; padding: 20px; border-radius: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .grid-header-logo { width: 100px; height: 100px; background: #111; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 5px; flex-shrink: 0; border: 1px solid #333; }
        .grid-header-logo img { width: 100%; height: 100%; object-fit: contain; }
        .grid-header-fallback { width: 100%; height: 100%; background: linear-gradient(135deg, #1a0008, #2d0014); display: flex; align-items: center; justify-content: center; font-size: 2.5em; font-weight: 900; color: var(--primary); }
        .grid-header-info { flex: 1; min-width: 300px; }
        .grid-header-info h1 { margin: 0 0 5px 0; font-size: 1.8em; color: white; }
        .grid-header-info .subtitle { margin: 0 0 12px 0; color: #888; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.05em; }
        .grid-header-info .subtitle a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .grid-header-info .subtitle a:hover { text-decoration: underline; }
        
        /* Badges de liens dans l'en-tête */
        .header-links-box { background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
        .header-links-title { font-size: 0.7em; color: #aaa; text-transform: uppercase; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.05em; }
        .header-links { display: flex; flex-wrap: wrap; gap: 8px; }
        .header-link { display: inline-flex; align-items: center; font-size: 0.75em; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .header-link.mal { background: rgba(46,134,222,0.15); color: #2e86de; border: 1px solid rgba(46,134,222,0.3); }
        .header-link.mal:hover { background: #2e86de; color: white; }
        .header-link.web { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid #444; }
        .header-link.web:hover { background: #444; color: white; }
        
        /* Relations */
        .header-relations { display: flex; flex-direction: column; gap: 4px; font-size: 0.75em; color: #888; line-height: 1.4; margin-bottom: 15px; }
        .header-relations strong { color: var(--text); margin-right: 4px; }
        .relation-link { color: #ff6b7a; text-decoration: none; transition: 0.15s; }
        .relation-link:hover { color: white; text-decoration: underline; }

        /* Statistiques (intégrées dans l'en-tête) */
        .pls-stats-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .pls-stat-box { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 14px; text-align: center; min-width: 80px; }
        .pls-stat-val { font-size: 1.2em; font-weight: 900; color: var(--primary); display: block; line-height: 1.1; }
        .pls-stat-lbl { font-size: 0.6em; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; display: block; }

        /* Barre de contrôles (Filtres) */
        .pls-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; background: var(--card-bg); padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2a2a; }
        .ctrl-select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.85em; cursor: pointer; outline: none; }
        .result-count { font-size: 0.8em; color: #888; margin-left: auto; }

        /* Grille d'animés */
        .producer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .anime-card { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; transition: 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .anime-card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .anime-card .img-wrap { width: 100%; aspect-ratio: 2/3; background: #111; position: relative; }
        .anime-card img { width: 100%; height: 100%; object-fit: cover; }
        .ac-info { padding: 7px; flex: 1; }
        .ac-title { font-weight: 700; color: var(--primary); font-size: 0.88em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
        
        /* Nouveaux badges de métadonnées et surlignage */
        .ac-meta { font-size: 0.68em; color: #888; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .ac-meta span { padding: 1px 4px; border-radius: 3px; transition: 0.2s; }
        .ac-meta .highlight { color: var(--primary); font-weight: bold; background: rgba(255,71,87,0.15); }
        
        .score-badge { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.72); color: #f1c40f; font-size: 0.7em; padding: 2px 5px; border-radius: 4px; }
        
        .empty-state { text-align: center; color: #555; padding: 40px 20px; grid-column: 1/-1; }
        .btn-back-list { display: inline-flex; align-items: center; gap: 6px; color: #aaa; font-size: 0.85em; cursor: pointer; border: 1px solid #333; background: #1a1a1a; padding: 6px 12px; border-radius: 6px; margin-bottom: 20px; text-decoration: none; }
        .btn-back-list:hover { color: var(--primary); border-color: var(--primary); }

        @media (max-width: 700px) {
            .pls-grid { grid-template-columns: 1fr !important; }
            .producer-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
            .grid-header { flex-direction: column; align-items: center; text-align: center; }
            .header-relations { align-items: center; text-align: center; }
            .header-links { justify-content: center; }
            .pls-controls { flex-direction: column; align-items: stretch; }
            .result-count { margin-left: 0; text-align: center; }
            .pls-stats-bar { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    
    <header class="site-header">
        <div class="navbar">
            <div class="nav-left">
                <button class="burger" onclick="toggleM()" aria-label="Ouvrir le menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <a class="nav-brand" href="index.html">
                    <img src="img/bannieres_icones/logo.jpg" class="nav-logo-small" alt="Logo Le Malicieux">
                    <span class="nav-title">LE MALICIEUX</span>
                </a>
            </div>
            <div class="mobile-overlay" id="overlay" onclick="toggleM()"></div>
            <nav class="nav-links" id="menu">
                <div class="close-menu" onclick="toggleM()">Fermer</div>
                <a href="index.html" class="nav-tab" data-page="index.html">Accueil</a>
                <a href="tags.html" class="nav-tab" data-page="tags.html">Tags</a>
                <a href="alphabetique.html" class="nav-tab" data-page="alphabetique.html">A-Z</a>
                <a href="playlist.html" class="nav-tab" data-page="playlist.html">Playlist</a>
                <a href="pls.html" class="nav-tab" data-page="pls.html">Industrie</a>
                <a href="profil.html" class="nav-tab" data-page="profil.html">Profil</a>
                <a href="index_old.html" class="nav-tab" data-page="index_old.html">Ancien Index</a>
                <button class="nav-action" onclick="studioRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">

            <div class="nav-right">
                <button class="nav-action" onclick="studioRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
            </div>
        </div>
    </header>

    <div class="page-wrap">
        <div class="tabs-container" id="tabs-container">
            <button class="tab-btn active" data-tab="hentai" onclick="location.hash='hentai/list'">Hentai</button>
            <button class="tab-btn" data-tab="erotica" onclick="location.hash='erotica/list'">Erotica</button>
        </div>
        
        <div id="view-container">
            <div class="empty-state">Chargement des données...</div>
        </div>
    </div>

<script type="module">
    import { initCommon, loadAnimes, getCoverPath, handleImgError, IMG_LOGO, parseCSVLine } from './common.js';
    initCommon();

    let allAnimes = [];
    let eroticaSet = new Set();
    let prodsData = {}; 
    let studiosData = {}; 
    let currentTab = 'hentai';
    let currentSort = 'count-desc'; // Tri par défaut par nombre de titres (Desc)
    
    let currentGridFilters = { sort: 'score-desc', filter: '', costudio: '' };

    const cleanStr = s => (s || '').replace(/^\uFEFF/, '').trim();

    async function init() {
        try {
            allAnimes = await loadAnimes();
            const resp = await fetch('plsero_liste.csv');
            if (resp.ok) {
                const text = await resp.text();
                text.split(/\r?\n/).forEach(l => { 
                    const n = cleanStr(l); 
                    if (n && n !== 'Studios Erotica') eroticaSet.add(n); 
                });
            }
            await Promise.all([
                loadProds('prods.csv', false), loadProds('prods_ero.csv', true),
                loadStudios('studios.csv', false), loadStudios('studios_ero.csv', true)
            ]);
            window.addEventListener('hashchange', route);
            route();
        } catch (e) {
            console.error(e);
            document.getElementById('view-container').innerHTML = `<div class="empty-state" style="color:red;">Erreur : ${e.message}</div>`;
        }
    }

    // ── CHARGEMENT DES CSV ──
    async function loadProds(url, isEro) {
        try {
            const resp = await fetch(url);
            if (!resp.ok) return;
            const text = await resp.text();
            const lines = text.split(/\r?\n/);
            let currentProdName = ""; 
            
            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(cleanStr(lines[i]));
                if (cols.length < 1) continue;
                
                const prodName = cleanStr(cols[0]);
                if (prodName) currentProdName = prodName;
                if (!currentProdName) continue;

                if (!prodsData[currentProdName]) {
                    prodsData[currentProdName] = { isEro, links: {}, relations: {}, labels: {} };
                }
                
                if (cleanStr(cols[1]) || cleanStr(cols[2]) || cleanStr(cols[3])) {
                    prodsData[currentProdName].links = { mal: cleanStr(cols[1]), web: cleanStr(cols[2]), old: cleanStr(cols[3]) };
                    prodsData[currentProdName].relations = { prods: cleanStr(cols[4]), labels: cleanStr(cols[5]), studios: cleanStr(cols[6]) };
                }

                const labelName = cleanStr(cols[7]);
                if (labelName) {
                    if (!prodsData[currentProdName].labels[labelName]) {
                        prodsData[currentProdName].labels[labelName] = { isEro, links: {}, relations: {} };
                    }
                    prodsData[currentProdName].labels[labelName].links = { mal: cleanStr(cols[8]), web: cleanStr(cols[9]), old: cleanStr(cols[10]) };
                    prodsData[currentProdName].labels[labelName].relations = { prods: cleanStr(cols[11]), labels: cleanStr(cols[12]), studios: cleanStr(cols[13]) };
                }
            }
        } catch(e) { console.warn("Erreur loadProds", url, e); }
    }

    async function loadStudios(url, isEro) {
        try {
            const resp = await fetch(url);
            if (!resp.ok) return;
            const text = await resp.text();
            const lines = text.split(/\r?\n/);
            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(cleanStr(lines[i]));
                if (cols.length < 1) continue;
                const name = cleanStr(cols[0]);
                if (!name) continue;
                
                if (!studiosData[name]) studiosData[name] = { isEro };
                studiosData[name].links = { mal: cleanStr(cols[2]), web: cleanStr(cols[3]), old: "" };
                studiosData[name].relations = { prods: cleanStr(cols[4]), labels: cleanStr(cols[5]), studios: cleanStr(cols[6]) };
            }
        } catch(e) {}
    }

    // ── LOGIQUE DE RECHERCHE ──
    function getAnimesFor(type, name) {
        const isEro = currentTab === 'erotica';
        const normalize = s => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
        
        return allAnimes.filter(a => {
            let isAnimeEro = false;
            [a.producteur, a.label, a.studio].forEach(str => {
                if (str && str.split(',').some(s => eroticaSet.has(s.trim()))) isAnimeEro = true;
            });
            if (isAnimeEro !== isEro) return false;

            if (type === 'producer') return (a.producteur || '').split(',').map(normalize).includes(normalize(name));
            if (type === 'label') return (a.label || '').split(',').map(normalize).includes(normalize(name));
            if (type === 'studio') return (a.studio || '').split(',').map(normalize).includes(normalize(name));
            return false;
        });
    }

    function getLogoUrl(name) { 
        return `img/pls/${encodeURI(name.replace(/\s+/g, '-'))}.webp`; 
    }

    function generateRelationLinks(str, type) {
        if (!str) return '';
        return str.split(',').map(s => s.trim()).filter(Boolean).map(name => {
            let targetType = type;
            if (type === 'prods' && studiosData[name]) targetType = 'studio';
            else if (type === 'prods' && !prodsData[name]) targetType = 'studio'; 
            if (type === 'labels' && !prodsData[name]) targetType = 'label';
            
            if (targetType === 'prods') targetType = 'producer';
            if (targetType === 'labels') targetType = 'label';
            if (targetType === 'studios') targetType = 'studio';

            const safeName = encodeURIComponent(name).replace(/%2F/g, '§');
            return `<a href="#${currentTab}/grid/${targetType}/${safeName}" class="relation-link">${name}</a>`;
        }).join(', ');
    }

    function buildCard(name, type, count) {
        let link = `#${currentTab}/grid/${type}/${encodeURIComponent(name).replace(/%2F/g, '§')}`;
        const initials = name.split(/[\s\-_]+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase();
        
        return `<a href="${link}" class="pls-card">
            <div class="pls-logo-wrap">
                <img src="${getLogoUrl(name)}" class="pls-logo" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'pls-logo-fallback\\'>${initials}</div>'">
            </div>
            <div class="pls-card-body">
                <div class="pls-name">${name}</div>
                <div class="pls-count"><span>${count}</span> titre${count > 1 ? 's' : ''}</div>
            </div>
        </a>`;
    }

    // Modification pour intégrer le surlignage en fonction du tri
    function buildAnimeCard(a, sortVal) {
        const cover = getCoverPath(a.ordreAjout, 1);
        const scoreNum = parseFloat(a.score.replace(',','.'));
        const yearMatch = (a.sortie || '').match(/\d{4}/g);
        const year = yearMatch ? yearMatch[yearMatch.length - 1] : '—';
        
        const hl = (f) => sortVal === f ? 'highlight' : '';

        return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="anime-card">
            <div class="img-wrap"><img src="${cover}" loading="lazy" onerror="handleImgError(this,'${a.ordreAjout}-1.webp')">${scoreNum ? `<div class="score-badge">${a.score}</div>` : ''}</div>
            <div class="ac-info">
                <div class="ac-title">${a.nom}</div>
                <div class="ac-meta">
                    <span class="${hl('score')}">★ ${a.score || '—'}</span>
                    <span class="${hl('annee')}">${year}</span>
                    <span class="${hl('episodes')}">${a.ep} ép.</span>
                    <span class="${hl('pop')}">${a.pop}</span>
                </div>
            </div>
        </a>`;
    }

    // ── RENDU DES VUES ──
    function renderList(tab) {
        const isEro = tab === 'erotica';
        let prods = [], studios = [];

        for (const [name, data] of Object.entries(prodsData)) {
            if ((data.isEro || eroticaSet.has(name)) !== isEro) continue;
            const count = getAnimesFor('producer', name).length;
            if (count > 0) prods.push({ name, count });
        }
        for (const [name, data] of Object.entries(studiosData)) {
            if ((data.isEro || eroticaSet.has(name)) !== isEro) continue;
            const count = getAnimesFor('studio', name).length;
            if (count > 0) studios.push({ name, count });
        }

        const sortFn = (a, b) => {
            if (currentSort === 'name-asc') return a.name.localeCompare(b.name, 'fr');
            if (currentSort === 'name-desc') return b.name.localeCompare(a.name, 'fr');
            if (currentSort === 'count-desc') return b.count - a.count;
            if (currentSort === 'count-asc') return a.count - b.count;
            return 0;
        };
        prods.sort(sortFn); studios.sort(sortFn);

        let html = `
            <div class="page-header">
                <h1 class="page-title">Industrie ${tab === 'hentai' ? 'Hentai' : 'Erotica'}</h1>
                <select class="sort-select" id="pls-sort">
                    <option value="count-desc" ${currentSort === 'count-desc' ? 'selected' : ''}>Trier : Nb titres (Desc)</option>
                    <option value="count-asc" ${currentSort === 'count-asc' ? 'selected' : ''}>Trier : Nb titres (Asc)</option>
                    <option value="name-asc" ${currentSort === 'name-asc' ? 'selected' : ''}>Trier : A à Z</option>
                    <option value="name-desc" ${currentSort === 'name-desc' ? 'selected' : ''}>Trier : Z à A</option>
                </select>
            </div>
        `;

        if (prods.length) {
            html += `<div class="section-sep"><div class="section-sep-label">Producteurs</div><div class="section-sep-line"></div></div>`;
            html += `<div class="pls-grid">${prods.map(p => buildCard(p.name, 'producer', p.count)).join('')}</div>`;
        }
        if (studios.length) {
            html += `<div class="section-sep"><div class="section-sep-label">Studios</div><div class="section-sep-line"></div></div>`;
            html += `<div class="pls-grid">${studios.map(s => buildCard(s.name, 'studio', s.count)).join('')}</div>`;
        }

        document.getElementById('view-container').innerHTML = html;
        
        document.getElementById('pls-sort').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderList(currentTab);
        });
    }

    function buildHeader(name, type, data, parentProd, stats) {
        let linksHtml = '';
        if (data.links) {
            if (data.links.mal) linksHtml += `<a href="${data.links.mal}" target="_blank" class="header-link mal">MyAnimeList</a>`;
            if (data.links.web) linksHtml += `<a href="${data.links.web}" target="_blank" class="header-link web">Site Web</a>`;
            if (data.links.old) {
                const isAniDB = data.links.old.toLowerCase().includes('anidb');
                const label = isAniDB ? 'AniDB' : 'Ancien Site';
                linksHtml += `<a href="${data.links.old}" target="_blank" class="header-link web">${label}</a>`;
            }
        }

        let relationsHtml = '';
        if (data.relations) {
            if (data.relations.prods) relationsHtml += `<div><strong>Travaille avec (Producteurs) :</strong> ${generateRelationLinks(data.relations.prods, 'prods')}</div>`;
            if (data.relations.labels) relationsHtml += `<div><strong>Travaille avec (Labels) :</strong> ${generateRelationLinks(data.relations.labels, 'labels')}</div>`;
            if (data.relations.studios) relationsHtml += `<div><strong>Travaille avec (Studios) :</strong> ${generateRelationLinks(data.relations.studios, 'studios')}</div>`;
        }

        let subtitleHtml = type === 'producer' ? 'PRODUCTEUR' : type === 'studio' ? 'STUDIO' : 'LABEL';
        if (type === 'label' && parentProd) {
            const safeParent = encodeURIComponent(parentProd).replace(/%2F/g, '§');
            subtitleHtml = `LABEL DE <a href="#${currentTab}/grid/producer/${safeParent}">${parentProd}</a>`;
        }

        const initials = name.split(/[\s\-_]+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase();

        let statsHtml = '';
        if (stats) {
            statsHtml = `
            <div class="pls-stats-bar">
                <div class="pls-stat-box"><span class="pls-stat-val">${stats.total}</span><span class="pls-stat-lbl">Titres</span></div>
                <div class="pls-stat-box"><span class="pls-stat-val">${stats.avg}</span><span class="pls-stat-lbl">Score moy.</span></div>
                <div class="pls-stat-box"><span class="pls-stat-val">${stats.best}</span><span class="pls-stat-lbl">Meilleur</span></div>
                <div class="pls-stat-box"><span class="pls-stat-val">${stats.worst}</span><span class="pls-stat-lbl">Pire score</span></div>
            </div>`;
        }

        return `
        <div class="grid-header">
            <div class="grid-header-logo">
                <img src="${getLogoUrl(name)}" onerror="this.parentElement.innerHTML='<div class=\\'grid-header-fallback\\'>${initials}</div>'">
            </div>
            <div class="grid-header-info">
                <h1>${name}</h1>
                <p class="subtitle">${subtitleHtml}</p>
                
                ${linksHtml ? `<div class="header-links-box"><div class="header-links-title">Liens de redirection</div><div class="header-links">${linksHtml}</div></div>` : ''}
                ${relationsHtml ? `<div class="header-relations">${relationsHtml}</div>` : ''}
                ${statsHtml}
            </div>
        </div>`;
    }

    function renderGrid(tab, type, name) {
        let animes = getAnimesFor(type, name);
        
        let data = {};
        let parentProd = null;

        if (type === 'producer') data = prodsData[name] || {};
        else if (type === 'label') {
            for (const [pName, pData] of Object.entries(prodsData)) {
                if (pData.labels && pData.labels[name]) { 
                    data = pData.labels[name]; 
                    parentProd = pName;
                    break; 
                }
            }
        }
        else if (type === 'studio') data = studiosData[name] || {};

        const validScores = animes.map(a => parseFloat(a.score.replace(',', '.'))).filter(n => !isNaN(n) && n > 0);
        const total = animes.length;
        const avg = validScores.length ? (validScores.reduce((a,b)=>a+b,0) / validScores.length).toFixed(2) : '—';
        const best = validScores.length ? Math.max(...validScores).toFixed(2) : '—';
        const worst = validScores.length ? Math.min(...validScores).toFixed(2) : '—';
        
        const stats = { total, avg, best, worst };

        // Remplacement du lien classique par un retour intelligent
        let html = `<a href="javascript:void(0)" onclick="if(history.length>1) history.back(); else location.hash='${tab}/list';" class="btn-back-list">← Retour à la liste</a>`;
        html += buildHeader(name, type, data, parentProd, stats);

        if (type === 'producer' && data.labels && Object.keys(data.labels).length > 0) {
            html += `<div class="section-sep"><div class="section-sep-label">Labels de ce producteur</div><div class="section-sep-line"></div></div>`;
            html += `<div class="pls-grid">${Object.keys(data.labels).sort().map(l => {
                const count = getAnimesFor('label', l).length;
                return buildCard(l, 'label', count);
            }).join('')}</div>`;
        }

        const coStudios = new Set();
        animes.forEach(a => {
            (a.studio || '').split(',').map(s => s.trim()).filter(Boolean).forEach(s => {
                if (s !== name) coStudios.add(s);
            });
        });

        html += `<div class="section-sep"><div class="section-sep-label">Tous les animes</div><div class="section-sep-line"></div></div>`;
        
        html += `
        <div class="pls-controls">
            <select class="ctrl-select" id="grid-sort">
                <option value="score-desc" ${currentGridFilters.sort === 'score-desc' ? 'selected' : ''}>Tri : Score (Desc)</option>
                <option value="score-asc" ${currentGridFilters.sort === 'score-asc' ? 'selected' : ''}>Tri : Score (Asc)</option>
                <option value="pop" ${currentGridFilters.sort === 'pop' ? 'selected' : ''}>Tri : Popularité</option>
                <option value="annee" ${currentGridFilters.sort === 'annee' ? 'selected' : ''}>Tri : Année</option>
                <option value="nom" ${currentGridFilters.sort === 'nom' ? 'selected' : ''}>Tri : Nom (A-Z)</option>
                <option value="episodes" ${currentGridFilters.sort === 'episodes' ? 'selected' : ''}>Tri : Épisodes</option>
            </select>
            <select class="ctrl-select" id="grid-filter">
                <option value="" ${currentGridFilters.filter === '' ? 'selected' : ''}>Tout afficher</option>
                <option value="en cours" ${currentGridFilters.filter === 'en cours' ? 'selected' : ''}>En cours</option>
                <option value="terminé" ${currentGridFilters.filter === 'terminé' ? 'selected' : ''}>Terminés</option>
                <option value="oui" ${currentGridFilters.filter === 'oui' ? 'selected' : ''}>Censuré</option>
                <option value="non" ${currentGridFilters.filter === 'non' ? 'selected' : ''}>Non censuré</option>
            </select>
            ${coStudios.size > 0 ? `
            <select class="ctrl-select" id="grid-costudio">
                <option value="">Tous les studios</option>
                ${Array.from(coStudios).sort().map(s => `<option value="${s}" ${currentGridFilters.costudio === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>` : ''}
            <span class="result-count" id="grid-count"></span>
        </div>
        
        <div id="grid-container"></div>`;

        document.getElementById('view-container').innerHTML = html;

        const applyFilters = () => {
            const sVal = document.getElementById('grid-sort').value;
            const fVal = document.getElementById('grid-filter').value;
            const cVal = document.getElementById('grid-costudio') ? document.getElementById('grid-costudio').value : '';
            
            currentGridFilters = { sort: sVal, filter: fVal, costudio: cVal };

            let filtered = [...animes];
            
            if (fVal === 'oui' || fVal === 'non') filtered = filtered.filter(a => a.censure.toLowerCase() === fVal);
            else if (fVal === 'terminé') filtered = filtered.filter(a => a.etat.toLowerCase().includes('termin') || a.etat.toLowerCase().includes('fini'));
            else if (fVal === 'en cours') filtered = filtered.filter(a => a.etat.toLowerCase().includes('cours') || a.etat.toLowerCase().includes('airing'));
            
            if (cVal) filtered = filtered.filter(a => (a.studio || '').split(',').map(s => s.trim()).includes(cVal));

            filtered.sort((a, b) => {
                if (sVal === 'score-desc') return (parseFloat(b.score.replace(',','.'))||0) - (parseFloat(a.score.replace(',','.'))||0);
                if (sVal === 'score-asc') return (parseFloat(a.score.replace(',','.'))||0) - (parseFloat(b.score.replace(',','.'))||0);
                if (sVal === 'pop') return (parseInt(a.pop.replace('#',''))||99999) - (parseInt(b.pop.replace('#',''))||99999);
                if (sVal === 'annee') { 
                    const getY = s => { const m = (s||'').match(/\d{4}/g); return m ? parseInt(m[m.length-1]) : 0; };
                    return getY(b.sortie) - getY(a.sortie); 
                }
                if (sVal === 'nom') return a.nom.localeCompare(b.nom);
                if (sVal === 'episodes') { const na=parseInt((a.ep||'').match(/\d+/g)?.pop()||0), nb=parseInt((b.ep||'').match(/\d+/g)?.pop()||0);return nb-na; }
                return 0;
            });

            document.getElementById('grid-count').textContent = `${filtered.length} titre${filtered.length > 1 ? 's' : ''} affiché${filtered.length > 1 ? 's' : ''}`;
            
            const container = document.getElementById('grid-container');
            if (filtered.length === 0) container.innerHTML = `<div class="empty-state">Aucun anime ne correspond à ces filtres.</div>`;
            // On passe sVal à buildAnimeCard pour le surlignage
            else container.innerHTML = `<div class="producer-grid">${filtered.map(a => buildAnimeCard(a, sVal)).join('')}</div>`;
        };

        document.getElementById('grid-sort').addEventListener('change', applyFilters);
        document.getElementById('grid-filter').addEventListener('change', applyFilters);
        if (document.getElementById('grid-costudio')) document.getElementById('grid-costudio').addEventListener('change', applyFilters);

        applyFilters();
    }

    function route() {
        const hash = window.location.hash.slice(1) || 'hentai/list';
        const parts = hash.split('/');
        const tab = parts[0] || 'hentai';
        const view = parts[1] || 'list';
        
        const rawName = parts[2] ? decodeURIComponent(parts[2]).replace(/§/g, '/') : '';
        const rawName2 = parts[3] ? decodeURIComponent(parts[3]).replace(/§/g, '/') : '';

        currentTab = tab;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        
        if (view === 'list') {
            renderList(tab);
            document.getElementById('tabs-container').style.display = 'flex';
        } else {
            document.getElementById('tabs-container').style.display = 'none';
            if (view === 'grid') renderGrid(tab, rawName, rawName2);
        }
    }

    window.studioRandom = () => {
        const keys = Object.keys(studiosData);
        if (keys.length) {
            const rand = keys[Math.floor(Math.random() * keys.length)];
            location.hash = `${currentTab}/grid/studio/${encodeURIComponent(rand).replace(/%2F/g, '§')}`;
        }
    };
    
    init();
</script>
</body>
</html>
