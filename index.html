    <meta charset="UTF-8">
    <script>
    /* Applique le thème avant le premier rendu (pas de flash) */

    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <title>Le Malicieux - Catalogue d'Animes</title>
    <style>
        :root { --primary: #ff4757; --bg: #0f0f0f; --card-bg: rgba(20, 20, 20, 0.9); --text: #eee; --text-bright: #ffffff; --text-secondary: #ccc; --nav-bg: rgba(15, 15, 15, 0.85); }

        #bg-layer {
            position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background-size: cover; background-position: center center;
            background-repeat: no-repeat;
        }
        #bg-overlay {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: black; opacity: 0;
            transition: none;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 62px;
        }

        /* ═══════════════ EN-TÊTE — barre unique ═══════════════ */
        /* Thème d'affichage : sombre (défaut) ou gris */
        html[data-theme="gris"] {
            --page-bg: #a9a9a9;
            --panel-bg: rgba(238,238,238,0.94);
            --panel-border: #8d8d8d;
            --panel-head: rgba(0,0,0,0.05);
            --txt: #1c1c1c;
            --txt-dim: #4a4a4a;
            --card-surface: #f4f4f4;
        }
        html[data-theme="gris"] body {
            background-image: none !important;
            background-color: var(--page-bg) !important;
        }
        html[data-theme="gris"] .section-block { background: var(--panel-bg); border-color: var(--panel-border); }
        html[data-theme="gris"] .section-title-wrapper { background: var(--panel-head); border-bottom-color: var(--panel-border); }
        html[data-theme="gris"] .section-title { color: var(--txt); }
        html[data-theme="gris"] .card { background: var(--card-surface); border-color: #b4b4b4; color: var(--txt); }
        html[data-theme="gris"] .card-title { color: var(--txt); }
        html[data-theme="gris"] .card-meta-row { color: var(--txt-dim); }
        html[data-theme="gris"] .meta-badge { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.15); color: #3a3a3a; }
        html[data-theme="gris"] .meta-editeur { color: #666; }
        html[data-theme="gris"] .tag-section-box { background: rgba(0,0,0,0.04); border-bottom-color: var(--panel-border); }
        html[data-theme="gris"] .tag-description { color: var(--txt-dim); }
        html[data-theme="gris"] .carousel-btn { background: #efefef; border-color: #9a9a9a; color: #333; }
        html[data-theme="gris"] .carousel-btn:hover { background: var(--primary); color: #fff; }
        html[data-theme="gris"] .hero-section { background: rgba(255,255,255,0.35); }
        html[data-theme="gris"] .main-title, html[data-theme="gris"] .main-slogan { color: #1c1c1c; text-shadow: none; }
        html[data-theme="gris"] .anime-count { background: rgba(255,255,255,0.8); }
        html[data-theme="gris"] #search-results-count { color: #4a4a4a; }

        .site-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: #121214;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .navbar {
            display: flex; align-items: stretch; gap: 0;
            max-width: 1500px; margin: 0 auto; padding: 0 18px;
            height: 62px;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-right: 22px; }
        .nav-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; cursor: pointer; }
        .nav-logo-small { width: 38px; height: 38px; border-radius: 3px; border: 1px solid var(--primary); object-fit: cover; }
        .nav-title { color: var(--text-bright); font-weight: 800; font-size: 1.05em; letter-spacing: 0.6px; white-space: nowrap; }

        #back-home { font-size: 0.72em; color: #ff6b7a; text-decoration: none; display: none; cursor: pointer; margin-left: 4px; }

        .burger { display: none; background: none; border: none; padding: 4px; cursor: pointer; align-items: center; }
        .burger svg { width: 26px; height: 26px; stroke: var(--text-bright); }

        /* Onglets, alignés dans la même barre */
        .nav-links { display: flex; align-items: stretch; flex: 1; min-width: 0; }
        .nav-tab {
            display: flex; align-items: center;
            color: #b9b9bd; text-decoration: none; cursor: pointer;
            font-size: 0.82em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 0 14px; border-bottom: 3px solid transparent; margin-bottom: -3px;
            white-space: nowrap; transition: color 0.15s, background 0.15s;
        }
        .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-tab.active { color: #fff; border-bottom-color: var(--primary); background: rgba(255,71,87,0.09); }

        .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-left: 14px; }

        .search-wrapper { position: relative; width: 250px; flex-shrink: 0; }
        .search-wrapper input {
            width: 100%; background: #1c1c1f; border: 1px solid #38383d; color: white;
            padding: 8px 34px 8px 11px; border-radius: 2px; font-size: 0.85em;
            box-sizing: border-box; outline: none; transition: border-color 0.15s;
        }
        .search-wrapper input:focus { border-color: var(--primary); background: #202024; }
        .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; display: flex; }
        .search-icon svg { width: 15px; height: 15px; stroke: #8a8a90; }
        .search-suggestions {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: #1a1a1d; border: 1px solid #38383d;
            max-height: 340px; overflow-y: auto; display: none; z-index: 2000;
            box-shadow: 0 6px 18px rgba(0,0,0,0.55);
        }
        .search-suggestions.active { display: block; }
        .search-suggestions .suggestion-item {
            padding: 7px 10px; cursor: pointer; color: #ccc; font-size: 0.85em;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 10px;
        }
        .search-suggestions .suggestion-item:last-child { border-bottom: none; }
        .search-suggestions .suggestion-item:hover,
        .search-suggestions .suggestion-item.hl { background: #2b2b30; color: white; }
        .search-suggestions .sugg-img { width: 30px; height: 42px; border-radius: 2px; object-fit: cover; flex-shrink: 0; background: #333; }
        .search-suggestions .sugg-meta { font-size: 0.78em; color: #8a8a90; display: block; margin-top: 2px; }
        .search-suggestions .sugg-empty { padding: 12px 10px; color: #8a8a90; font-size: 0.85em; }
        .search-suggestions mark { background: none; color: var(--primary); font-weight: 700; }

        .nav-action {
            background: none; color: #b9b9bd; border: 1px solid #3a3a3f; cursor: pointer;
            font-size: 0.76em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
            padding: 8px 13px; border-radius: 2px; white-space: nowrap; transition: 0.15s;
        }
        .nav-action:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .discord-btn {
            display: flex; align-items: center; justify-content: center;
            height: 34px; width: auto; border-radius: 2px; overflow: hidden;
            border: 1px solid #3a3a3f; flex-shrink: 0; transition: border-color 0.15s;
            background: #5865F2; padding: 0;
        }
        .discord-btn:hover { border-color: #8b95ff; }
        .discord-btn img {
            height: 100%; width: auto; display: block;
            object-fit: contain;
        }

        .theme-toggle { display: flex; align-items: center; gap: 7px; }
        .theme-swatch {
            width: 13px; height: 13px; border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.45);
            background: #121214; flex-shrink: 0; transition: background 0.2s;
        }
        html[data-theme="gris"] .theme-swatch { background: #a9a9a9; border-color: rgba(0,0,0,0.4); }
        html[data-theme="gris"] .nav-action { border-color: #4a4a4f; }

        #login-btn {
            background: #5865F2; border: none; color: white; padding: 8px 13px;
            border-radius: 2px; cursor: pointer; font-size: 0.78em; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
        }
        #login-btn:hover { background: #4752c4; }

        .nav-links .nav-action, .nav-links .discord-btn { display: none; }

        .close-menu { display: none; font-size: 0.85em; color: var(--primary); cursor: pointer; margin-bottom: 18px; background: none !important; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1050; }

        @media (max-width: 1100px) {
            .search-wrapper { width: 180px; }
            .nav-tab { padding: 0 10px; font-size: 0.78em; }
        }

        @media (max-width: 900px) {
            .navbar { height: 58px; padding: 0 12px; }
            .burger { display: flex; }
            .nav-left { padding-right: 10px; gap: 8px; }
            .nav-logo-small { width: 32px; height: 32px; }
            .nav-title { font-size: 0.92em; }
            .nav-right { flex: 1; justify-content: flex-end; padding-left: 8px; }
            .search-wrapper { flex: 1; width: auto; max-width: 260px; }
            .nav-right .nav-action, .nav-right .discord-btn { display: none; }
            #login-btn { padding: 7px 11px; font-size: 0.72em; }

            .nav-links {
                position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
                background: #131315; flex-direction: column; align-items: stretch; padding: 26px 18px;
                transition: right 0.35s cubic-bezier(0.4,0,0.2,1); z-index: 1100;
                overflow-y: auto; left: auto; flex: none;
                border-left: 1px solid #2a2a2e;
            }
            .nav-links.active { right: 0; }
            .close-menu { display: block; }
            .nav-tab {
                color: var(--text-bright); border-bottom: 1px solid rgba(255,255,255,0.07);
                border-radius: 0; margin: 0; padding: 13px 2px; display: block;
            }
            .nav-tab.active { border-bottom-color: rgba(255,255,255,0.07); background: rgba(255,71,87,0.12); color: var(--primary); }
            .nav-links .nav-action,
            .nav-links .discord-btn { display: flex; width: 100%; margin-top: 12px; box-sizing: border-box; justify-content: center; }
            .nav-links .discord-btn { height: 42px; align-items: center; gap: 8px; padding: 0; }
            .mobile-overlay.active { display: block; }
            body { padding-top: 58px; }
        }

        .hero-section {
            height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .main-logo { width: 120px; height: 120px; border-radius: 3px; border: 3px solid var(--primary); margin-bottom: 15px; box-shadow: 0 0 15px rgba(255,71,87,0.3); object-fit: cover; }
        .main-title { font-size: 2.8em; margin: 0; color: white; text-shadow: 2px 2px 12px rgba(0,0,0,0.9); font-weight: 800; }
        .main-slogan { font-size: 1.3em; font-weight: bold; margin-top: 10px; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }

        .content-area { padding: 18px 8px 40px; }
        #search-results-count { color: #8a8a90; font-size: 0.78em; margin: 0; }
        .discord-footer-link { display: inline-flex; align-items: center; padding: 0; background: #5865F2; border-radius: 2px; overflow: hidden; height: 30px; }
        .discord-footer-link img { height: 100%; width: auto; display: block; object-fit: contain; }
        .voir-tout-wrap { display: none; }

        /* Bloc de section : cadre net, titre en bandeau, comme les panneaux MAL */
        .section-block {
            max-width: 1400px; margin: 26px auto 0;
            background: rgba(14,14,16,0.82);
            border: 1px solid #2c2c31;
            border-radius: 2px;
        }
        .section-title-wrapper {
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
            padding: 9px 14px;
            background: rgba(255,255,255,0.035);
            border-bottom: 1px solid #2c2c31;
        }
        .section-title {
            margin: 0; padding: 0;
            font-size: 1.02em; font-weight: 700;
            color: var(--text-bright);
            text-transform: uppercase; letter-spacing: 0.8px;
            border-left: 3px solid var(--primary); padding-left: 9px;
            line-height: 1.2;
        }
        .section-body { padding: 14px 4px 16px; }

        .tag-section-box {
            background: rgba(255,255,255,0.03); border: none;
            border-bottom: 1px solid #2c2c31;
            border-radius: 0;
            padding: 11px 14px; margin-bottom: 0;
            display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
        }
        .tag-section-box .tag-pill-main {
            padding: 5px 13px; background: var(--primary); border: 1px solid var(--primary);
            border-radius: 2px; color: white; cursor: pointer; font-size: 0.82em;
            font-weight: bold; transition: 0.2s; text-decoration: none;
        }
        .tag-section-box .tag-pill-main:hover { background: #e0313f; }
        .tag-section-box .tag-description {
            color: #ddd; font-size: 0.85em; line-height: 1.5; flex: 1; min-width: 200px;
        }
        .tag-section-box .tag-label {
            font-size: 0.7em; color: var(--primary); font-weight: bold; text-transform: uppercase;
            margin-right: 5px;
        }

        /* ========== CARROUSELS (scroll natif, largeur adaptative) ========== */
        .carousel-wrapper {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }
        .carousel-container {
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-x pan-y;
            overscroll-behavior-x: contain;
        }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-track {
            display: flex;
            gap: var(--gap, 10px);
            width: max-content;
            padding: 2px 0 4px;
        }
        .carousel-track .card { scroll-snap-align: start; }

        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: #17171a; border: 1px solid #3a3a3f; color: #ddd;
            font-size: 1.5em; width: 30px; height: 60px; line-height: 1;
            border-radius: 2px; cursor: pointer; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s, opacity 0.2s;
            padding: 0;
        }
        .carousel-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .carousel-btn[disabled] { opacity: 0.22; cursor: default; }
        .carousel-btn[disabled]:hover { background: #17171a; color: #ddd; border-color: #3a3a3f; }
        .carousel-prev { left: 2px; }
        .carousel-next { right: 2px; }

        /* Les flèches restent visibles sur mobile, simplement plus compactes */
        @media (max-width: 1000px) {
            .carousel-wrapper { padding: 0 26px; }
            .carousel-btn { width: 22px; height: 48px; font-size: 1.2em; }
            .carousel-prev { left: 0; }
            .carousel-next { right: 0; }
            .hero-section { height: 45vh; }
            .main-title { font-size: 2em; }
            .section-title { font-size: 0.95em; }
        }
        @media (max-width: 480px) {
            .carousel-wrapper { padding: 0 22px; }
            .carousel-btn { width: 20px; height: 44px; }
        }
        /* ========== FIN CARROUSELS ========== */

        .card {
            background: var(--card-bg); border-radius: 2px; overflow: hidden; transition: 0.2s;
            border: 1px solid #333; text-decoration: none; color: inherit; font-size: 0.8em;
            display: flex; flex-direction: column; flex-shrink: 0;
            width: var(--card-w, 160px);
        }
        .card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .card .img-container { width: 100%; aspect-ratio: 2/3; background: #111; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 7px 8px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 4px; height: 2.4em; overflow: hidden; font-size: 1.05em; line-height: 1.2; }
        .card-title .highlight { background: var(--primary); color: white; padding: 0 2px; border-radius: 1px; }
        .card-meta-row { display: flex; flex-wrap: wrap; gap: 4px; font-size: 0.72em; color: #ddd; margin-top: 2px; }
        .meta-badge {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1px; padding: 1px 5px; color: #ccc;
        }
        .meta-editeur { color: #999; font-style: normal; }
        .mal-score { color: #ffc94d; font-weight: 600; }

        #search-results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(104px, 14vw, 165px), 1fr));
            gap: 10px; max-width: 1400px; margin: 0 auto; padding: 0 8px;
        }
        #search-results-grid .card { width: auto; }
        #search-results-count { color: #aaa; margin: 5px 15px; font-size: 0.9em; }
        .anime-count { text-align: center; padding: 12px 20px; color: var(--primary); font-size: 1em; font-weight: bold; background: rgba(0, 0, 0, 0.75); display: inline-block; border-radius: 2px; }
        .anime-count-wrapper { text-align: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 30px; margin-top: 40px; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .discord-footer-link { background: #5865F2; color: white; text-decoration: none; padding: 8px 18px; border-radius: 30px; font-size: 0.9em; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }
        
        .voir-tout-wrap { max-width: 1400px; margin: 6px auto 0; padding: 0 44px; display: flex; justify-content: flex-end; }
        .voir-tout-btn { background: transparent; border: 1px solid rgba(255,71,87,0.5); color: #ff6b7a; padding: 3px 11px; border-radius: 2px; font-size: 0.75em; font-weight: bold; text-decoration: none; transition: 0.2s; }
        .voir-tout-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    
        /* ── Images lisses ── */
        img {
            image-rendering: auto;
        }
        
        /* ── Zoom 80% ── */
        html {
            zoom: 0.8;
        }
        body {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        
        #search-results-grid {
            grid-template-columns: repeat(auto-fill, minmax(clamp(104px, 14vw, 165px), 1fr)) !important;
        }
    </style>
</head>

    <script>
    /* ═══════════ THÈME D'AFFICHAGE (autonome, sans dépendance réseau) ═══════════
       localStorage donne l'effet immédiat ; Firestore le rétablit à la reconnexion
       même après un effacement du cache. */
    (function () {
        function readTheme() {
            try { return localStorage.getItem('theme-fond') === 'gris' ? 'gris' : 'sombre'; }
            catch (e) { return 'sombre'; }
        }

        window.applyTheme = function (theme) {
            const gris = theme === 'gris';
            if (gris) document.documentElement.setAttribute('data-theme', 'gris');
            else document.documentElement.removeAttribute('data-theme');
            document.querySelectorAll('.theme-label').forEach(function (el) {
                el.textContent = el.closest('#menu')
                    ? ('Fond : ' + (gris ? 'gris' : 'sombre'))
                    : (gris ? 'Gris' : 'Sombre');
            });
        };

        window.getTheme = readTheme;

        window.setTheme = function (theme, push) {
            window.applyTheme(theme);
            try { localStorage.setItem('theme-fond', theme); } catch (e) {}
            if (push && window.__syncTheme) window.__syncTheme(theme);
        };

        window.toggleTheme = function () {
            window.setTheme(readTheme() === 'gris' ? 'sombre' : 'gris', true);
        };

        function init() { window.applyTheme(readTheme()); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCD70a-QR2nJnHBnA-FUoIGHZ7Z3VByPMk", authDomain: "le-malicieux-v2.firebaseapp.com", projectId: "le-malicieux-v2", storageBucket: "le-malicieux-v2.firebasestorage.app", messagingSenderId: "938147445933", appId: "1:938147445933:web:86f9c65ee0737e66a9da24" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        let allAnimes = [];
        let allTags = [];
        let currentSearchQuery = '';

        const MAL_TTL = 60 * 60 * 1000;
        function malCacheGet(nom) { try { const raw = sessionStorage.getItem('mal_cache_' + nom); if (!raw) return null; const obj = JSON.parse(raw); if (Date.now() - obj.ts > MAL_TTL) { sessionStorage.removeItem('mal_cache_' + nom); return null; } return obj; } catch { return null; } }
        function malCacheSet(nom, data) { try { sessionStorage.setItem('mal_cache_' + nom, JSON.stringify({ ...data, ts: Date.now() })); } catch {} }

        let jikanQueue = [], jikanRunning = false;
        function jikanEnqueue(task) { jikanQueue.push(task); if (!jikanRunning) jikanDrain(); }
        async function jikanDrain() { jikanRunning = true; while (jikanQueue.length > 0) { const task = jikanQueue.shift(); await task(); await new Promise(r => setTimeout(r, 400)); } jikanRunning = false; }

        function fetchMALForCard(nom, malId, scoreEl, popEl) {
            const cached = malCacheGet(nom);
            if (cached) { applyCardMAL(scoreEl, popEl, cached); return; }
            jikanEnqueue(async () => {
                try {
                    let item = null;
                    if (malId && malId.trim() !== '') {
                        const resp = await fetch(`https://api.jikan.moe/v4/anime/${malId.trim()}`);
                        if (resp.ok) { const j = await resp.json(); item = j.data || null; }
                    } else {
                        const q = nom.split('/')[0].trim();
                        const resp = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=1&sfw=false`);
                        if (resp.ok) { const j = await resp.json(); item = j.data?.[0] || null; }
                    }
                    if (item) { const data = { score: item.score, popularity: item.popularity }; malCacheSet(nom, data); applyCardMAL(scoreEl, popEl, data); }
                } catch(e) {}
            });
        }
        function applyCardMAL(scoreEl, popEl, data) {
            if (!scoreEl || !popEl) return;
            if (data.score != null) { scoreEl.textContent = '\u2605 ' + parseFloat(data.score).toFixed(2); scoreEl.classList.add('mal-updated'); }
            if (data.popularity != null) { popEl.textContent = 'Pop. #' + data.popularity.toLocaleString('fr-FR'); popEl.classList.add('mal-updated'); }
        }

        const cardObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const nom = card.dataset.nom;
                    const malId = card.dataset.malid || '';
                    const scoreEl = card.querySelector('.mal-score');
                    const popEl = card.querySelector('.mal-pop');
                    if (nom && scoreEl && popEl) { fetchMALForCard(nom, malId, scoreEl, popEl); }
                    cardObserver.unobserve(card);
                }
            });
        }, { rootMargin: '200px' });

        let currentUser = null;

        // Synchronisation du thème vers le compte (la logique d'affichage est autonome, plus haut)
        window.__syncTheme = async (theme) => {
            if (!currentUser) return;
            try { await setDoc(doc(db, "users", currentUser.uid), { themeFond: theme }, { merge: true }); }
            catch (e) { console.warn('Thème non synchronisé :', e); }
        };

        onAuthStateChanged(auth, async (user) => {
            const authUi = document.getElementById('auth-ui');
            if (user) {
                currentUser = user;
                await setDoc(doc(db, "users", user.uid), { uid: user.uid, email: user.email, displayName: user.displayName || '', photoURL: user.photoURL || '', lastSeen: new Date().toISOString() }, { merge: true });
                // Le thème enregistré sur le compte fait foi (survit à l'effacement du cache)
                try {
                    const tSnap = await getDoc(doc(db, "users", user.uid));
                    if (tSnap.exists() && tSnap.data().themeFond) {
                        window.applyTheme(tSnap.data().themeFond);
                        try { localStorage.setItem('theme-fond', tSnap.data().themeFond); } catch (e) {}
                    } else {
                        await setDoc(doc(db, "users", user.uid), { themeFond: window.getTheme() }, { merge: true });
                    }
                } catch (e) { console.warn('Thème non récupéré :', e); }
                const cachedPseudo = sessionStorage.getItem('userPseudo');
                let displayName = cachedPseudo || user.displayName;
                if (!cachedPseudo) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists() && uSnap.data().pseudo) { displayName = uSnap.data().pseudo; sessionStorage.setItem('userPseudo', displayName); }
                    if (uSnap.exists() && uSnap.data().photoURL) { sessionStorage.setItem('userAvatar', uSnap.data().photoURL); }
                }
                const avatarUrl = sessionStorage.getItem('userAvatar') || user.photoURL || 'img/logo.jpg';
                authUi.innerHTML = `<a href="profil.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;"><img src="${avatarUrl}" style="width:28px;height:28px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;" onerror="this.src='img/logo.jpg'"><span style="color:white;font-size:0.8em;">${displayName}</span></a><button id="logout-btn" style="background:#333; color:white; border:none; cursor:pointer; padding:5px 8px; border-radius:5px; font-size:0.75em;">Quitter</button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth);
            } else {
                currentUser = null;
                authUi.innerHTML = `<button id="login-btn" style="background:#5865F2; border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.8em;">Connexion</button>`;
                document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
            }
        });

        function normalize(str) {
            return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[-_.:;,!?()'"&~#|\[\]\/]/g, ' ').replace(/\s+/g, ' ').trim();
        }
        // Version sans espaces : "shingeki no kyojin" == "shingekinokyojin"
        function squash(str) { return normalize(str).replace(/ /g, ''); }

        // Distance de Levenshtein bornée (tolérance aux fautes de frappe)
        function editDistance(a, b, max) {
            if (Math.abs(a.length - b.length) > max) return max + 1;
            let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
            for (let i = 1; i <= a.length; i++) {
                const cur = [i];
                let best = i;
                for (let j = 1; j <= b.length; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
                    if (cur[j] < best) best = cur[j];
                }
                if (best > max) return max + 1;
                prev = cur;
            }
            return prev[b.length];
        }

        // Tous les caractères de la requête apparaissent dans l'ordre ? ("snk" -> "ShiNgeki no Kyojin")
        function isSubsequence(q, t) {
            let i = 0;
            for (let j = 0; j < t.length && i < q.length; j++) if (t[j] === q[i]) i++;
            return i === q.length;
        }

        // Score de pertinence : plus haut = meilleur. null = pas de correspondance.
        function matchScore(title, query) {
            const t = normalize(title), q = normalize(query);
            if (!q) return null;
            const ts = squash(t), qs = squash(q);
            if (t === q) return 1000;
            if (t.startsWith(q)) return 900 - t.length * 0.1;
            if (ts.startsWith(qs)) return 850 - ts.length * 0.1;

            const words = t.split(' ');
            if (words.some(w => w.startsWith(q))) return 800 - t.length * 0.1;
            if (t.includes(q)) return 700 - t.indexOf(q) - t.length * 0.05;
            if (ts.includes(qs)) return 650 - ts.length * 0.05;

            // Tous les mots de la requête présents, ordre libre : "titan attaque" -> "L'Attaque des Titans"
            const qWords = q.split(' ').filter(Boolean);
            if (qWords.length > 1 && qWords.every(qw => words.some(w => w.includes(qw)))) return 600;

            // Initiales / acronyme : "snk", "fmab"
            const initials = words.map(w => w[0]).join('');
            if (qs.length >= 2 && initials.startsWith(qs)) return 560;

            // Tolérance aux fautes de frappe, mot par mot
            if (qs.length >= 4) {
                const tol = qs.length <= 6 ? 1 : 2;
                for (const w of words) {
                    if (Math.abs(w.length - q.length) <= tol && editDistance(w, q, tol) <= tol) return 500;
                }
                if (Math.abs(ts.length - qs.length) <= tol && editDistance(ts, qs, tol) <= tol) return 480;
            }

            // Sous-séquence (lettres dans l'ordre) en dernier recours
            if (qs.length >= 3 && isSubsequence(qs, ts)) return 300 - ts.length * 0.05;
            return null;
        }

        function searchAnimes(query, limit) {
            const scored = [];
            for (const a of allAnimes) {
                let s = matchScore(a.nom, query);
                // On cherche aussi dans les titres alternatifs / studio si présents
                if (s === null && a.alt) { const alt = matchScore(a.alt, query); if (alt !== null) s = alt - 60; }
                if (s !== null) scored.push({ a, s });
            }
            scored.sort((x, y) => y.s - x.s || x.a.nom.localeCompare(y.a.nom, 'fr'));
            const out = scored.map(x => x.a);
            return limit ? out.slice(0, limit) : out;
        }

        function highlightTitle(title, query) {
            if (!query) return title;
            const normTitle = normalize(title);
            const normQuery = normalize(query);
            const index = normTitle.indexOf(normQuery);
            if (index === -1) return title;
            let charCount = 0, origIndex = -1;
            for (let i = 0; i < title.length; i++) {
                if (normalize(title[i]).length > 0) charCount++;
                if (charCount > index && origIndex === -1) origIndex = i;
            }
            if (origIndex === -1) return title;
            const endIndex = origIndex + query.length;
            return title.substring(0, origIndex) + '<span class="highlight">' + title.substring(origIndex, Math.min(endIndex, title.length)) + '</span>' + title.substring(Math.min(endIndex, title.length));
        }

        function createCardHTML(a, highlight = false, query = '') {
            const titleHtml = highlight ? highlightTitle(a.nom, query) : a.nom;
            return `<a href="video.html?name=${encodeURIComponent(a.nom)}" class="card" data-nom="${a.nom.replace(/"/g,'&quot;')}" data-malid="${a.malId||''}">
                <div class="img-container"><img src="img/${a.img}" loading="lazy" onerror="handleImgError(this, '${a.img}')"></div>
                <div class="card-info">
                    <div class="card-title">${titleHtml}</div>
                    <div class="card-meta-row"><span>${(a.sortie||'').match(/\d{4}/g)?.pop()||a.sortie}</span><span class="mal-score">\u2605 ${a.score}</span><span class="mal-pop">${a.pop}</span></div>
                    <div class="card-meta-row"><span class="meta-badge">${a.ep} ép.</span><span class="meta-badge">${a.censure}</span><span class="meta-badge">${a.etat}</span></div>
                    ${a.editeur ? `<div class="card-meta-row"><span class="meta-editeur" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.editeur}</span></div>` : ''}
                </div>
            </a>`;
        }

        /* Nombre de fiches visibles calculé depuis la largeur réelle du conteneur.
           Plus la fenêtre est large (ou plus on dézoome), plus il y a de fiches. */
        const CARD_TARGET = 170;   // largeur idéale d'une fiche en px CSS
        const CARD_MIN    = 104;   // en dessous, on retire une colonne
        const CARD_MAX    = 205;   // au dessus, on en ajoute une
        const CARD_GAP    = 10;

        function cardWidthFor(avail, n) { return (avail - (n - 1) * CARD_GAP) / n; }

        function layoutCarousel(container, track) {
            const avail = container.clientWidth;
            if (!avail) return;
            let n = Math.max(1, Math.round((avail + CARD_GAP) / (CARD_TARGET + CARD_GAP)));
            // On garde des fiches lisibles : ni trop étroites, ni démesurées
            while (n > 1 && cardWidthFor(avail, n) < CARD_MIN) n--;
            while (cardWidthFor(avail, n) > CARD_MAX) n++;
            const w = Math.floor(cardWidthFor(avail, n));
            track.style.setProperty('--card-w', w + 'px');
            track.style.setProperty('--gap', CARD_GAP + 'px');
            track._perView = n;
        }

        function buildCarousel(trackId, animeList) {
            const track = document.getElementById(trackId);
            if (!track) return;
            if (animeList.length === 0) { track.innerHTML = '<p style="color:#ff6b7a;padding:20px;">Aucun anime.</p>'; return; }
            track.innerHTML = animeList.map(a => createCardHTML(a)).join('');
            track.querySelectorAll('.card[data-nom]').forEach(c => cardObserver.observe(c));

            const container = track.closest('.carousel-container');
            const wrapper = track.closest('.carousel-wrapper');
            if (!container || !wrapper) return;

            const prevBtn = wrapper.querySelector('.carousel-prev');
            const nextBtn = wrapper.querySelector('.carousel-next');

            function step() {
                const card = track.querySelector('.card');
                const cardW = card ? card.getBoundingClientRect().width + CARD_GAP : CARD_TARGET + CARD_GAP;
                const n = track._perView || 1;
                // On avance d'une page entière, en laissant une fiche de repère si possible
                return cardW * Math.max(1, n > 2 ? n - 1 : n);
            }

            function refreshButtons() {
                if (!prevBtn || !nextBtn) return;
                const max = container.scrollWidth - container.clientWidth;
                const noScroll = max <= 2;
                prevBtn.disabled = noScroll || container.scrollLeft <= 2;
                nextBtn.disabled = noScroll || container.scrollLeft >= max - 2;
            }

            function relayout() {
                layoutCarousel(container, track);
                refreshButtons();
            }

            if (prevBtn) prevBtn.onclick = () => container.scrollBy({ left: -step(), behavior: 'smooth' });
            if (nextBtn) nextBtn.onclick = () => container.scrollBy({ left: step(), behavior: 'smooth' });

            container.addEventListener('scroll', () => {
                clearTimeout(container._sT);
                container._sT = setTimeout(refreshButtons, 60);
            }, { passive: true });

            // ResizeObserver suit aussi les changements de zoom, pas seulement le resize fenêtre
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    clearTimeout(container._rT);
                    container._rT = setTimeout(relayout, 80);
                });
                ro.observe(container);
            } else {
                window.addEventListener('resize', () => {
                    clearTimeout(container._rT);
                    container._rT = setTimeout(relayout, 150);
                });
            }

            relayout();
            track.querySelectorAll('img').forEach(img => img.addEventListener('load', refreshButtons, { once: true }));
        }

        function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

        function showSearchResults(query) {
            currentSearchQuery = query;
            const results = searchAnimes(query);
            const mainContent = document.getElementById('main-content');
            const resultsSection = document.getElementById('search-results-section');
            const resultsGrid = document.getElementById('search-results-grid');
            const resultsTitle = document.getElementById('search-results-title');
            const resultsCount = document.getElementById('search-results-count');
            const backHome = document.getElementById('back-home');
            mainContent.style.display = 'none';
            resultsSection.style.display = 'block';
            resultsTitle.textContent = query;
            resultsCount.textContent = results.length + ' anime' + (results.length > 1 ? 's' : '') + ' trouvé' + (results.length > 1 ? 's' : '');
            if (results.length === 0) {
                resultsGrid.innerHTML = '<p style="color:#ff6b7a;text-align:center;padding:40px;">Aucun anime trouvé pour "' + query + '"</p>';
            } else if (results.length === 1) {
                window.location.href = 'video.html?name=' + encodeURIComponent(results[0].nom);
                return;
            } else {
                resultsGrid.innerHTML = results.map(a => createCardHTML(a, true, query)).join('');
                resultsGrid.querySelectorAll('.card[data-nom]').forEach(c => cardObserver.observe(c));
            }
            backHome.style.display = 'block';
            window.scrollTo({ top: resultsSection.offsetTop - 80, behavior: 'smooth' });
            history.pushState({}, '', `?search=${encodeURIComponent(query)}`);
        }

        function resetToHome() {
            document.getElementById('search').value = '';
            currentSearchQuery = '';
            sessionStorage.removeItem('indexSearch');
            document.getElementById('search-results-section').style.display = 'none';
            document.getElementById('main-content').style.display = '';
            document.getElementById('back-home').style.display = 'none';
            history.replaceState(null, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.resetToHome = resetToHome;

        window.handleImgError = function(img, fileNameFromCSV) {
            if (!img.dataset.attempt) img.dataset.attempt = "1";
            const lastDotIndex = fileNameFromCSV.lastIndexOf('.');
            const base = lastDotIndex !== -1 ? fileNameFromCSV.substring(0, lastDotIndex) : fileNameFromCSV;
            if (img.dataset.attempt === "1") { img.dataset.attempt = "2"; img.src = `img/${base}.webp`; }
            else if (img.dataset.attempt === "2") { img.dataset.attempt = "3"; img.src = `img/${base}.png`; }
            else if (img.dataset.attempt === "3") { img.dataset.attempt = "4"; img.src = `img/${base}.jpg`; }
            else { img.onerror = null; img.src = 'img/logo.jpg'; }
        };

        async function setBackground() {
            const isMobile = window.innerWidth <= 1000;
            try {
                const res = await fetch('backgrounds.json');
                const data = await res.json();
                const list = isMobile ? data.mobile : data.desktop;
                if (!list || !list.length) return;
                const file = list[Math.floor(Math.random() * list.length)];
                document.getElementById('bg-layer').style.backgroundImage = `url('img/${file}')`;
            } catch(e) {}
        }

        function updateOverlayOpacity() {
            const scrollY = window.scrollY;
            const maxScroll = document.body.scrollHeight - window.innerHeight || 1;
            const opacity = Math.min(scrollY / 600, 0.65);
            document.getElementById('bg-overlay').style.opacity = opacity;
        }

        async function init() {
            setBackground();
            window.addEventListener('scroll', updateOverlayOpacity);
            window.addEventListener('resize', () => {
                const bgLayer = document.getElementById('bg-layer');
                if (bgLayer && !bgLayer.style.backgroundImage) setBackground();
            });
            try {
                const resp = await fetch('animes.csv');
                const raw = await resp.text();
                const lines = raw.split(/\r?\n/);
                const headers = lines[0].split(';').map(h => h.trim().toLowerCase());
                const ordreAjoutIndex = headers.indexOf('ordre_ajout');
                allAnimes = lines.slice(1).map(line => {
                    const c = line.split(';');
                    if (!c[0] || c.length < 9) return null;
                    const clean = (s) => s ? s.trim().replace(/^"|"$/g, '') : "";
                    let ordreAjout = 0;
                    if (ordreAjoutIndex >= 0 && ordreAjoutIndex < c.length) ordreAjout = parseInt(clean(c[ordreAjoutIndex])) || 0;
                    return {
                        nom: clean(c[0]), pop: clean(c[1]), score: clean(c[2]),
                        sortie: clean(c[3]), ep: clean(c[4]), censure: clean(c[5]),
                        etat: clean(c[6]), img: clean(c[8]), tags: clean(c[12]),
                        malId: clean(c[13]), editeur: clean(c[14]), ordreAjout
                    };
                }).filter(a => a !== null);
                try {
                    const tr = await fetch('tags_description.csv');
                    const trRaw = await tr.text();
                    allTags = trRaw.split(/\r?\n/).slice(1).map(line => {
                        const c = line.split(';');
                        if (!c[0]) return null;
                        return { nom: c[0].trim(), description: (c[1]||'').trim() };
                    }).filter(t => t !== null);
                } catch(e) { allTags = []; }
                buildCarousel('carousel-random-track', shuffle(allAnimes).slice(0, 20));
                const recents = [...allAnimes].filter(a => a.ordreAjout > 0).sort((a,b) => b.ordreAjout - a.ordreAjout).slice(0, 20);
                buildCarousel('carousel-recent-track', recents);
                if (allTags.length > 0) {
                    const rTag = allTags[Math.floor(Math.random() * allTags.length)];
                    document.getElementById('tag-pill-link').textContent = rTag.nom;
                    document.getElementById('tag-pill-link').href = `tags.html?tag=${encodeURIComponent(rTag.nom)}`;
                    const _vtt = document.getElementById('voir-tout-tag-btn');
                    if (_vtt) _vtt.href = 'tags.html?tags=' + encodeURIComponent(rTag.nom);
                    document.getElementById('tag-description-text').textContent = rTag.description || 'Découvrez les animes associés à ce tag.';
                    const tagAnimes = allAnimes.filter(a => a.tags && a.tags.toLowerCase().includes(rTag.nom.toLowerCase()));
                    buildCarousel('carousel-tag-track', shuffle(tagAnimes).slice(0, 20));
                } else {
                    document.getElementById('tag-pill-link').textContent = 'Tags indisponibles';
                    document.getElementById('tag-description-text').textContent = 'Chargement des tags...';
                }
                document.getElementById('anime-count').innerHTML = '<span class="count-number">' + allAnimes.length + '</span> animes dans le catalogue';
                const urlParams = new URLSearchParams(window.location.search);
                const searchParam = urlParams.get('search');
                if (searchParam) {
                    document.getElementById('search').value = searchParam;
                    showSearchResults(searchParam);
                } else {
                    const savedSearch = sessionStorage.getItem('indexSearch');
                    if (savedSearch) document.getElementById('search').value = savedSearch;
                }
            } catch(e) { console.error(e); }
        }

        const searchInput = document.getElementById('search');
        const searchSuggestions = document.getElementById('search-suggestions');
        let hlIndex = -1;

        function renderSuggestions(val) {
            if (val.length < 1) { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
            const results = searchAnimes(val, 8);
            hlIndex = -1;
            if (results.length === 0) {
                searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat pour « ' + val + ' »</div>';
            } else {
                searchSuggestions.innerHTML = results.map(a => {
                    const year = (a.sortie || '').match(/\d{4}/g)?.pop() || '';
                    const meta = [year, a.ep ? a.ep + ' ép.' : ''].filter(Boolean).join(' · ');
                    return '<div class="suggestion-item" data-name="' + a.nom.replace(/"/g, '&quot;') + '">'
                        + '<img src="img/' + a.img + '" class="sugg-img" loading="lazy" onerror="this.src=\'img/logo.jpg\'">'
                        + '<span><span class="sugg-title">' + highlightTitle(a.nom, val) + '</span>'
                        + (meta ? '<span class="sugg-meta">' + meta + '</span>' : '') + '</span></div>';
                }).join('');
            }
            searchSuggestions.classList.add('active');
        }

        let suggTimer;
        searchInput.addEventListener('input', function() {
            const val = this.value.trim();
            clearTimeout(suggTimer);
            suggTimer = setTimeout(() => renderSuggestions(val), 90);
        });
        searchInput.addEventListener('focus', function() {
            const val = this.value.trim();
            if (val) renderSuggestions(val);
        });

        function moveHighlight(delta) {
            const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
            if (!items.length) return;
            if (hlIndex >= 0) items[hlIndex].classList.remove('hl');
            hlIndex = (hlIndex + delta + items.length) % items.length;
            items[hlIndex].classList.add('hl');
            items[hlIndex].scrollIntoView({ block: 'nearest' });
        }

        searchInput.addEventListener('keydown', function(e) {
            const open = searchSuggestions.classList.contains('active');
            if (e.key === 'ArrowDown' && open) { e.preventDefault(); moveHighlight(1); return; }
            if (e.key === 'ArrowUp' && open) { e.preventDefault(); moveHighlight(-1); return; }
            if (e.key === 'Escape') { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
            if (e.key === 'Enter') {
                e.preventDefault();
                const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
                if (open && hlIndex >= 0 && items[hlIndex]) {
                    window.location.href = 'video.html?name=' + encodeURIComponent(items[hlIndex].dataset.name);
                    return;
                }
                const val = this.value.trim();
                if (val) showSearchResults(val);
                searchSuggestions.classList.remove('active');
                this.blur();
            }
        });

        searchSuggestions.addEventListener('click', function(e) {
            const item = e.target.closest('.suggestion-item');
            if (item && item.dataset.name) window.location.href = 'video.html?name=' + encodeURIComponent(item.dataset.name);
        });
        document.addEventListener('click', function(e) { if (!e.target.closest('.search-wrapper')) { searchSuggestions.classList.remove('active'); hlIndex = -1; } });

        window.randomAnime = () => { if(allAnimes.length) { const a = allAnimes[Math.floor(Math.random()*allAnimes.length)]; window.location.href = 'video.html?name='+encodeURIComponent(a.nom); } };
        window.toggleM = () => { const menu = document.getElementById('menu'); const overlay = document.getElementById('overlay'); const isOpen = menu.classList.toggle('active'); overlay.classList.toggle('active'); document.body.style.overflow = isOpen ? 'hidden' : ''; };

        (function markActiveTab() {
            const current = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-tab').forEach(tab => {
                if (tab.dataset.page === current) tab.classList.add('active');
            });
        })();

        init();
    </script>
</body>
</html>
