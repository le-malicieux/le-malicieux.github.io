<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Tags - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; overflow-x: hidden; padding-top: 62px; }
        .page-wrap { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 100px) 60px; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .page-title { font-size: 1.6em; font-weight: 900; color: var(--primary); margin: 0; }
        .sort-select { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.85em; cursor: pointer; outline: none; }

        /* Recherche de tags */
        .search-tag-wrap { position: relative; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .search-tag-wrap input { width: 100%; background: #1c1c1f; border: 1px solid #38383d; color: white; padding: 10px 34px 10px 14px; border-radius: 8px; font-size: 0.95em; box-sizing: border-box; outline: none; transition: border-color 0.15s; }
        .search-tag-wrap input:focus { border-color: var(--primary); background: #202024; }
        .search-tag-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        .search-tag-icon svg { width: 16px; height: 16px; stroke: #8a8a90; }

        /* Grille de Tags */
        .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        .tag-pill { background: rgba(255,255,255,0.05); border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; cursor: pointer; transition: 0.2s; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
        .tag-pill:hover { border-color: #666; background: rgba(255,255,255,0.1); }
        .tag-pill.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 10px rgba(255,71,87,0.4); }
        .tag-pill .tag-count { background: rgba(0,0,0,0.2); font-size: 0.75em; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* Bouton clear */
        .btn-clear { background: transparent; border: 1px solid #666; color: #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; display: none; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-clear:hover { background: #333; color: white; }
        .btn-clear.visible { display: inline-flex; }

        /* Grille d'animés */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .anime-card { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; transition: 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .anime-card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .anime-card .img-wrap { width: 100%; aspect-ratio: 2/3; background: #111; position: relative; }
        .anime-card img { width: 100%; height: 100%; object-fit: cover; }
        .ac-info { padding: 7px; flex: 1; }
        .ac-title { font-weight: 700; color: var(--primary); font-size: 0.88em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
        .score-badge { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.72); color: #f1c40f; font-size: 0.7em; padding: 2px 5px; border-radius: 4px; }
        
        .empty-state { text-align: center; color: #555; padding: 40px 20px; grid-column: 1/-1; }
        .section-sep { display: flex; align-items: center; gap: 12px; margin: 30px 0 15px 0; }
        .section-sep-line { flex: 1; height: 1px; background: rgba(255,71,87,0.25); }
        .section-sep-label { font-size: 0.85em; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }

        @media (max-width: 700px) {
            .anime-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
            .search-tag-wrap { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    
    <header class="site-header">
        <div class="navbar">
            <div class="nav-left">
                <button class="burger" onclick="toggleM()" aria-label="Ouvrir le menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <a class="nav-brand" href="index.html">
                    <img src="img/bannieres_icones/logo.jpg" class="nav-logo-small" alt="Logo Le Malicieux">
                    <span class="nav-title">LE MALICIEUX</span>
                </a>
            </div>
            <div class="mobile-overlay" id="overlay" onclick="toggleM()"></div>
            <nav class="nav-links" id="menu">
                <div class="close-menu" onclick="toggleM()">Fermer</div>
                <div class="menu-account js-hidden" id="menu-account-wrap">
                    <a href="profil.html" id="nav-profil-link-mobile" class="auth-account" style="text-decoration:none;">
                        <img id="nav-avatar-mobile" src="img/bannieres_icones/logo.jpg" class="auth-avatar" style="display:none;">
                        <span id="nav-pseudo-mobile" class="auth-name" style="display:none;"></span>
                    </a>
                </div>
                <a href="index.html" class="nav-tab" data-page="index.html">Accueil</a>
                <a href="tags.html" class="nav-tab active" data-page="tags.html">Tags</a>
                <a href="alphabetique.html" class="nav-tab" data-page="alphabetique.html">A-Z</a>
                <a href="playlist.html" class="nav-tab" data-page="playlist.html">Playlist</a>
                <a href="pls.html" class="nav-tab" data-page="pls.html">Industrie</a>
                <a href="profil.html" class="nav-tab" data-page="profil.html">Profil</a>
                <a href="index_old.html" class="nav-tab" data-page="index_old.html">Ancien Index</a>
                <button class="nav-action" onclick="randomAnime(window.__allAnimesForRandom)">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
            </nav>
            <div class="nav-right">
                <div class="search-wrapper" id="search-wrapper">
                    <input type="text" id="search" placeholder="Rechercher un anime..." autocomplete="off">
                    <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
                <button class="nav-action" onclick="randomAnime(window.__allAnimesForRandom)">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
                <a href="profil.html" id="nav-profil-link" class="auth-account" style="text-decoration:none;">
                    <img id="nav-avatar" src="img/bannieres_icones/logo.jpg" class="auth-avatar" style="display:none;">
                    <span id="nav-pseudo" class="auth-name" style="display:none;"></span>
                </a>
                <div id="auth-ui" class="auth-ui-slot"><button class="js-login-btn auth-login-btn">Connexion</button></div>
            </div>
        </div>
    </header>

    <div class="page-wrap">
        <div class="page-header">
            <h1 class="page-title">Recherche par Tags</h1>
            <button class="btn-clear" id="btn-clear">Effacer les filtres ✕</button>
        </div>
        
        <div class="search-tag-wrap">
            <input type="text" id="tag-search" placeholder="Rechercher un tag (ex: Harem, Rape...)" autocomplete="off">
            <span class="search-tag-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        </div>

        <div class="tags-grid" id="tags-grid"></div>

        <div id="results-section" style="display:none;">
            <div class="section-sep"><div class="section-sep-label" id="results-title">Résultats</div><div class="section-sep-line"></div></div>
            <div class="anime-grid" id="anime-grid"></div>
        </div>
    </div>

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, handleImgError, IMG_LOGO,
        searchAnimes, highlightTitle, getCurrentUser
    } from './common.js';

    initCommon();

    let allAnimes = [];
    let allTags = []; // { name: string, count: number }
    let activeTags = new Set();
    let tagSearchQuery = '';

    window.__allAnimesForRandom = allAnimes;

    async function init() {
        try {
            allAnimes = await loadAnimes();
            window.__allAnimesForRandom = allAnimes;
            
            buildTagsList();
            
            // Gestion de l'URL (ex: tags.html?tags=Harem,Action)
            const urlParams = new URLSearchParams(window.location.search);
            const tagsParam = urlParams.get('tags');
            if (tagsParam) {
                tagsParam.split(',').forEach(t => activeTags.add(t.trim()));
            }

            renderTags();
            renderResults();
            
            document.getElementById('tag-search').addEventListener('input', (e) => {
                tagSearchQuery = e.target.value.toLowerCase().trim();
                renderTags();
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                activeTags.clear();
                history.pushState({}, '', 'tags.html');
                renderTags();
                renderResults();
            });

            setupSearch();
        } catch (e) {
            console.error(e);
            document.getElementById('tags-grid').innerHTML = `<div class="empty-state" style="color:red;">Erreur de chargement des données.</div>`;
        }
    }

    function buildTagsList() {
        const tagMap = new Map();
        allAnimes.forEach(a => {
            if (!a.tags) return;
            a.tags.split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
                tagMap.set(t, (tagMap.get(t) || 0) + 1);
            });
        });

        allTags = Array.from(tagMap.entries()).map(([name, count]) => ({ name, count }));
        allTags.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)); // Tri par popularité
    }

    function renderTags() {
        const grid = document.getElementById('tags-grid');
        
        let filteredTags = allTags;
        if (tagSearchQuery) {
            filteredTags = allTags.filter(t => t.name.toLowerCase().includes(tagSearchQuery));
        }

        if (filteredTags.length === 0) {
            grid.innerHTML = '<div class="empty-state">Aucun tag trouvé.</div>';
            return;
        }

        grid.innerHTML = filteredTags.map(t => {
            const isActive = activeTags.has(t.name);
            return `<div class="tag-pill ${isActive ? 'active' : ''}" data-tag="${t.name.replace(/"/g, '&quot;')}">
                <span>${t.name}</span>
                <span class="tag-count">${t.count}</span>
            </div>`;
        }).join('');

        // Événements sur les tags
        grid.querySelectorAll('.tag-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                const tag = pill.dataset.tag;
                if (activeTags.has(tag)) activeTags.delete(tag);
                else activeTags.add(tag);
                
                // Mise à jour URL
                const newUrl = activeTags.size > 0 
                    ? `tags.html?tags=${Array.from(activeTags).map(encodeURIComponent).join(',')}`
                    : 'tags.html';
                history.pushState({}, '', newUrl);

                renderTags();
                renderResults();
            });
        });

        // Afficher ou cacher le bouton Clear
        document.getElementById('btn-clear').classList.toggle('visible', activeTags.size > 0);
    }

    function renderResults() {
        const section = document.getElementById('results-section');
        const grid = document.getElementById('anime-grid');
        const title = document.getElementById('results-title');

        if (activeTags.size === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        title.textContent = `Résultats pour : ${Array.from(activeTags).join(', ')}`;

        // Filtrer les animés qui possèdent TOUS les tags actifs
        const filteredAnimes = allAnimes.filter(a => {
            if (!a.tags) return false;
            const aTags = a.tags.split(',').map(t => t.trim());
            return Array.from(activeTags).every(t => aTags.includes(t));
        });

        // Trier par ordre d'ajout (récent)
        filteredAnimes.sort((a, b) => b.ordreAjout - a.ordreAjout);

        if (filteredAnimes.length === 0) {
            grid.innerHTML = '<div class="empty-state">Aucun anime ne correspond à cette combinaison de tags.</div>';
            return;
        }

        grid.innerHTML = filteredAnimes.map(a => {
            const cover = getCoverPath(a.ordreAjout, 1);
            const scoreNum = parseFloat(a.score.replace(',','.'));
            return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="anime-card">
                <div class="img-wrap"><img src="${cover}" loading="lazy" onerror="handleImgError(this,'${a.ordreAjout}-1.webp')">${scoreNum ? `<div class="score-badge">${a.score}</div>` : ''}</div>
                <div class="ac-info"><div class="ac-title">${a.nom}</div></div>
            </a>`;
        }).join('');
    }

    // ── RECHERCHE GLOBALE (Barre de navigation) ──
    function setupSearch() {
        const searchInput = document.getElementById('search');
        const searchSuggestions = document.getElementById('search-suggestions');
        if(!searchInput || !searchSuggestions) return;

        searchInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (val.length < 2) { searchSuggestions.classList.remove('active'); return; }
            const results = searchAnimes(val, allAnimes, 8);
            if (results.length === 0) searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
            else searchSuggestions.innerHTML = results.map(a => `<div class="suggestion-item" data-name="${a.nom.replace(/"/g, '&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${highlightTitle(a.nom, val)}</span></div>`).join('');
            searchSuggestions.classList.add('active');
        });
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = this.value.trim();
                if (val) window.location.href = 'index.html?search=' + encodeURIComponent(val);
                searchSuggestions.classList.remove('active');
                this.blur();
            }
        });
        searchSuggestions.addEventListener('click', function(e) {
            const item = e.target.closest('.suggestion-item');
            if (item && item.dataset.name) window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) searchSuggestions.classList.remove('active');
        });
    }

    init();
</script>
</body>
</html>
