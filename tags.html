        :root { --primary: #ff4757; --bg: #0f0f0f; --card-bg: rgba(20, 20, 20, 0.9); --text: #eee; --text-bright: #f5f5f5; }

        /* Le fond est dimensionné sur la PLUS GRANDE hauteur de viewport (100lvh) puis
           verrouillé en pixels par un script (voir plus bas) pour ne pas se redimensionner
           quand la barre d'URL mobile apparaît ou disparaît au défilement. */
        #bg-layer, #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100vw;
            height: 100vh; height: 100lvh;
            z-index: -2; pointer-events: none;
        }
        #bg-layer {
            background-size: cover; background-position: center center;
            background-repeat: no-repeat; transition: none;
        }
        #bg-overlay { z-index: -1; background: black; opacity: 0; transition: none; }

            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 62px;
        }
        /* ═══════════════ EN-TÊTE — barre unique ═══════════════ */
        .site-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: #121214;
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .navbar {
            display: flex; align-items: stretch; gap: 0;
            width: 100%; margin: 0; padding: 0 18px; box-sizing: border-box;
            height: 62px;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-right: 22px; }

        #back-home { font-size: 0.72em; color: #ff6b7a; text-decoration: none; display: none; cursor: pointer; margin-left: 4px; }

        .burger { display: none; background: none; border: none; padding: 4px; cursor: pointer; align-items: center; }
        .burger svg { width: 26px; height: 26px; stroke: var(--text-bright); }

<script>
    /* ═══════════ VERROUILLAGE DU FOND ═══════════
       Sur mobile, la barre d'URL qui se rétracte au défilement modifie la hauteur du
       viewport. Comme #bg-layer était en position fixe avec inset:0 et background-size:
       cover, l'image était remise à l'échelle à chaque variation, d'où l'effet de
       grossissement. On fige donc ses dimensions en pixels, et on ne les recalcule que
       si la LARGEUR change (rotation, redimensionnement réel), jamais sur la hauteur.
       Le calcul divise par le zoom CSS de <html>, sans quoi les px seraient réduits. */
    (function () {
        var lastW = null;

        function zoomFactor() {
            var z = parseFloat(getComputedStyle(document.documentElement).zoom);
            return (!z || isNaN(z)) ? 1 : z;
        }

        function lockBackground(force) {
            var layers = [document.getElementById('bg-layer'), document.getElementById('bg-overlay')];
            if (!layers[0]) return;
            var w = document.documentElement.clientWidth;
            if (!force && lastW !== null && Math.abs(w - lastW) < 2) return; // hauteur seule : on ignore
            lastW = w;

            var z = zoomFactor();
            // Hauteur de référence = la plus grande que le viewport puisse prendre
            var h = Math.max(
                window.innerHeight || 0,
                document.documentElement.clientHeight || 0,
                (window.screen && window.screen.height) || 0
            );
            layers.forEach(function (el) {
                if (!el) return;
                el.style.width = (w / z) + 'px';
                el.style.height = (h / z) + 'px';
            });
        }

        window.addEventListener('resize', function () { lockBackground(false); });
        window.addEventListener('orientationchange', function () { setTimeout(function () { lockBackground(true); }, 250); });

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { lockBackground(true); });
        else lockBackground(true);
    })();
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCD70a-QR2nJnHBnA-FUoIGHZ7Z3VByPMk", authDomain: "le-malicieux-v2.firebaseapp.com", projectId: "le-malicieux-v2", storageBucket: "le-malicieux-v2.firebasestorage.app", messagingSenderId: "938147445933", appId: "1:938147445933:web:86f9c65ee0737e66a9da24" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        document.addEventListener('click', (e) => {
            if (e.target.closest('.js-login-btn')) signInWithPopup(auth, provider);
            if (e.target.closest('.js-logout-btn')) signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            const slots = document.querySelectorAll('.auth-ui-slot');
            if (user) {
                currentUser = user;
                await setDoc(doc(db, "users", user.uid), { uid: user.uid, email: user.email, displayName: user.displayName || '', photoURL: user.photoURL || '', lastSeen: new Date().toISOString() }, { merge: true });
                const cachedPseudo = sessionStorage.getItem('userPseudo');
                let displayName = cachedPseudo || user.displayName;
                if (!cachedPseudo) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists() && uSnap.data().pseudo) { displayName = uSnap.data().pseudo; sessionStorage.setItem('userPseudo', displayName); }
                    if (uSnap.exists() && uSnap.data().photoURL) { sessionStorage.setItem('userAvatar', uSnap.data().photoURL); }
                }
                const avatarUrl = sessionStorage.getItem('userAvatar') || user.photoURL || 'img/logo.jpg';
                const html = `<a href="profil.html" class="auth-account"><img src="${avatarUrl}" class="auth-avatar" onerror="this.src=\'img/logo.jpg\'"><span class="auth-name">${displayName}</span></a><button class="js-logout-btn auth-logout-btn">Quitter</button>`;
                slots.forEach(el => el.innerHTML = html);
            } else {
                currentUser = null;
                const html = `<button class="js-login-btn auth-login-btn">Connexion</button>`;
                slots.forEach(el => el.innerHTML = html);
            }
        });
    </script>

            for (let i = 1; i <= a.length; i++) {
                const cur = [i];
                let best = i;
                for (let j = 1; j <= b.length; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
                    if (cur[j] < best) best = cur[j];
                }
                if (best > max) return max + 1;
                prev = cur;
            }
            return prev[b.length];
        }

        // Tous les caractères de la requête apparaissent dans l'ordre ? ("snk" -> "ShiNgeki no Kyojin")
        function isSubsequence(q, t) {
            let i = 0;
            for (let j = 0; j < t.length && i < q.length; j++) if (t[j] === q[i]) i++;
            return i === q.length;
        }

        // Score de pertinence : plus haut = meilleur. null = pas de correspondance.
        function matchScore(title, query) {
            const t = normalize(title), q = normalize(query);
            if (!q) return null;
            const ts = squash(t), qs = squash(q);
            if (t === q) return 1000;
            if (t.startsWith(q)) return 900 - t.length * 0.1;
            if (ts.startsWith(qs)) return 850 - ts.length * 0.1;

            const words = t.split(' ');
            if (words.some(w => w.startsWith(q))) return 800 - t.length * 0.1;
            if (t.includes(q)) return 700 - t.indexOf(q) - t.length * 0.05;
            if (ts.includes(qs)) return 650 - ts.length * 0.05;

            // Tous les mots de la requête présents, ordre libre : "titan attaque" -> "L'Attaque des Titans"
            const qWords = q.split(' ').filter(Boolean);
            if (qWords.length > 1 && qWords.every(qw => words.some(w => w.includes(qw)))) return 600;

            // Initiales / acronyme : "snk", "fmab"
            const initials = words.map(w => w[0]).join('');
            if (qs.length >= 2 && initials.startsWith(qs)) return 560;

            // Tolérance aux fautes de frappe, mot par mot
            if (qs.length >= 4) {
                const tol = qs.length <= 6 ? 1 : 2;
                for (const w of words) {
                    if (Math.abs(w.length - q.length) <= tol && editDistance(w, q, tol) <= tol) return 500;
                }
                if (Math.abs(ts.length - qs.length) <= tol && editDistance(ts, qs, tol) <= tol) return 480;
            }

            // Sous-séquence (lettres dans l'ordre) en dernier recours
            if (qs.length >= 3 && isSubsequence(qs, ts)) return 300 - ts.length * 0.05;
            return null;
        }

        function searchAnimes(query, limit) {
            const scored = [];
            for (const a of allAnimes) {
                let s = matchScore(a.nom, query);
                // On cherche aussi dans les titres alternatifs / studio si présents
                if (s === null && a.alt) { const alt = matchScore(a.alt, query); if (alt !== null) s = alt - 60; }
                if (s !== null) scored.push({ a, s });
            }
            scored.sort((x, y) => y.s - x.s || x.a.nom.localeCompare(y.a.nom, 'fr'));
            const out = scored.map(x => x.a);
            return limit ? out.slice(0, limit) : out;
        }

        function highlightTitle(title, query) {
            if (!query) return title;
            const normTitle = normalize(title);
            const normQuery = normalize(query);
            const index = normTitle.indexOf(normQuery);
            if (index === -1) return title;
            let charCount = 0, origIndex = -1;
            for (let i = 0; i < title.length; i++) {
                if (normalize(title[i]).length > 0) charCount++;
                if (charCount > index && origIndex === -1) origIndex = i;
            }
            if (origIndex === -1) return title;
            const endIndex = origIndex + query.length;
            return title.substring(0, origIndex) + '<span class="highlight">' + title.substring(origIndex, Math.min(endIndex, title.length)) + '</span>' + title.substring(Math.min(endIndex, title.length));
        }


        async function setBackground() {
            const isMobile = window.innerWidth <= 1000;
            try {
                const res = await fetch('backgrounds.json');
                const data = await res.json();
                const list = isMobile ? data.mobile : data.desktop;
                if (!list || !list.length) return;
                const file = list[Math.floor(Math.random() * list.length)];
                document.getElementById('bg-layer').style.backgroundImage = `url('img/${file}')`;
            } catch(e) {}
        }
        
        // Mise à jour de l'URL et sessionStorage
        function updateURLAndStorage() {
            const tagsArray = Array.from(selectedTags);
            const urlParams = new URLSearchParams();
            if (tagsArray.length) urlParams.set('tags', tagsArray.join(','));
            if (currentSort) urlParams.set('sort', currentSort);
            if (currentSearch) urlParams.set('search', currentSearch);
            const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
            window.history.pushState({ tags: tagsArray, sort: currentSort, search: currentSearch }, '', newUrl);
            sessionStorage.setItem('tags_selected', JSON.stringify(tagsArray));
            sessionStorage.setItem('tags_sort', currentSort);
            sessionStorage.setItem('tags_search', currentSearch);
        }
        
        // Charger l'état depuis l'URL ou sessionStorage
        function loadStateFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let tagsParam = urlParams.get('tags');
            if (tagsParam) {
                selectedTags = new Set(tagsParam.split(',').filter(t => t));
            } else {
                const stored = sessionStorage.getItem('tags_selected');
                if (stored) {
                    try {
                        selectedTags = new Set(JSON.parse(stored));
                    } catch(e) { selectedTags = new Set(); }
                } else {
                    selectedTags = new Set();
                }
            }
            currentSort = urlParams.get('sort') || sessionStorage.getItem('tags_sort') || '';
            currentSearch = urlParams.get('search') || sessionStorage.getItem('tags_search') || '';
            if (currentSort) document.getElementById('tag-sort').value = currentSort;
            if (currentSearch) document.getElementById('search').value = currentSearch;
        }
        
        // Mettre à jour l'affichage des tags (cocher les actifs)
        function updateTagsUI() {
            document.querySelectorAll('.tag-pill').forEach(pill => {
                const tag = pill.getAttribute('data-tag');
                if (selectedTags.has(tag)) pill.classList.add('active');
                else pill.classList.remove('active');
            });
        }
        
        // Afficher les descriptions des tags sélectionnés
        function updateDescriptions() {
            const container = document.getElementById('selected-descriptions');
            const listDiv = document.getElementById('descriptions-list');
            if (selectedTags.size === 0) {
                container.classList.remove('visible');
                return;
            }
            container.classList.add('visible');
            let html = '';
            for (let tag of selectedTags) {
                const desc = tagDescriptions[tag] || "Pas de description disponible.";
                html += `<div class="desc-item"><strong>${tag}</strong> : ${desc}</div>`;
            }
            listDiv.innerHTML = html;
        }
        
        // Filtrer les animes : tous les tags sélectionnés doivent être présents
        function filterAnimesByTags(animes) {
            if (selectedTags.size === 0) return animes;
            return animes.filter(anime => {
                if (!anime.tags || anime.tags.length === 0) return false;
                for (let tag of selectedTags) {
                    if (!anime.tags.includes(tag)) return false;
                }
                return true;
            });
        }
        
        // Appliquer tri et recherche
        function applyFiltersAndSort() {
            let filtered = allAnimes;
            // Filtre par tags
            filtered = filterAnimesByTags(filtered);
            // Filtre par recherche
            if (currentSearch) {
                const normSearch = normalize(currentSearch);
                filtered = filtered.filter(a => normalize(a.nom).includes(normSearch));
            }
            // Tri
            if (currentSort) {
                filtered = [...filtered];
                if (currentSort === 'score') filtered.sort((a,b)=>parseFloat((b.score||'0').replace(',','.'))-parseFloat((a.score||'0').replace(',','.')));
                else if (currentSort === 'popularite') filtered.sort((a,b)=>(parseInt((a.pop||'').replace('#',''))||99999)-(parseInt((b.pop||'').replace('#',''))||99999));
                else if (currentSort === 'sortie') filtered.sort((a,b)=>dateToTs(b.sortie)-dateToTs(a.sortie));
                else if (currentSort === 'episodes') filtered.sort((a,b)=>{ const ea=parseInt((a.ep||'').match(/\d+/g)?.pop()||0); const eb=parseInt((b.ep||'').match(/\d+/g)?.pop()||0); return eb-ea; });
                else if (currentSort === 'nom') filtered.sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
                else if (currentSort === 'censure') filtered.sort((a,b)=>(a.censure||'').localeCompare(b.censure||''));
                else if (currentSort === 'etat') filtered.sort((a,b)=>(a.etat||'').localeCompare(b.etat||''));
                else if (currentSort === 'editeur') filtered.sort((a,b)=>(a.editeur||'').localeCompare(b.editeur||''));
            }
            renderCards(filtered);
            const title = document.getElementById('results-title');
            if (selectedTags.size === 0 && !currentSearch) title.innerText = "Sélectionnez des tags ou recherchez un anime";
            else {
                let msg = `${filtered.length} anime(s) trouvé(s)`;
                if (selectedTags.size) msg += ` avec les tags : ${Array.from(selectedTags).join(', ')}`;
                if (currentSearch) msg += ` pour "${currentSearch}"`;
                title.innerText = msg;
            }
        }
        
        function dateToTs(s){
            if(!s) return 0;
            s = s.trim();
            const mois={'janv.':1,'févr.':2,'mars':3,'avr.':4,'mai':5,'juin':6,'juil.':7,'août':8,'sept.':9,'oct.':10,'nov.':11,'déc.':12,
                        'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12};
            const parts = s.split(' au ');
            const last = parts[parts.length-1].trim();
            const m1 = last.match(/(\d{1,2})\s+([a-zéûôA-Z.]+)\s+(\d{4})/);
            if(m1){ const mo=mois[m1[2]]||1; return new Date(+m1[3], mo-1, +m1[1]).getTime(); }
            const m2 = last.match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})/);
            if(m2){ const mo=mois[m2[1]]||1; return new Date(+m2[3], mo-1, +m2[2]).getTime(); }
            const m3 = (last.match(/\d{4}/g)||[]);
            if(m3.length){ return new Date(+m3[m3.length-1], 0, 1).getTime(); }
            return 0;
        }
        
        function renderCards(list) {
            const container = document.getElementById('anime-container');
            const hl = (f) => currentSort === f ? 'class="highlight"' : '';
            container.innerHTML = list.map(a=>`
                <a href="video.html?name=${encodeURIComponent(a.nom)}" class="card">
                    <div class="img-container"><img src="img/${a.img}" onerror="this.src='img/logo.jpg'"></div>
                    <div class="card-info">
                        <div class="card-title">${a.nom}</div>
                        <div class="card-meta-row"><span ${hl('sortie')}>📅${currentSort==='sortie'?(a.sortie||''):((a.sortie||'').match(/\d{4}/g)?.pop()||a.sortie)}</span><span ${hl('score')}>⭐${a.score}</span><span ${hl('popularite')}>📈${a.pop}</span></div>
                        <div class="card-meta-row"><span ${hl('episodes')}>🎞️${a.ep}</span><span ${hl('censure')}>🔞${a.censure}</span><span ${hl('etat')}>🛠️${a.etat}</span></div>
                        ${a.editeur?`<div class="card-meta-row"><span ${hl('editeur')}>🏢${a.editeur}</span></div>`:''}
                    </div>
                </a>`).join('');
        }
        
        // Gestionnaire de clic sur tag
        function toggleTag(tag) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            updateTagsUI();
            updateDescriptions();
            updateURLAndStorage();
            applyFiltersAndSort();
        }
        
        // Réinitialiser tous les tags
        function clearAllTags() {
            selectedTags.clear();
            updateTagsUI();
            updateDescriptions();
            updateURLAndStorage();
            applyFiltersAndSort();
        }
        
        // Générer l'interface des catégories
        function generateCategoriesUI(allTagsSet) {
            // Organiser les tags par catégorie
            const categoriesMap = new Map();
            for (let cat of Object.keys(categories)) categoriesMap.set(cat, []);
            categoriesMap.set("Autres", []);
            
            for (let tag of allTagsSet) {
                const cat = getCategoryForTag(tag);
                categoriesMap.get(cat).push(tag);
            }
            
            // Trier les tags alphabétiquement dans chaque catégorie
            for (let [cat, tags] of categoriesMap.entries()) {
                tags.sort((a,b) => a.localeCompare(b));
            }
            
            const container = document.getElementById('tags-categories');
            let html = '';
            for (let [cat, tags] of categoriesMap.entries()) {
                if (tags.length === 0) continue;
                html += `<div class="tag-category"><h3>${cat}</h3><div class="tags-container">`;
                tags.forEach(tag => {
                    html += `<div class="tag-pill" data-tag="${tag.replace(/"/g, '&quot;')}" onclick="toggleTag('${tag.replace(/'/g, "\\'")}')">${tag}</div>`;
                });
                html += `</div></div>`;
            }
            // Bouton pour effacer tous les tags
            html += `<div class="tag-category"><div class="tags-container"><div class="clear-tags-btn" onclick="clearAllTags()">✖ Effacer tous les tags</div></div></div>`;
            container.innerHTML = html;
        }
        
        async function init() {
            setBackground();
            try {
                const [csvResp, tagResp] = await Promise.all([fetch('animes.csv'), fetch('tags_description.csv').catch(() => null)]);
                const rawData = await csvResp.text();
                allAnimes = rawData.split(/\r?\n/).slice(1).map(line => {
                    const c = line.split(';');
                    if (!c[0] || c.length < 9) return null;
                    const clean = (s) => s ? s.trim().replace(/^"|"$/g, '') : "";
                    return { 
                        nom: clean(c[0]), sortie: clean(c[3]), score: clean(c[2]), pop: clean(c[1]), ep: clean(c[4]), censure: clean(c[5]), 
                        etat: clean(c[6]), img: clean(c[8]), tags: c[12] ? c[12].split(',').map(clean).filter(t=>t) : [], editeur: clean(c[14])
                    };
                }).filter(a => a);
                
                if (tagResp && tagResp.ok) {
                    const tagText = await tagResp.text();
                    tagText.split(/\r?\n/).slice(1).forEach(line => {
                        if (!line.trim()) return;
                        let cols = [], field = '', inQ = false;
                        for (let i=0;i<line.length;i++) { const ch=line[i]; if(ch==='"') inQ=!inQ; else if(ch===';' && !inQ) { cols.push(field); field=''; } else field+=ch; }
                        cols.push(field);
                        const name = (cols[0]||'').trim().replace(/^"|"$/g,'');
                        const desc = (cols[1]||'').trim().replace(/^"|"$/g,'');
                        if(name) tagDescriptions[name]=desc;
                    });
                }
                
                // Récupérer tous les tags existants dans les animes
                const allTagsSet = new Set();
                allAnimes.forEach(a => a.tags.forEach(t => allTagsSet.add(t)));
                generateCategoriesUI(allTagsSet);
                
                // Restaurer l'état depuis l'URL ou sessionStorage
                loadStateFromURL();
                // Appliquer les sélections à l'UI
                updateTagsUI();
                updateDescriptions();
                applyFiltersAndSort();
                
                // Gestion de la recherche (même moteur et même UX que sur la page d'accueil)
                const searchInput = document.getElementById('search');
                const searchSuggestions = document.getElementById('search-suggestions');
                let hlIndex = -1;

                function renderSuggestions(val) {
                    if (val.length < 1) { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
                    const results = searchAnimes(val, 8);
                    hlIndex = -1;
                    if (results.length === 0) {
                        searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat pour « ' + val + ' »</div>';
                    } else {
                        searchSuggestions.innerHTML = results.map(a => {
                            const year = (a.sortie || '').match(/\d{4}/g)?.pop() || '';
                            const meta = [year, a.ep ? a.ep + ' ép.' : ''].filter(Boolean).join(' · ');
                            return '<div class="suggestion-item" data-name="' + a.nom.replace(/"/g, '&quot;') + '">'
                                + '<img src="img/' + a.img + '" class="sugg-img" loading="lazy" onerror="this.src=\'img/logo.jpg\'">'
                                + '<span><span class="sugg-title">' + highlightTitle(a.nom, val) + '</span>'
                                + (meta ? '<span class="sugg-meta">' + meta + '</span>' : '') + '</span></div>';
                        }).join('');
                    }
                    searchSuggestions.classList.add('active');
                }

                let suggTimer;
                searchInput.addEventListener('input', function() {
                    currentSearch = this.value.trim();
                    updateURLAndStorage();
                    applyFiltersAndSort();
                    clearTimeout(suggTimer);
                    suggTimer = setTimeout(() => renderSuggestions(currentSearch), 90);
                });
                searchInput.addEventListener('focus', function() {
                    const val = this.value.trim();
                    if (val) renderSuggestions(val);
                });

                function moveHighlight(delta) {
                    const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
                    if (!items.length) return;
                    if (hlIndex >= 0) items[hlIndex].classList.remove('hl');
                    hlIndex = (hlIndex + delta + items.length) % items.length;
                    items[hlIndex].classList.add('hl');
                    items[hlIndex].scrollIntoView({ block: 'nearest' });
                }

                searchInput.addEventListener('keydown', function(e) {
                    const open = searchSuggestions.classList.contains('active');
                    if (e.key === 'ArrowDown' && open) { e.preventDefault(); moveHighlight(1); return; }
                    if (e.key === 'ArrowUp' && open) { e.preventDefault(); moveHighlight(-1); return; }
                    if (e.key === 'Escape') { searchSuggestions.classList.remove('active'); hlIndex = -1; return; }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const items = [...searchSuggestions.querySelectorAll('.suggestion-item')];
                        if (open && hlIndex >= 0 && items[hlIndex]) {
                            window.location.href = 'video.html?name=' + encodeURIComponent(items[hlIndex].dataset.name);
                            return;
                        }
                        searchSuggestions.classList.remove('active');
                        this.blur();
                    }
                });
                searchSuggestions.addEventListener('click', function(e) {
                    const item = e.target.closest('.suggestion-item');
                    if (item && item.dataset.name) window.location.href = 'video.html?name=' + encodeURIComponent(item.dataset.name);
                });
                document.addEventListener('click', function(e) { if (!e.target.closest('.search-wrapper')) { searchSuggestions.classList.remove('active'); hlIndex = -1; } });
                
                // Gestion du tri
                document.getElementById('tag-sort').addEventListener('change', function() {
                    currentSort = this.value;
                    updateURLAndStorage();
                    applyFiltersAndSort();
                });
                
                // Gestion du retour arrière
                window.addEventListener('popstate', function(event) {
                    if (event.state) {
                        selectedTags = new Set(event.state.tags || []);
                        currentSort = event.state.sort || '';
                        currentSearch = event.state.search || '';
                        document.getElementById('tag-sort').value = currentSort;
                        document.getElementById('search').value = currentSearch;
                        updateTagsUI();
                        updateDescriptions();
                        applyFiltersAndSort();
                    } else {
                        // fallback sur l'URL
                        loadStateFromURL();
                        updateTagsUI();
                        updateDescriptions();
                        applyFiltersAndSort();
                    }
                });
                
            } catch(err) { console.error(err); }
        }
        
        function toggleM() { const menu=document.getElementById('menu'), overlay=document.getElementById('overlay'); const isOpen=menu.classList.toggle('active'); overlay.classList.toggle('active'); document.body.style.overflow=isOpen?'hidden':''; }
        
        // Exposer les fonctions globales pour les onclick
        window.toggleTag = toggleTag;
        window.clearAllTags = clearAllTags;
        window.applySort = function() { 
            currentSort = document.getElementById('tag-sort').value;
            updateURLAndStorage();
            applyFiltersAndSort();
        };
        window.toggleM = toggleM;

        window.randomAnime = () => { if (allAnimes.length) { const a = allAnimes[Math.floor(Math.random() * allAnimes.length)]; window.location.href = 'video.html?name=' + encodeURIComponent(a.nom); } };

        (function markActiveTab() {
            const current = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-tab').forEach(tab => {
                if (tab.dataset.page === current) tab.classList.add('active');
            });
        })();

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            document.getElementById('bg-overlay').style.opacity = Math.min(scrollY / 600, 0.65);
        });

        init();
    </script>
