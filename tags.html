<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Tags - Le Malicieux</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0;
            min-height: 100vh; padding-top: 62px; overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .tag-category { margin-bottom: 30px; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 12px 16px; }
        .tag-category h3 { color: var(--primary); font-size: 1.1em; margin: 0 0 10px 0; border-left: 3px solid var(--primary); padding-left: 10px; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .tag-pill { padding: 8px 16px; background: #222; border: 1px solid #444; border-radius: 20px; color: #ccc; cursor: pointer; font-size: 0.9em; transition: 0.3s; user-select: none; }
        .tag-pill:hover, .tag-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
        .clear-tags-btn { background: #333; border: 1px solid #ff4757; color: #ff4757; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8em; margin-left: 10px; }
        .clear-tags-btn:hover { background: #ff4757; color: white; }
        .selected-descriptions { background: rgba(15,15,15,0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255,71,87,0.4); border-left: 4px solid var(--primary); border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; display: none; }
        .selected-descriptions.visible { display: block; }
        .selected-descriptions h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 1em; }
        .selected-descriptions .desc-item { margin-bottom: 8px; color: #ddd; font-size: 0.9em; line-height: 1.5; }
        .selected-descriptions .desc-item strong { color: var(--primary); }
        
        /* Taille de fiche augmentée pour faire tenir 4 badges sur une ligne */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
        }
        .card { background: var(--card-bg); border-radius: 3px; overflow: hidden; transition: 0.2s; border: 1px solid #333; text-decoration: none; color: inherit; font-size: 0.85em; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .card .img-container { width: 100%; aspect-ratio: 2/3; background: #111; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 8px 9px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 4px; height: 2.4em; overflow: hidden; font-size: 1.0em; line-height: 1.2; }
        .card-meta-row { display: flex; flex-wrap: wrap; gap: 5px; color: #ddd; margin-top: 4px; }
        .sort-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; justify-content: flex-end; }
        .sort-controls select { background: #222; border: 1px solid #444; color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.85em; cursor: pointer; }
        .results-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .results-title { font-weight: bold; color: #888; }
        .highlight { background: var(--primary); color: white; padding: 0 2px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <header class="site-header">
        <div class="navbar">
            <div class="nav-left">
                <button class="burger" onclick="toggleM()" aria-label="Ouvrir le menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <a class="nav-brand" href="index.html">
                    <img src="img/bannieres_icones/logo.jpg" class="nav-logo-small" alt="Logo Le Malicieux">
                    <span class="nav-title">LE MALICIEUX</span>
                </a>
            </div>
            <div class="mobile-overlay" id="overlay" onclick="toggleM()"></div>
            <nav class="nav-links" id="menu">
                <div class="close-menu" onclick="toggleM()">Fermer</div>
                <div id="auth-ui-mobile" class="menu-account auth-ui-slot"><button class="js-login-btn auth-login-btn">Connexion</button></div>
                <a href="index.html" class="nav-tab" data-page="index.html">Accueil</a>
                <a href="tags.html" class="nav-tab" data-page="tags.html">Tags</a>
                <a href="alphabetique.html" class="nav-tab" data-page="alphabetique.html">A-Z</a>
                <a href="playlist.html" class="nav-tab" data-page="playlist.html">Playlist</a>
                <a href="editeurs.html" class="nav-tab" data-page="editeurs.html">Studios</a>
                <a href="profil.html" class="nav-tab" data-page="profil.html">Profil</a>
                <a href="index_old.html" class="nav-tab" data-page="index_old.html">Ancien Index</a>
                <button class="nav-action" onclick="doRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
            </nav>
            <div class="nav-right">
                <div class="search-wrapper" id="search-wrapper">
                    <input type="text" id="search" placeholder="Rechercher un anime..." autocomplete="off">
                    <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
                <button class="nav-action" onclick="doRandom()">Au hasard</button>
                <a href="https://discord.gg/4DY3Zq4vW4" target="_blank" class="discord-btn" title="Rejoindre le Discord">
                    <img src="img/bannieres_icones/logo-discord.jpg" alt="Discord">
                </a>
                <div id="auth-ui" class="auth-ui-slot"><button class="js-login-btn auth-login-btn">Connexion</button></div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 style="color: var(--primary); margin-bottom: 20px;">Explorer par catégories</h2>
        <div id="tags-categories"></div>
        <div id="selected-descriptions" class="selected-descriptions">
            <h4>📖 Tags sélectionnés :</h4>
            <div id="descriptions-list"></div>
        </div>
        <div class="results-header">
            <div id="results-title" class="results-title">Sélectionnez des tags</div>
            <div class="sort-controls">
                <select id="tag-sort" onchange="applySort()">
                    <option value="">Aléatoire</option>
                    <option value="score">Score ↓</option>
                    <option value="popularite">Popularité ↑</option>
                    <option value="sortie">Année ↓</option>
                    <option value="episodes">Épisodes ↓</option>
                    <option value="nom">Nom (A-Z)</option>
                    <option value="censure">Censure</option>
                    <option value="etat">État</option>
                    <option value="editeur">Éditeur</option>
                </select>
            </div>
        </div>
        <div id="anime-container" class="grid"></div>
    </div>

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, renderMetaBadges,
        handleImgError, IMG_LOGO, searchAnimes, highlightTitle, normalize
    } from './common.js';

    initCommon();

    let allAnimes = [];
    let tagDescriptions = {};
    let selectedTags = new Set();
    let currentSort = '';
    let currentSearch = '';

    const categories = {
        "Pratiques physiques": ["Ahegao","BDSM","Bondage","Condom","Cosplay","Lactation","Public Sex","Rape","Paizuri","Masturbation","Gang bang","Yuri","Yaoi","Gender bender"],
        "Caractéristiques personnages physiques et mentaux": ["Giga seins","Futanari","Tentacules","Virgin","Fétichisme","Masochisme","Nymphomanie","Voyeurisme","Yandere","Tsundere","Elf","Succube","Magical girl","Monster","Monster girl","Furry","Kemonomimi","Milf","Gyaru","Idols","Nun","Nurse","Maid","Femboy","Loli","Shota"],
        "Cadre Général": ["Vanilla","School life","Inceste","NTR","Harem","Psychologique","Surnaturel","Isekai","Fantasy","Horreur","Jeu NSFW","Erotica"]
    };

    function getCategoryForTag(tag) {
        for (const [cat, tags] of Object.entries(categories)) if (tags.includes(tag)) return cat;
        return "Autres";
    }

    function updateURLAndStorage() {
        const arr = Array.from(selectedTags);
        const urlParams = new URLSearchParams();
        if (arr.length) urlParams.set('tags', arr.join(','));
        if (currentSort) urlParams.set('sort', currentSort);
        if (currentSearch) urlParams.set('search', currentSearch);
        window.history.pushState({ tags: arr, sort: currentSort, search: currentSearch }, '', window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : ''));
        sessionStorage.setItem('tags_selected', JSON.stringify(arr));
        sessionStorage.setItem('tags_sort', currentSort);
        sessionStorage.setItem('tags_search', currentSearch);
    }

    function loadStateFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const tagsParam = urlParams.get('tags');
        if (tagsParam) selectedTags = new Set(tagsParam.split(',').filter(Boolean));
        else {
            const stored = sessionStorage.getItem('tags_selected');
            if (stored) { try { selectedTags = new Set(JSON.parse(stored)); } catch (e) { selectedTags = new Set(); } }
        }
        currentSort = urlParams.get('sort') || sessionStorage.getItem('tags_sort') || '';
        currentSearch = urlParams.get('search') || sessionStorage.getItem('tags_search') || '';
        if (currentSort) document.getElementById('tag-sort').value = currentSort;
        if (currentSearch) document.getElementById('search').value = currentSearch;
    }

    function updateTagsUI() {
        document.querySelectorAll('.tag-pill').forEach(p => p.classList.toggle('active', selectedTags.has(p.dataset.tag)));
    }

    function updateDescriptions() {
        const container = document.getElementById('selected-descriptions');
        const list = document.getElementById('descriptions-list');
        if (selectedTags.size === 0) { container.classList.remove('visible'); return; }
        container.classList.add('visible');
        list.innerHTML = Array.from(selectedTags).map(t => `<div class="desc-item"><strong>${t}</strong> : ${tagDescriptions[t] || 'Pas de description.'}</div>`).join('');
    }

    function applyFiltersAndSort() {
        let filtered = allAnimes;
        if (selectedTags.size) filtered = filtered.filter(a => {
            if (!a.tags) return false;
            const list = a.tags.split(',').map(t => t.trim());
            for (const tag of selectedTags) if (!list.includes(tag)) return false;
            return true;
        });
        if (currentSearch) filtered = searchAnimes(currentSearch, filtered);
        if (currentSort) filtered = sortList(filtered, currentSort);
        renderCards(filtered);
        const title = document.getElementById('results-title');
        if (!selectedTags.size && !currentSearch) title.innerText = "Sélectionnez des tags ou recherchez un anime";
        else {
            let msg = `${filtered.length} anime(s) trouvé(s)`;
            if (selectedTags.size) msg += ` avec les tags : ${Array.from(selectedTags).join(', ')}`;
            if (currentSearch) msg += ` pour "${currentSearch}"`;
            title.innerText = msg;
        }
    }

    function dateToTs(s) {
        if (!s) return 0;
        s = s.trim();
        const mois = {'janv.':1,'févr.':2,'mars':3,'avr.':4,'mai':5,'juin':6,'juil.':7,'août':8,'sept.':9,'oct.':10,'nov.':11,'déc.':12,'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12};
        const parts = s.split(' au ');
        const last = parts[parts.length - 1].trim();
        const m1 = last.match(/(\d{1,2})\s+([a-zéûôA-Z.]+)\s+(\d{4})/);
        if (m1) { const mo = mois[m1[2]] || 1; return new Date(+m1[3], mo - 1, +m1[1]).getTime(); }
        const m2 = last.match(/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})/);
        if (m2) { const mo = mois[m2[1]] || 1; return new Date(+m2[3], mo - 1, +m2[2]).getTime(); }
        const m3 = last.match(/\d{4}/g);
        if (m3) return new Date(+m3[m3.length - 1], 0, 1).getTime();
        return 0;
    }

    function sortList(list, mode) {
        const s = [...list];
        if (mode === 'score') s.sort((a, b) => parseFloat((b.score || '0').replace(',', '.')) - parseFloat((a.score || '0').replace(',', '.')));
        else if (mode === 'popularite') s.sort((a, b) => (parseInt((a.pop || '').replace('#', '')) || 99999) - (parseInt((b.pop || '').replace('#', '')) || 99999));
        else if (mode === 'sortie') s.sort((a, b) => dateToTs(b.sortie) - dateToTs(a.sortie));
        else if (mode === 'episodes') s.sort((a, b) => { const ea = parseInt((a.ep || '').match(/\d+/g)?.pop() || '0'); const eb = parseInt((b.ep || '').match(/\d+/g)?.pop() || '0'); return eb - ea; });
        else if (mode === 'nom') s.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
        else if (mode === 'censure') s.sort((a, b) => (a.censure || '').localeCompare(b.censure || ''));
        else if (mode === 'etat') s.sort((a, b) => (a.etat || '').localeCompare(b.etat || ''));
        else if (mode === 'editeur') s.sort((a, b) => (a.editeur || '').localeCompare(b.editeur || ''));
        return s;
    }

    function renderCards(list) {
        const container = document.getElementById('anime-container');
        const hl = (f) => currentSort === f ? 'class="highlight"' : '';
        container.innerHTML = list.map(a => {
            const cover = getCoverPath(a.ordreAjout, 1);
            const coverFile = `${a.ordreAjout}-1.webp`;
            const year = (a.sortie || '').match(/\d{4}/g)?.pop() || a.sortie;

            return `<a href="fiche.html?name=${encodeURIComponent(a.nom)}" class="card">
                <div class="img-container"><img src="${cover}" onerror="handleImgError(this, '${coverFile}')"></div>
                <div class="card-info">
                    <div class="card-title">${a.nom}</div>
                    <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;">
                        <span class="meta-badge" ${hl('sortie')}>${currentSort === 'sortie' ? a.sortie : year}</span>
                        <span class="meta-badge mal-score" ${hl('score')}>★${a.score}</span>
                        <span class="meta-badge" ${hl('popularite')}>${a.pop}</span>
                        <span class="meta-badge" ${hl('episodes')}>${a.ep} ép.</span>
                    </div>
                    <div class="card-meta-row" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;">
                        <span class="meta-badge"><strong>Censure :</strong> ${a.censure}</span>
                        <span class="meta-badge"><strong>Statut :</strong> ${a.etat}</span>
                    </div>
                    ${a.editeur ? `<div class="card-meta-row" style="margin-top:6px;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#888; font-size:0.78em;">${a.editeur}</span></div>` : ''}
                </div>
            </a>`;
        }).join('');
    }

    function toggleTag(tag) {
        if (selectedTags.has(tag)) selectedTags.delete(tag);
        else selectedTags.add(tag);
        updateTagsUI(); updateDescriptions(); updateURLAndStorage(); applyFiltersAndSort();
    }
    function clearAllTags() {
        selectedTags.clear(); updateTagsUI(); updateDescriptions(); updateURLAndStorage(); applyFiltersAndSort();
    }

    function generateCategoriesUI(allTagsSet) {
        const map = new Map();
        for (const cat of Object.keys(categories)) map.set(cat, []);
        map.set("Autres", []);
        for (const t of allTagsSet) map.get(getCategoryForTag(t)).push(t);
        for (const [, arr] of map.entries()) arr.sort((a, b) => a.localeCompare(b));
        const container = document.getElementById('tags-categories');
        let html = '';
        for (const [cat, tags] of map.entries()) {
            if (!tags.length) continue;
            html += `<div class="tag-category"><h3>${cat}</h3><div class="tags-container">`;
            tags.forEach(t => { html += `<div class="tag-pill" data-tag="${t.replace(/"/g, '&quot;')}" onclick="toggleTag('${t.replace(/'/g, "\\'")}')">${t}</div>`; });
            html += `</div></div>`;
        }
        html += `<div class="tag-category"><div class="tags-container"><div class="clear-tags-btn" onclick="clearAllTags()">✖ Effacer tous les tags</div></div></div>`;
        container.innerHTML = html;
    }

    function doRandom() {
        if (!allAnimes.length) return;
        const a = allAnimes[Math.floor(Math.random() * allAnimes.length)];
        window.location.href = 'fiche.html?name=' + encodeURIComponent(a.nom);
    }
    window.doRandom = doRandom;
    window.toggleTag = toggleTag;
    window.clearAllTags = clearAllTags;
    window.applySort = function () {
        currentSort = document.getElementById('tag-sort').value;
        updateURLAndStorage(); applyFiltersAndSort();
    };

    // ─── Recherche ───
    const searchInput = document.getElementById('search');
    const searchSuggestions = document.getElementById('search-suggestions');
    let suggTimer;
    searchInput.addEventListener('input', function () {
        currentSearch = this.value.trim();
        updateURLAndStorage();
        applyFiltersAndSort();
        clearTimeout(suggTimer);
        suggTimer = setTimeout(() => {
            if (!currentSearch) { searchSuggestions.classList.remove('active'); return; }
            const results = searchAnimes(currentSearch, allAnimes, 8);
            if (!results.length) searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
            else searchSuggestions.innerHTML = results.map(a => `<div class="suggestion-item" data-name="${a.nom.replace(/"/g, '&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${highlightTitle(a.nom, currentSearch)}</span></div>`).join('');
            searchSuggestions.classList.add('active');
        }, 90);
    });
    searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); searchSuggestions.classList.remove('active'); this.blur(); }
    });
    searchSuggestions.addEventListener('click', function (e) {
        const item = e.target.closest('.suggestion-item');
        if (item && item.dataset.name) window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-wrapper')) searchSuggestions.classList.remove('active');
    });

    (async function () {
        try {
            const [csvList, tagResp] = await Promise.all([loadAnimes(), fetch('tags_description.csv').catch(() => null)]);
            allAnimes = csvList;
            if (tagResp && tagResp.ok) {
                const txt = await tagResp.text();
                txt.split(/\r?\n/).slice(1).forEach(line => {
                    if (!line.trim()) return;
                    const cols = []; let cur = ''; let inQ = false;
                    for (let i = 0; i < line.length; i++) { const ch = line[i]; if (ch === '"') inQ = !inQ; else if (ch === ';' && !inQ) { cols.push(cur); cur = ''; } else cur += ch; }
                    cols.push(cur);
                    const name = (cols[0] || '').trim().replace(/^"|"$/g, '');
                    const desc = (cols[1] || '').trim().replace(/^"|"$/g, '');
                    if (name) tagDescriptions[name] = desc;
                });
            }
            const allTagsSet = new Set();
            allAnimes.forEach(a => { if (a.tags) a.tags.split(',').forEach(t => { const tt = t.trim(); if (tt) allTagsSet.add(tt); }); });
            generateCategoriesUI(allTagsSet);
            loadStateFromURL();
            updateTagsUI();
            updateDescriptions();
            applyFiltersAndSort();
        } catch (e) { console.error(e); }
    })();
</script>
</body>
</html>
