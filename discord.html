<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Annonces Discord - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; overflow-x: hidden; padding-top: 62px; }
        .page-wrap { max-width: 800px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 100px) 60px; }
        
        /* ── BARRE D'OUTILS (Titre + Tri) ── */
        .toolbar {
            background: rgba(15, 15, 15, 0.85); /* Fond sombre semi-transparent */
            backdrop-filter: blur(8px); /* Effet de flou derrière */
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        
        .page-title { font-size: 1.5em; font-weight: 900; color: var(--primary); margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 10px; }
        
        .sort-wrapper { display: flex; align-items: center; gap: 8px; }
        .sort-wrapper label { font-size: 0.85em; color: #aaa; font-weight: bold; text-transform: uppercase; }
        .sort-select { 
            background: #1c1c1f; border: 1px solid #444; color: white; 
            padding: 8px 12px; border-radius: 6px; font-size: 0.85em; 
            cursor: pointer; outline: none; transition: 0.2s;
        }
        .sort-select:hover { border-color: var(--primary); }

        /* Style des messages Discord */
        .discord-post { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 16px; transition: border-color 0.2s; }
        .discord-post:hover { border-color: #444; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: #444; object-fit: cover; }
        .post-author { font-weight: 700; color: #fff; font-size: 0.95em; }
        .post-date { font-size: 0.75em; color: #888; margin-top: 2px; }
        .post-content { font-size: 0.95em; line-height: 1.5; color: #ddd; white-space: pre-wrap; word-wrap: break-word; }
        
        /* Images jointes */
        .post-image { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 8px; margin-top: 10px; border: 1px solid #444; display: block; }
        
        /* Embeds */
        .embed-box { border-left: 4px solid var(--primary); background: rgba(0,0,0,0.3); padding: 12px 16px; margin-top: 12px; border-radius: 0 6px 6px 0; }
        .embed-title { font-weight: bold; color: #fff; margin-bottom: 6px; font-size: 1em; }
        .embed-desc { font-size: 0.9em; color: #ccc; line-height: 1.4; white-space: pre-wrap; }
        
        .loading-state, .error-state, .empty-state { text-align: center; color: #888; padding: 40px 20px; font-style: italic; }
        
        /* Bouton "Charger plus" */
        .load-more-container { text-align: center; margin-top: 30px; }
        .load-more-btn { 
            background: rgba(255,71,87,0.1); border: 1px solid var(--primary); color: var(--primary); 
            padding: 10px 24px; border-radius: 8px; font-size: 1em; font-weight: bold; 
            cursor: pointer; transition: 0.2s; outline: none; 
        }
        .load-more-btn:hover { background: var(--primary); color: white; }
        .load-more-btn:disabled { opacity: 0.5; cursor: wait; border-color: #555; color: #888; background: transparent; }

        @media (max-width: 600px) {
            .toolbar { flex-direction: column; align-items: stretch; text-align: center; }
            .sort-wrapper { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    
    <!-- La navbar est injectée ici automatiquement par common.js -->

    <div class="page-wrap">
        <div class="toolbar">
            <h1 class="page-title">📢 Annonces Officielles</h1>
            <div class="sort-wrapper">
                <label for="sort-order">Trier :</label>
                <select id="sort-order" class="sort-select">
                    <option value="desc">Plus récents d'abord</option>
                    <option value="asc">Plus anciens d'abord</option>
                </select>
            </div>
        </div>

        <div id="discord-feed"></div>
        
        <div class="load-more-container" id="load-more-container" style="display:none;">
            <button class="load-more-btn" id="load-more-btn" onclick="loadMore()">Charger plus de messages</button>
        </div>
    </div>

<script type="module">
    import { initCommon } from './common.js';
    
    initCommon();

    // ⚠️ REMPLACE CETTE URL PAR CELLE DE TON CLOUDFLARE WORKER ⚠️
    const WORKER_URL = 'https://discord-annonces.zach-bisanti.workers.dev';

    const feed = document.getElementById('discord-feed');
    const loadMoreContainer = document.getElementById('load-more-container');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const sortSelect = document.getElementById('sort-order');

    let allMessages = []; // Stocke TOUS les messages chargés (pour pouvoir les trier)
    let lastMessageId = null; // ID du message le plus ancien chargé
    let isLoading = false;

    // ── 1. Récupération des données ──
    async function fetchMessages(beforeId = null) {
        let url = WORKER_URL;
        if (beforeId) url += `?before=${beforeId}`;
        
        const res = await fetch(url);
        const data = await res.json();
        
        if (!Array.isArray(data)) {
            throw new Error(`Erreur Worker : ${data.message || data.details || 'Erreur inconnue'}`);
        }
        return data;
    }

    // ── 2. Affichage et Tri ──
    function renderMessages() {
        // Filtre les messages vides
        let validMessages = allMessages.filter(m => 
            (m.content && m.content.trim() !== '') || 
            (m.attachments && m.attachments.length > 0) || 
            (m.embeds && m.embeds.length > 0)
        );

        if (validMessages.length === 0) {
            feed.innerHTML = '<div class="empty-state">Aucune annonce pour le moment. Revenez plus tard !</div>';
            return;
        }

        // Application du tri choisi
        const sortOrder = sortSelect.value;
        validMessages.sort((a, b) => {
            const dateA = new Date(a.date).getTime();
            const dateB = new Date(b.date).getTime();
            return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
        });

        // Génération du HTML
        feed.innerHTML = validMessages.map(m => {
            const dateObj = new Date(m.date);
            const dateStr = dateObj.toLocaleString('fr-FR', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', 
                hour: '2-digit', minute: '2-digit' 
            });

            // Modification du pseudo ici
            const displayAuthor = (m.author === 'zacharisk_11') ? 'Créateur' : m.author;

            let attachmentsHtml = '';
            if (m.attachments && m.attachments.length > 0) {
                attachmentsHtml = m.attachments
                    .filter(a => a.content_type && a.content_type.startsWith('image/'))
                    .map(a => `<img src="${a.url}" class="post-image" loading="lazy">`)
                    .join('');
            }
            
            let embedsHtml = '';
            if (m.embeds && m.embeds.length > 0) {
                embedsHtml = m.embeds.map(e => `
                    <div class="embed-box" style="${e.color ? `border-left-color: #${e.color.toString(16).padStart(6, '0')};` : ''}">
                        ${e.title ? `<div class="embed-title">${e.title}</div>` : ''}
                        ${e.description ? `<div class="embed-desc">${e.description}</div>` : ''}
                    </div>
                `).join('');
            }

            return `
            <div class="discord-post">
                <div class="post-header">
                    <img src="${m.avatar}" class="post-avatar" onerror="this.src='img/bannieres_icones/logo.jpg'">
                    <div>
                        <div class="post-author">${displayAuthor}</div>
                        <div class="post-date">${dateStr}</div>
                    </div>
                </div>
                <div class="post-content">${m.content || ''}</div>
                ${embedsHtml}
                ${attachmentsHtml}
            </div>`;
        }).join('');
    }

    // ── 3. Initialisation et Pagination ──
    async function init() {
        try {
            feed.innerHTML = '<div class="loading-state">Chargement des annonces...</div>';
            const messages = await fetchMessages();
            
            allMessages = messages;
            if (messages.length > 0) {
                lastMessageId = messages[messages.length - 1].id; // ID du plus ancien
            }
            
            renderMessages();
            
            // Affiche le bouton s'il y a probablement d'autres pages (100 = max API)
            if (messages.length === 100) {
                loadMoreContainer.style.display = 'block';
            }
        } catch (e) {
            console.error(e);
            feed.innerHTML = `
                <div class="error-state" style="color: var(--primary);">
                    Impossible de charger les annonces Discord.<br>
                    <span style="font-size: 0.8em; color: #888;">(${e.message})</span>
                </div>`;
        }
    }

    window.loadMore = async function() {
        if (isLoading || !lastMessageId) return;
        
        isLoading = true;
        loadMoreBtn.textContent = 'Chargement...';
        loadMoreBtn.disabled = true;

        try {
            // On charge les messages qui viennent AVANT le plus ancien qu'on a déjà
            const olderMessages = await fetchMessages(lastMessageId);
            
            // On ajoute les nouveaux messages à notre liste globale
            allMessages = allMessages.concat(olderMessages);
            
            if (olderMessages.length > 0) {
                lastMessageId = olderMessages[olderMessages.length - 1].id;
            }

            // On réaffiche tout en appliquant le tri actuel
            renderMessages();
            
            if (olderMessages.length < 100) {
                loadMoreContainer.style.display = 'none'; // Plus rien à charger
            } else {
                loadMoreBtn.textContent = 'Charger plus de messages';
                loadMoreBtn.disabled = false;
            }
        } catch (e) {
            console.error(e);
            alert('Erreur lors du chargement des messages plus anciens.');
            loadMoreBtn.textContent = 'Réessayer';
            loadMoreBtn.disabled = false;
        } finally {
            isLoading = false;
        }
    };

    // Re-trier instantanément quand on change le menu déroulant
    sortSelect.addEventListener('change', renderMessages);

    // Lancer le premier chargement
    init();
</script>
</body>
</html>
