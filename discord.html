<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <title>Annonces Discord - Le Malicieux</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; min-height: 100vh; overflow-x: hidden; padding-top: 62px; }
        .page-wrap { max-width: 800px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 100px) 60px; }
        
        .page-title { font-size: 1.6em; font-weight: 900; color: var(--primary); margin: 0 0 20px 0; text-align: center; }
        
        /* Style des messages Discord */
        .discord-post { background: var(--card-bg); border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 16px; transition: border-color 0.2s; }
        .discord-post:hover { border-color: #444; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: #444; object-fit: cover; }
        .post-author { font-weight: 700; color: #fff; font-size: 0.95em; }
        .post-date { font-size: 0.75em; color: #888; margin-top: 2px; }
        .post-content { font-size: 0.95em; line-height: 1.5; color: #ddd; white-space: pre-wrap; word-wrap: break-word; }
        
        /* Images jointes */
        .post-image { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 8px; margin-top: 10px; border: 1px solid #444; display: block; }
        
        /* Embeds (les cartes spéciales de Discord) */
        .embed-box { border-left: 4px solid var(--primary); background: rgba(0,0,0,0.3); padding: 12px 16px; margin-top: 12px; border-radius: 0 6px 6px 0; }
        .embed-title { font-weight: bold; color: #fff; margin-bottom: 6px; font-size: 1em; }
        .embed-desc { font-size: 0.9em; color: #ccc; line-height: 1.4; white-space: pre-wrap; }
        
        .loading-state, .error-state, .empty-state { text-align: center; color: #888; padding: 40px 20px; font-style: italic; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    
    <!-- La navbar est injectée ici automatiquement par common.js -->

    <div class="page-wrap">
        <h1 class="page-title">📢 Annonces Officielles</h1>
        <div id="discord-feed">
            <div class="loading-state">Chargement des annonces depuis Discord...</div>
        </div>
    </div>

<script type="module">
    import { initCommon } from './common.js';
    
    // Initialise le fond, la navbar, l'auth, etc.
    initCommon();

    // ⚠️ REMPLACE CETTE URL PAR CELLE DE TON CLOUDFLARE WORKER ⚠️
    const WORKER_URL = 'https://discord-annonces.zach-bisanti.workers.dev';

    async function loadAnnouncements() {
        const feed = document.getElementById('discord-feed');
        
        try {
            const res = await fetch(WORKER_URL);
            if (!res.ok) throw new Error(`Erreur HTTP: ${res.status}`);
            
            const messages = await res.json();
            
            // On filtre pour ne garder que les messages qui ont du contenu (texte, image ou embed)
            const validMessages = messages.filter(m => 
                (m.content && m.content.trim() !== '') || 
                (m.attachments && m.attachments.length > 0) || 
                (m.embeds && m.embeds.length > 0)
            );

            if (validMessages.length === 0) {
                feed.innerHTML = '<div class="empty-state">Aucune annonce pour le moment. Revenez plus tard !</div>';
                return;
            }

            feed.innerHTML = validMessages.map(m => {
                // Formatage de la date
                const dateObj = new Date(m.date);
                const dateStr = dateObj.toLocaleString('fr-FR', { 
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', 
                    hour: '2-digit', minute: '2-digit' 
                });

                // Gestion des images jointes
                let attachmentsHtml = '';
                if (m.attachments && m.attachments.length > 0) {
                    // On vérifie si c'est bien une image pour l'afficher
                    attachmentsHtml = m.attachments
                        .filter(a => a.content_type && a.content_type.startsWith('image/'))
                        .map(a => `<img src="${a.url}" class="post-image" loading="lazy">`)
                        .join('');
                }
                
                // Gestion des embeds (quand un bot poste une carte avec un titre, etc.)
                let embedsHtml = '';
                if (m.embeds && m.embeds.length > 0) {
                    embedsHtml = m.embeds.map(e => `
                        <div class="embed-box" style="${e.color ? `border-left-color: #${e.color.toString(16).padStart(6, '0')};` : ''}">
                            ${e.title ? `<div class="embed-title">${e.title}</div>` : ''}
                            ${e.description ? `<div class="embed-desc">${e.description}</div>` : ''}
                        </div>
                    `).join('');
                }

                // Rendu final du message
                return `
                <div class="discord-post">
                    <div class="post-header">
                        <img src="${m.avatar}" class="post-avatar" onerror="this.src='img/bannieres_icones/logo.jpg'">
                        <div>
                            <div class="post-author">${m.author}</div>
                            <div class="post-date">${dateStr}</div>
                        </div>
                    </div>
                    <div class="post-content">${m.content || ''}</div>
                    ${embedsHtml}
                    ${attachmentsHtml}
                </div>`;
            }).join('');
            
        } catch (e) {
            console.error("Erreur de chargement des annonces :", e);
            feed.innerHTML = `
                <div class="error-state" style="color: var(--primary);">
                    Impossible de charger les annonces Discord.<br>
                    <span style="font-size: 0.8em; color: #888;">(Vérifie que l'URL du Worker est correcte et que le bot est bien configuré)</span>
                </div>`;
        }
    }
    
    // Lancer le chargement
    loadAnnouncements();
</script>
</body>
</html>
