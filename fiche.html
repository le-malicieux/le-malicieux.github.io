<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/bannieres_icones/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="common.css">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Fiche - Le Malicieux</title>
    <script>
        (function(){
            const p = new URLSearchParams(window.location.search).get('name');
            if (p) document.title = p + ' - Le Malicieux';
        })();
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-top: 62px; overflow-x: hidden; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 100px); }
        .back-btn { display: inline-block; text-decoration: none; color: var(--primary); font-weight: bold; margin-bottom: 20px; border: 1px solid var(--primary); padding: 6px 12px; border-radius: 6px; font-size: 0.85em; cursor: pointer; }
        .back-btn:hover { background: var(--primary); color: white; }
        .anime-header { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 30px; }
        .top-info { display: flex; gap: 25px; margin-bottom: 25px; }
        .main-details { flex: 1; min-width: 0; }
        .anime-title { font-size: 2em; color: var(--primary); margin: 0 0 15px; }
        
        /* Grille d'informations */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
        .stat-item { background: #222; padding: 8px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .stat-item small { color: var(--primary); font-size: 0.65em; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .stat-item span { font-weight: bold; font-size: 0.85em; }
        .stat-item.mal-live { border-color: #2e86de; }
        .mal-loading { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7em; color: #888; margin-bottom: 10px; }
        .mal-loading .dot { width: 5px; height: 5px; background: #2e86de; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity:0.2; } 50% { opacity:1; } }

        .bottom-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .playlist-box { background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        select { background: #333; color: #fff; border: 1px solid #555; padding: 8px; width: 100%; border-radius: 4px; margin-bottom: 10px; font-size: 0.85em; }
        .ep-row { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin-bottom: 12px; }
        .star-rating { font-size: 1.3em; color: #444; cursor: pointer; margin: 10px 0; text-align: center; display: flex; justify-content: center; gap: 2px; }
        .star-rating span.active { color: #f1c40f; }
        .link-box { background: rgba(255,71,87,0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,71,87,0.3); }
        .link-title { font-size: 0.75em; font-weight: bold; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; }
        .btn-link { display: block; background: #333; color: white; text-decoration: none; padding: 8px; border-radius: 5px; margin-bottom: 6px; font-size: 0.85em; text-align: center; border: 1px solid #444; }
        .btn-link:hover { background: var(--primary); }
        .btn-delete { background: none; color: #ff4757; border: 1px solid #ff4757; padding: 6px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.75em; margin-top: 10px; }
        .mal-link { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7em; color: #2e86de; text-decoration: none; margin-top: 4px; }
        .related-row { display: flex; gap: 16px; margin-bottom: 15px; flex-wrap: wrap; }
        .related-section { flex: 1; min-width: 0; }
        .related-label { font-size: 0.65em; color: var(--primary); font-weight: bold; margin-bottom: 6px; }
        .related-card { display: flex; align-items: center; gap: 8px; background: #222; border: 1px solid #333; border-radius: 8px; padding: 6px; text-decoration: none; }
        .related-card:hover { border-color: var(--primary); }
        .related-card img { width: 48px; height: 66px; object-fit: cover; border-radius: 4px; }
        .related-card span { font-size: 0.75em; color: #ccc; flex: 1; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1a1a1a; border: 1px solid #444; border-radius: 12px; padding: 20px; max-width: 320px; text-align: center; }
        .modal-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
        .modal-btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .modal-btn-cancel { background: #333; color: #ccc; }
        .modal-btn-confirm { background: var(--primary); color: white; }

        .comments-section { margin-top: 20px; background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .seekstreaming-section { margin-top: 20px; background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .seekstreaming-section h3 { font-size: 1.1em; margin: 0 0 15px; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
        .seek-episode-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .seek-ep-btn { background: #222; border: 2px solid #444; color: #ccc; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: 600; transition: all 0.2s; letter-spacing: 0.02em; }
        .seek-ep-btn:hover { border-color: var(--primary); color: white; background: rgba(255,71,87,0.12); transform: translateY(-1px); }
        .seek-ep-btn.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: bold; box-shadow: 0 4px 12px rgba(255,71,87,0.4); transform: translateY(-1px); }
        .seek-player-wrap { position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid #333; margin-top: 12px; }
        .seek-player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .close-player-btn { background: #333; color: white; border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .close-player-btn:hover { background: #ff4757; }
        .seek-available-banner { display: none; background: linear-gradient(90deg, rgba(255,71,87,0.12), rgba(255,71,87,0.05)); border: 1px solid rgba(255,71,87,0.35); border-radius: 8px; padding: 9px 14px; font-size: 0.8em; color: #ccc; line-height: 1.5; margin-bottom: 18px; }
        .seek-available-banner strong { color: var(--primary); }

        /* ══════════ CARROUSEL MULTI-IMAGES ══════════ */
        .cover-carousel { position: relative; width: 260px; flex-shrink: 0; }
        .cover-track { width: 100%; border-radius: 10px; overflow: hidden; background: #111; aspect-ratio: 2/3; cursor: zoom-in; display: block; }
        .cover-img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
        
        /* Flèches et points sous l'image */
        .cover-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .cover-nav { background: #222; border: 1px solid #444; color: white; width: 30px; height: 30px; font-size: 1.2em; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
        .cover-nav:hover { background: var(--primary); }
        .cover-nav[disabled] { opacity: 0.25; cursor: default; }
        .cover-nav[disabled]:hover { background: #222; }
        .cover-dots { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; flex: 1; margin: 0 10px; }
        .cover-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; border: 1px solid rgba(0,0,0,0.5); transition: background 0.15s; }
        .cover-dot.active { background: var(--primary); }
        
        .cover-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 10000; align-items: center; justify-content: center; cursor: zoom-out; }
        .cover-lightbox.active { display: flex; }
        .cover-lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; box-shadow: 0 0 40px rgba(0,0,0,0.95); }

        @media (max-width: 800px) {
            .top-info { flex-direction: row; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
            .cover-carousel { width: 110px; max-width: 110px; }
            .cover-nav { width: 24px; height: 24px; font-size: 0.9em; }
            .cover-dots { gap: 3px; }
            .cover-dot { width: 6px; height: 6px; }
            .anime-title { font-size: 1.15em; line-height: 1.25; }
            .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 6px !important; }
            .bottom-controls { grid-template-columns: 1fr; }
        }
        @media (max-width: 420px) {
            .cover-carousel { width: 88px; max-width: 88px; }
            .anime-title { font-size: 1.02em; }
        }
    </style>
</head>

                <a class="nav-brand" href="index.html">

    <div class="container">
        <a href="index.html" id="back-link" class="back-btn" onclick="handleBack(event)">Retour au catalogue</a>
        <div id="seek-banner" class="seek-available-banner"><strong>Épisodes disponibles</strong> sous-titrés en VOSTFR / VOSTE / VOSTA en 1080p (ou parfois 720p) — directement sur ce site, voir plus bas.</div>
        <div id="anime-details">Chargement des données...</div>

        <div id="seekstreaming-section" class="seekstreaming-section" style="display:none;">
            <h3>Regarder en streaming</h3>
            <div class="seek-episode-list" id="seek-episode-list"></div>
            <div class="seek-player-wrap" id="seek-player-wrap" style="display:none;">
                <iframe id="seek-iframe" allowfullscreen webkitallowfullscreen mozallowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <div class="comments-section">
            <h3 style="font-size:1.1em;">Commentaires</h3>
            <textarea id="comment-input" style="width:100%; background:#222; border:1px solid #444; color:white; padding:8px; border-radius:5px; margin-bottom:10px; resize:none;" rows="2" placeholder="Ajouter un commentaire..."></textarea>
            <button id="btn-post" style="background:var(--primary); color:white; border:none; padding:8px 25px; border-radius:5px; cursor:pointer; font-weight:bold;">Publier</button>
            <div id="comments-display" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="confirm-modal"><div class="modal-box"><p id="modal-msg"></p><div class="modal-actions"><button class="modal-btn modal-btn-cancel" id="modal-cancel">Annuler</button><button class="modal-btn modal-btn-confirm" id="modal-confirm">Supprimer</button></div></div></div>
    <div class="cover-lightbox" id="cover-lightbox"><img id="cover-lightbox-img" alt=""></div>

<script type="module">
    import {
        initCommon, loadAnimes, getCoverPath, renderMetaBadges,
        handleImgError, IMG_LOGO, auth, db, onAuthStateChanged,
        doc, getDoc, setDoc, deleteDoc, collection, addDoc,
        query, where, onSnapshot, getDocs, serverTimestamp,
        getCurrentUser, searchAnimes, highlightTitle
    } from './common.js';

    initCommon();

    const params = new URLSearchParams(window.location.search);
    const animeName = params.get('name');
    let allAnimes = [];
    let anime = null;
    let imagesIndex = {};
    let currentUser = null;
    let userRating = 0;
    let eroticaSet = new Set();

    window.__allAnimesForRandom = allAnimes;

    const cleanStr = s => (s || '').replace(/^\uFEFF/, '').trim();

    async function loadErotica() {
        try {
            const resp = await fetch('plsero_liste.csv');
            if (resp.ok) {
                const text = await resp.text();
                text.split(/\r?\n/).forEach(l => { 
                    const n = cleanStr(l); 
                    if (n && n !== 'Studios Erotica') eroticaSet.add(n); 
                });
            }
        } catch(e) {}
    }

    async function load() {
        const display = document.getElementById('anime-details');
        try {
            await loadErotica();
            [allAnimes, imagesIndex] = await Promise.all([
                loadAnimes(),
                fetch('images.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
            ]);
            window.__allAnimesForRandom = allAnimes;

            anime = allAnimes.find(a => a.nom === animeName);
            if (!anime) { display.innerHTML = "Anime non trouvé."; return; }

            const epMatches = anime.ep.match(/\d+/g);
            const maxEp = epMatches ? parseInt(epMatches[epMatches.length - 1]) : 0;
            let epOptions = '';
            for (let i = 0; i <= maxEp; i++) epOptions += `<option value="${i}">${i}</option>`;

            const tagsHtml = anime.tags
                ? anime.tags.split(',').filter(t => t.trim()).map(t => {
                    const tag = t.trim();
                    return `<a href="tags.html?tags=${encodeURIComponent(tag)}" style="display:inline-block; background:rgba(255,255,255,0.05); color:#aaa; text-decoration:none; font-size:0.7em; padding:4px 6px; border-radius:4px; border:1px solid #333; margin:2px;">${tag}</a>`;
                  }).join('')
                : '<div style="color:#555; font-size:0.7em;">Aucun tag</div>';

            const indexByName = {};
            allAnimes.forEach(a => { indexByName[a.nom] = a; });

            const makeRelatedCards = listStr => {
                const names = listStr ? listStr.split(',').map(s => s.trim()).filter(Boolean) : [];
                return names.map(name => {
                    const target = indexByName[name];
                    const imgSrc = target ? getCoverPath(target.ordreAjout, 1) : IMG_LOGO;
                    return `<a href="fiche.html?name=${encodeURIComponent(name)}" class="related-card"><img src="${imgSrc}" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${name}</span></a>`;
                }).join('');
            };

            const relatedSection = (anime.prequels || anime.sequels) ? `
                <div class="related-row">
                    ${anime.prequels ? `<div class="related-section"><div class="related-label">Préquel(s)</div>${makeRelatedCards(anime.prequels)}</div>` : ''}
                    ${anime.sequels ? `<div class="related-section"><div class="related-label">Suite(s)</div>${makeRelatedCards(anime.sequels)}</div>` : ''}
                </div>` : '';

            const generatePlsLinks = (str, type) => {
                if (!str) return '';
                return str.split(',').map(s => s.trim()).filter(Boolean).map(name => 
                    `<a href="pls.html#${eroticaSet.has(name) ? 'erotica' : 'hentai'}/grid/${type}/${encodeURIComponent(name).replace(/%2F/g, '§')}" class="pls-link-badge">${name}</a>`
                ).join('');
            };
            const prodLinks = generatePlsLinks(anime.producteur, 'producer');
            const labelLinks = generatePlsLinks(anime.label, 'label');
            const studioLinks = generatePlsLinks(anime.studio, 'studio');

            let plsHtml = '';
            if (prodLinks || labelLinks || studioLinks) {
                plsHtml = `
                <div class="anime-pls-row">
                    ${prodLinks ? `<div class="pls-group"><span class="pls-label">Producteur</span> <div class="pls-items">${prodLinks}</div></div>` : ''}
                    ${labelLinks ? `<div class="pls-group"><span class="pls-label">Label</span> <div class="pls-items">${labelLinks}</div></div>` : ''}
                    ${studioLinks ? `<div class="pls-group"><span class="pls-label">Studio</span> <div class="pls-items">${studioLinks}</div></div>` : ''}
                </div>`;
            }

            const cover1 = getCoverPath(anime.ordreAjout, 1);

            display.innerHTML = `
                <div class="anime-header">
                    <div class="top-info">
                        <div class="cover-carousel" id="cover-carousel">
                            <div class="cover-track" id="cover-track">
                                <img class="cover-img" id="cover-img" src="${cover1}" alt="${anime.nom}" onerror="handleImgError(this, '${anime.ordreAjout}-1.webp')">
                            </div>
                            <div class="cover-controls">
                                <button class="cover-nav cover-prev" aria-label="Image précédente">‹</button>
                                <div class="cover-dots" id="cover-dots"></div>
                                <button class="cover-nav cover-next" aria-label="Image suivante">›</button>
                            </div>
                        </div>
                        <div class="main-details">
                            <h1 class="anime-title">${anime.nom}</h1>
                            <div class="stats-grid">
                                <div class="stat-item"><small>Pop.</small><span id="stat-pop">${anime.pop}</span></div>
                                <div class="stat-item"><small>Score</small><span id="stat-score">${anime.score}</span></div>
                                <div class="stat-item"><small>Sortie</small><span id="stat-sortie">${anime.sortie}</span></div>
                                <div class="stat-item"><small>Épisodes</small><span>${anime.ep}</span></div>
                                <div class="stat-item"><small>Censure</small><span>${anime.censure}</span></div>
                                <div class="stat-item"><small>État</small><span id="stat-etat">${anime.etat}</span></div>
                            </div>
                            <div id="mal-badge" style="margin-top:10px;"><span class="mal-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span>Chargement MAL…</span></div>
                            <p style="font-size:0.85em; color:#ccc; line-height:1.5; margin-top:10px;">${anime.description}</p>
                            ${plsHtml}
                        </div>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:${relatedSection ? '10px' : '15px'};">${tagsHtml}</div>
                    ${relatedSection}
                    <div class="bottom-controls">
                        <div class="playlist-box">
                            <label style="font-size:0.65em; color:var(--primary);">Ma Progression</label>
                            <select id="user-status">
                                <option value="none">— Pas dans la liste</option>
                                <option value="watching">En cours</option>
                                <option value="waiting">En attente</option>
                                <option value="completed">Terminé</option>
                            </select>
                            <div class="ep-row"><span>Vu :</span><select id="user-ep">${epOptions}</select><span>/ ${maxEp}</span></div>
                            <div class="star-rating" id="stars">${Array.from({ length: 10 }, (_, i) => `<span data-v="${i + 1}">★</span>`).join('')}</div>
                            <div id="added-at-label" style="font-size:0.65em; color:#666; margin-top:4px; text-align:center;"></div>
                            <div id="completed-at-label" style="font-size:0.65em; color:#2e86de; margin-top:2px; text-align:center; display:none;"></div>
                            <button class="btn-delete" id="delete-btn">Retirer de ma liste</button>
                        </div>
                        <div class="link-box">
                            <div class="link-title">Téléchargement</div>
                            <div id="dl-area" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;"></div>
                            <div class="link-title" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">Visionnage</div>
                            <div id="stream-area" style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px;"></div>
                            <div id="infov-area"></div>
                        </div>
                    </div>
                </div>`;

            const getDomainLabel = (url, prefix) => {

    function initCoverCarousel(ordreAjout, imagesIndex) {
        const track = document.getElementById('cover-track');
        const img = document.getElementById('cover-img');
        const prevBtn = document.querySelector('.cover-prev');
        const nextBtn = document.querySelector('.cover-next');
        const dotsEl = document.getElementById('cover-dots');
        const lightbox = document.getElementById('cover-lightbox');
        const lightboxImg = document.getElementById('cover-lightbox-img');

        const nums = (imagesIndex[String(ordreAjout)] || []).slice();
        if (!nums.length) {
            img.src = IMG_LOGO;
            img.onerror = null;
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            dotsEl.innerHTML = '';
            track.onclick = null;
            return;
        }

        let current = 0;
        const total = nums.length;

        function show(i) {
            current = Math.max(0, Math.min(total - 1, i));
            img.src = getCoverPath(ordreAjout, nums[current]);
            img.dataset.tried = '';
            img.onerror = function() { handleImgError(this, `${ordreAjout}-${nums[current]}.webp`); };
            [current - 1, current + 1].forEach(j => {
                if (j >= 0 && j < total) {
                    const pre = new Image();
                    pre.src = getCoverPath(ordreAjout, nums[j]);
                }
            });
            dotsEl.querySelectorAll('.cover-dot').forEach((d, k) => d.classList.toggle('active', k === current));
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        if (total > 1) {
            dotsEl.innerHTML = nums.map((_, i) => `<span class="cover-dot" data-i="${i}"></span>`).join('');
            dotsEl.querySelectorAll('.cover-dot').forEach(d => {
                d.onclick = (e) => { e.stopPropagation(); show(parseInt(d.dataset.i)); };
            });
            prevBtn.onclick = (e) => { e.stopPropagation(); show(current - 1); };
            nextBtn.onclick = (e) => { e.stopPropagation(); show(current + 1); };
        } else {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        }

        let startX = 0, startY = 0;
        track.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });
        track.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                show(dx > 0 ? current - 1 : current + 1);
            }
        }, { passive: true });

        track.onclick = () => {
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
        };
        lightbox.onclick = () => lightbox.classList.remove('active');

        show(0);
    }

    const MAL_CACHE_TTL = 12 * 60 * 60 * 1000;
    function malCacheGet(key) {
        try {
            const raw = localStorage.getItem('malcache:' + key);
            if (!raw) return null;
            const obj = JSON.parse(raw);
            if (!obj || (Date.now() - obj.t) > MAL_CACHE_TTL) return null;
            return obj.data;
        } catch (e) { return null; }
    }
    function malCacheSet(key, data) {
        try { localStorage.setItem('malcache:' + key, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
    }
    async function fetchJikanOnce(url, timeoutMs = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try { return await fetch(url, { signal: controller.signal }); }
        finally { clearTimeout(timer); }
    }
    async function fetchJikanWithRetry(url, attempts = 3) {
        let lastErr = null;
        for (let i = 0; i < attempts; i++) {
            try {
                const resp = await fetchJikanOnce(url);
                if (resp.ok) return resp;
                if ((resp.status === 429 || resp.status >= 500) && i < attempts - 1) {
                    await new Promise(r => setTimeout(r, 500 * (i + 1)));
                    continue;
                }
                return resp;
            } catch (e) {
                lastErr = e;
                if (i < attempts - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
            }
        }
        if (lastErr) throw lastErr;
        return null;
    }
    async function fetchMALData(nom, malId) {
        const cacheKey = (malId && malId.trim()) ? 'id:' + malId.trim() : 'q:' + nom.split('/')[0].trim().toLowerCase();
        const cached = malCacheGet(cacheKey);
        if (cached) return cached;
        try {
            let item = null;
            if (malId && malId.trim()) {
                const resp = await fetchJikanWithRetry(`https://api.jikan.moe/v4/anime/${malId.trim()}`);
                if (!resp || !resp.ok) return null;
                const json = await resp.json();
                if (!json.data) return null;
                item = json.data;
            } else {
                const q = nom.split('/')[0].trim();
                const resp = await fetchJikanWithRetry(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=1&sfw=false`);
                if (!resp || !resp.ok) return null;
                const json = await resp.json();
                if (!json.data || json.data.length === 0) return null;
                item = json.data[0];
            }
            const result = { score: item.score, popularity: item.popularity, status: item.status, malUrl: item.url, aired: item.aired };
            malCacheSet(cacheKey, result);
            return result;
        } catch (e) { return null; }
    }

        if (badge && malData.malUrl) badge.innerHTML = `<a href="${malData.malUrl}" target="_blank" class="mal-link">Voir sur MyAnimeList</a>`;

    async function loadSeekstreaming() {
        if (!animeName) return;
        try {
            const resp = await fetch('stream.csv');
            if (!resp.ok) return;
            const text = await resp.text();
            const lines = text.split(/\r?\n/).slice(1).filter(l => l.trim());
            const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[-_\s]+/g, ' ').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
            const specialKeywords = ['special', 'bonus', 'deleted scenes', 'art gallery'];
            const miniCategories = [
                { key: 'special', label: 'Special' },
                { key: 'bonus', label: 'Bonus' },
                { key: 'deleted scenes', label: 'Deleted Scenes' },
                { key: 'art gallery', label: 'Art Gallery' }
            ];
            const cleanRawTitle = raw => {
                let s = raw.trim();
                while (/^[\[\(]/.test(s)) s = s.replace(/^[\[\(][^\]\)]*[\]\)]\s*/, '');
                return s.replace(/\[[^\]]*\]/g, '').replace(/\.(mkv|mp4|avi|mov)$/i, '').replace(/[-_]+/g, ' ').trim();
            };
            const formatNum = n => {
                if (n == null || isNaN(n)) return '';
                if (Number.isInteger(n)) return String(n).padStart(2, '0');
                const [i, d] = n.toFixed(1).split('.');
                return i.padStart(2, '0') + '.' + d;
            };
            const parseEnhanced = raw => {
                let cleaned = cleanRawTitle(raw);
                let mSeason = cleaned.match(/^(.*?)\s+s(\d+)\s+(\d+(?:\.\d+)?)(?:\s*(vostfr|vf|sub|vo|fr))?\s*$/i);
                if (mSeason) return { animeTitle: mSeason[1].trim(), season: parseInt(mSeason[2]), episode: parseFloat(mSeason[3]), specialType: null, specialNumber: null };
                let mBare = cleaned.match(/^(.*?)\s+([1-9]\d?)\s+(\d{1,4}(?:\.\d+)?)(?:\s*(vostfr|vf|sub|vo|fr))?\s*$/i);
                if (mBare) return { animeTitle: mBare[1].trim(), season: parseInt(mBare[2]), episode: parseFloat(mBare[3]), specialType: null, specialNumber: null };
                let mEp = cleaned.match(/^(.*?)\s+(\d+(?:\.\d+)?)(?:\s*(vostfr|vf|sub|vo|fr))?\s*$/i);
                if (mEp) {
                    let titlePart = mEp[1].trim(), epNum = parseFloat(mEp[2]), foundSpecial = null;
                    for (let kw of specialKeywords) {
                        const r = new RegExp(`\\b${kw}\\s*(\\d+(?:\\.\\d+)?)?\\b`, 'i');
                        const match = titlePart.match(r);
                        if (match) { foundSpecial = { type: kw, num: match[1] ? parseFloat(match[1]) : epNum }; titlePart = titlePart.replace(r, '').trim(); break; }
                    }
                    if (foundSpecial) return { animeTitle: titlePart, season: 1, episode: null, specialType: foundSpecial.type, specialNumber: foundSpecial.num };
                    return { animeTitle: titlePart, season: 1, episode: epNum, specialType: null, specialNumber: null };
                }
                return { animeTitle: cleaned.trim(), season: 1, episode: null, specialType: null, specialNumber: null };
            };
            const normalizeForMatch = title => {
                let t = title.toLowerCase();
                for (let kw of specialKeywords) t = t.replace(new RegExp(`\\b${kw}\\s*\\d*(?:\\.\\d+)?\\b`, 'g'), '');
                t = t.replace(/\b\d+(?:\.\d+)?\b/g, '');
                return norm(t);
            };
            const rows = lines.map(line => {
                const parts = line.split(',');
                if (parts.length < 5) return null;
                return { title: parts[0].trim(), poster: parts.slice(1, parts.length - 3).join(',').trim(), resolution: parts[parts.length - 3].trim(), watch: parts[parts.length - 1].trim() };
            }).filter(Boolean);
            rows.forEach(r => { const p = parseEnhanced(r.title); Object.assign(r, p); r.normAnime = normalizeForMatch(r.animeTitle); });
            const pageNorm = normalizeForMatch(animeName);
            const resArea = r => { const m = String(r).match(/(\d+)\s*x\s*(\d+)/i); return m ? parseInt(m[1]) * parseInt(m[2]) : 0; };
            const dedupe = list => { const m = new Map(); list.forEach(r => { const k = [r.season, r.episode, r.specialType, r.specialNumber].join('|'); const e = m.get(k); if (!e || resArea(r.resolution) > resArea(e.resolution)) m.set(k, r); }); return Array.from(m.values()); };
            const matched = dedupe(rows.filter(r => r.normAnime === pageNorm));
            if (!matched.length) return;
            const priority = { null: 0, special: 1, bonus: 2, 'deleted scenes': 3, 'art gallery': 4 };
            matched.sort((a, b) => a.season !== b.season ? a.season - b.season : (priority[a.specialType] ?? 99) - (priority[b.specialType] ?? 99) || (a.specialNumber ?? a.episode ?? 0) - (b.specialNumber ?? b.episode ?? 0));
            const section = document.getElementById('seekstreaming-section');
            const list = document.getElementById('seek-episode-list');
            const wrap = document.getElementById('seek-player-wrap');
            const iframe = document.getElementById('seek-iframe');
            section.style.display = '';
            document.getElementById('seek-banner').style.display = 'block';
            list.innerHTML = ''; list.style.flexDirection = 'column'; list.style.gap = '14px';
            const hardSetSrc = url => { iframe.src = 'about:blank'; setTimeout(() => iframe.src = url, 30); };
            const closePlayer = () => { iframe.src = 'about:blank'; wrap.style.display = 'none'; document.querySelectorAll('.seek-ep-btn').forEach(b => b.classList.remove('active')); };
            const loadEp = (row, btn) => { document.querySelectorAll('.seek-ep-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); wrap.style.display = ''; hardSetSrc(row.watch); };
            const header = section.querySelector('h3');
            if (header && !section.querySelector('.close-player-btn')) {
                const cb = document.createElement('button'); cb.textContent = 'Fermer le lecteur'; cb.className = 'close-player-btn'; cb.onclick = closePlayer; header.appendChild(cb);
            }
            if (!section.querySelector('.seek-download-note')) {
                const n = document.createElement('div');
                n.className = 'seek-download-note';
                n.style.cssText = 'font-size:0.8em;color:#999;margin-bottom:10px;';
                n.textContent = 'Le téléchargement de la vidéo est disponible directement depuis le lecteur.';
                section.insertBefore(n, list);
            }
            const labelFor = r => r.specialType ? `${r.specialType.split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')} ${formatNum(r.specialNumber)}` : r.episode !== null ? `Épisode ${formatNum(r.episode)}` : 'Film / OAV';
            const makeEpBtn = r => { const b = document.createElement('button'); b.className = 'seek-ep-btn'; b.textContent = labelFor(r); b.title = r.title; b.addEventListener('click', () => loadEp(r, b)); return b; };
            const makeLabel = t => { const el = document.createElement('div'); el.style.cssText = 'font-size:0.8em;font-weight:bold;color:var(--primary);text-transform:uppercase;letter-spacing:0.05em;padding-bottom:4px;border-bottom:1px solid rgba(255,71,87,0.3);width:100%;'; el.textContent = t; return el; };
            const appendGroups = (rowsScope, target) => {
                const normalRows = rowsScope.filter(r => r.specialType === null);
                if (normalRows.length) { const g = document.createElement('div'); g.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;'; normalRows.forEach(r => g.appendChild(makeEpBtn(r))); target.appendChild(g); }
                miniCategories.forEach(cat => {
                    const catRows = rowsScope.filter(r => r.specialType === cat.key);
                    if (!catRows.length) return;
                    target.appendChild(makeLabel(cat.label));
                    const g = document.createElement('div'); g.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;'; catRows.forEach(r => g.appendChild(makeEpBtn(r))); target.appendChild(g);
                });
            };
            const seasons = [...new Set(matched.map(r => r.season))].sort((a, b) => a - b);
            if (seasons.length > 1) {
                seasons.forEach(s => {
                    const sr = matched.filter(r => r.season === s);
                    const blk = document.createElement('div'); blk.style.cssText = 'display:flex;flex-direction:column;gap:10px;width:100%;';
                    const lbl = document.createElement('div'); lbl.style.cssText = 'font-size:0.9em;font-weight:bold;color:#fff;text-transform:uppercase;letter-spacing:0.05em;'; lbl.textContent = `Saison ${s}`;
                    blk.appendChild(lbl); appendGroups(sr, blk); list.appendChild(blk);
                });
            } else appendGroups(matched, list);
        } catch (e) { console.warn('SeekStreaming load error:', e); }
    }

        if (val.length < 2) { searchSuggestions.classList.remove('active'); return; }
        const results = searchAnimes(val, allAnimes, 8);
        if (results.length === 0) searchSuggestions.innerHTML = '<div class="sugg-empty">Aucun résultat</div>';
        else searchSuggestions.innerHTML = results.map(a => `<div class="suggestion-item" data-name="${a.nom.replace(/"/g, '&quot;')}"><img src="${getCoverPath(a.ordreAjout, 1)}" class="sugg-img" onerror="this.onerror=null;this.src='${IMG_LOGO}'"><span>${highlightTitle(a.nom, val)}</span></div>`).join('');
        searchSuggestions.classList.add('active');
    });
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const val = this.value.trim();
            if (val) window.location.href = 'index.html?search=' + encodeURIComponent(val);
            searchSuggestions.classList.remove('active');
            this.blur();
        }
    });
    searchSuggestions.addEventListener('click', function(e) {
        const item = e.target.closest('.suggestion-item');
        if (item && item.dataset.name) window.location.href = 'fiche.html?name=' + encodeURIComponent(item.dataset.name);
    });
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrapper')) searchSuggestions.classList.remove('active');
    });

    load();
</script>
</body>
</html>
